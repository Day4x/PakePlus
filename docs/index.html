t":"无产阶级要保持在民主革命中的领导权，必须建立和发展人民的革命武装力量。保证领导权的坚强支柱 是（ ）。","options":[{"text":"广泛的统一战线","correct":false},{"text":"巩固的工农联盟","correct":false},{"text":"建立一支无产阶级领导的以农民为主体的强大的革命武装","correct":true},{"text":"无产阶级政党的正确的科学的领导","correct":false}],"answer":"C","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-38","number":38,"type":"single","typeLabel":"单选题","text":"毛泽东指出：“民主革命是社会主义革命的必要准备，社会主义革命是民主革命的必然趋势。”这一论 述阐明了两个革命之间的关系。两个革命之间不容横插一个（ ）。","options":[{"text":"无产阶级专政","correct":false},{"text":"资产阶级专政","correct":true},{"text":"工农民主专政","correct":false},{"text":"各革命阶级联合专政","correct":false}],"answer":"B","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-39","number":39,"type":"single","typeLabel":"单选题","text":"没收官僚资本，包含着新民主主义革命和社会主义革命的双重性质。通过没收官僚资本建立起来的具有 社会主义性质的国营经济，在新民主主义社会的多种经济成分中居于（ ）。","options":[{"text":"辅助地位","correct":false},{"text":"平等地位","correct":false},{"text":"领导地位","correct":true},{"text":"从属地位","correct":false}],"answer":"C","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-40","number":40,"type":"single","typeLabel":"单选题","text":"中国革命走农村包围城市、武装夺取政权的道路，根本在于处理好土地革命、武装斗争、农村革命根据 地建设三者之间的关系。其中，中国革命的战略阵地是（ ）。","options":[{"text":"土地革命","correct":false},{"text":"武装斗争","correct":false},{"text":"农村革命根据地","correct":true},{"text":"全国各大中城市","correct":false}],"answer":"C","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-41","number":41,"type":"single","typeLabel":"单选题","text":"毛泽东指出：“当人民推翻了帝国主义、封建主义和官僚资本主义的统治之后，中国要向哪里去？向资 本主义，还是向社会主义？……事实已经回答了这个问题：（ ）。”","options":[{"text":"资本主义能够救中国","correct":false},{"text":"只有社会主义能够救中国","correct":true},{"text":"改良主义能够救中国","correct":false},{"text":"多种道路并存能够救中国","correct":false}],"answer":"B","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-42","number":42,"type":"single","typeLabel":"单选题","text":"社会主义基本制度的确立，使广大劳动人民真正成为国家的主人。这一变化最根本的表现是（ ）。","options":[{"text":"极大地巩固和扩大了人民民主专政国家政权的阶级基础","correct":false},{"text":"极大地巩固和扩大了人民民主专政国家政权的经济基础","correct":false},{"text":"中国几千年来阶级关系发生最根本的变革","correct":false},{"text":"实现了生产资料公有制，消灭了剥削制度","correct":true}],"answer":"D","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-43","number":43,"type":"single","typeLabel":"单选题","text":"《论十大关系》中，前五条主要讨论经济问题。其中，前三条讲的是重工业和轻工业、农业的关系，沿 海工业和内地工业的关系，经济建设和国防建设的关系。这三条实际上是在论述（ ）。","options":[{"text":"如何处理中央和地方的关系","correct":false},{"text":"如何开辟一条和苏联有所不同的中国工业化道路问题","correct":true},{"text":"如何在社会主义初级阶段进行经济体制改革","correct":false},{"text":"如何处理国家、集体和个人三者的关系","correct":false}],"answer":"B","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-44","number":44,"type":"single","typeLabel":"单选题","text":"毛泽东提出，我们的目标是“造成一个又有集中又有民主，又有纪律又有自由，又有统一意志、又有个 人心情舒畅、生动活泼，那样一种政治局面”。这一目标的实现途径是（ ）。","options":[{"text":"强化集中统一，严格限制个人自由","correct":false},{"text":"发展社会主义民主政治，健全社会主义法制","correct":true},{"text":"实行多党轮流执政的西方民主模式","correct":false},{"text":"取消纪律约束，维护个人自由","correct":false}],"answer":"B","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-1","number":1,"type":"multiple","typeLabel":"多选题","text":"手工业的社会主义改造，就是逐步引导手工业者走社会主义集体化道路，是党在过渡时期总路线和总任务 不可缺少的组成部分。在这一过程中，党和政府采取（ ）的方法，使手工业者自愿参加到手工业合作社中来。","options":[{"text":"说服教育","correct":true},{"text":"典型示范","correct":true},{"text":"分类指导","correct":false},{"text":"国家帮助","correct":true}],"answer":"ABD","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-2","number":2,"type":"multiple","typeLabel":"多选题","text":"在资本主义工商业的社会主义改造过程中，初级形式的国家资本主义是国家对私营工商业实行（ ）等。","options":[{"text":"委托加工","correct":true},{"text":"计划订货","correct":true},{"text":"统购包销","correct":true},{"text":"注资收购","correct":false}],"answer":"ABC","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-3","number":3,"type":"multiple","typeLabel":"多选题","text":"初级形式的国家资本主义对私营工业的利润，按（ ）等方面进行分配。","options":[{"text":"国家所得税","correct":true},{"text":"企业公积金","correct":true},{"text":"工人福利费","correct":true},{"text":"资方红利","correct":true}],"answer":"ABCD","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-4","number":4,"type":"multiple","typeLabel":"多选题","text":"我国的社会主义改造是在加强和发展工农联盟，继续保持同民族资产阶级的统一战线的基础上进行的。在 资本主义工商业的社会主义改造中，国家对资方在职人员和资方代理人采取（ ），通过改造阶级成分的方式 达到从整体上消灭资产阶级的目的。","options":[{"text":"在政治上适当安排","correct":true},{"text":"在工作上发挥作用","correct":true},{"text":"在领导上允许参与","correct":false},{"text":"在生活上妥善照顾","correct":true}],"answer":"ABD","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-5","number":5,"type":"multiple","typeLabel":"多选题","text":"为适应公私合营高潮迅速到来的形势，中共中央和国务院正确地制定并实行了对资产阶级的以和平赎买、 从宽照顾为核心的一系列方针政策，保证了对资本主义工商业社会主义改造的顺利进行。对资产阶级的和平 赎买不仅有利于资本家接受改造，而且能继续发挥私营工商业在（ ）等方面的积极作用。","options":[{"text":"扩大生产","correct":true},{"text":"维持就业","correct":true},{"text":"增加税收","correct":true},{"text":"统购统销","correct":false}],"answer":"ABC","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-6","number":6,"type":"multiple","typeLabel":"多选题","text":"在社会主义改造过程中，中国共产党创造了一系列适合中国特点的由初级到高级逐步过渡的形式，使个体 农民、手工业者和私营工商业者能够循序渐进地改变旧的生产方式。我国对资本主义工商业的改造采取赎买 的方针，所谓赎买就是（ ）。","options":[{"text":"彻底解决国内民族资产阶级和工人阶级的对抗性矛盾的方式","correct":false},{"text":"国家有偿地将私营企业改变为国营企业","correct":true},{"text":"让资本家在一定年限内从企业经营所得中获取一部分利润","correct":true},{"text":"将资本主义私有制改变为半社会主义性质的集体所有制","correct":false}],"answer":"BC","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-7","number":7,"type":"multiple","typeLabel":"多选题","text":"我国对资本主义工商业的社会主义改造经历了三个步骤。第一步主要实行初级形式的国家资本主义；第二 步主要实行个别企业的公私合营；第三步是实行全行业的公私合营。从个别企业的公私合营到全行业公私合 营，是（ ）。","options":[{"text":"党和国家对资本主义工商业采取利用、限制、改造政策的必然趋势","correct":true},{"text":"经济运行中计划不断强化的必然结果","correct":true},{"text":"更好地从全局出发有计划地安排生产，保证国家重点建设顺利进行的必然要求","correct":true},{"text":"我国进入社会主义社会最主要的标志","correct":false}],"answer":"ABC","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-8","number":8,"type":"multiple","typeLabel":"多选题","text":"新民主主义社会是（ ）。","options":[{"text":"中国由新民主主义转变到社会主义的过渡性的社会形态","correct":true},{"text":"独立的社会形态","correct":false},{"text":"属于社会主义体系的逐步过渡到社会主义社会的过渡性的社会","correct":true},{"text":"既有社会主义因素又有非社会主义因素存在的社会","correct":true}],"answer":"ACD","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-9","number":9,"type":"multiple","typeLabel":"多选题","text":"与新民主主义时期三种主要的经济成分相联系，新民主主义社会的阶级构成主要表现为三种基本的阶级力 量，它们是（ ）。","options":[{"text":"工人阶级","correct":true},{"text":"大资产阶级","correct":false},{"text":"农民阶级和其他小资产阶级","correct":true},{"text":"民族资产阶级","correct":true}],"answer":"ACD","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-10","number":10,"type":"multiple","typeLabel":"多选题","text":"对于新民主主义社会何时和怎样过渡到社会主义社会的问题，毛泽东和党的其他领导人的认识经历了一 个逐步发展变化的过程，他们先后有过的思路包括（ ）。","options":[{"text":"先搞工业化建设，再一举过渡","correct":true},{"text":"建设和改造同时并举、从中华人民共和国成立起即逐步过渡","correct":true},{"text":"无限期暂缓社会主义革命","correct":false},{"text":"向资本家支付巨额补偿资金","correct":false}],"answer":"AB","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-11","number":11,"type":"multiple","typeLabel":"多选题","text":"新中国成立后，党在马克思列宁主义关于过渡时期理论的指导下，依据中国的具体情况，适时制定了党 在过渡时期的总路线。过渡时期总路线的“两翼”是（ ）。","options":[{"text":"实现国家的社会主义工业化","correct":false},{"text":"实现对农业的社会主义改造","correct":true},{"text":"实现对手工业的社会主义改造","correct":true},{"text":"实现对资本主义工商业的社会主义改造","correct":true}],"answer":"BCD","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-12","number":12,"type":"multiple","typeLabel":"多选题","text":"在进行社会主义改造、向社会主义过渡的过程中，中国共产党积累了丰富的历史经验，主要有（ ）。","options":[{"text":"坚持社会主义工业化建设与社会主义改造同时并举","correct":true},{"text":"采取积极引导、逐步过渡的方式","correct":true},{"text":"用和平方法进行改造","correct":true},{"text":"和谐社会构建与社会主义核心价值体系建设同步进行","correct":false}],"answer":"ABC","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-13","number":13,"type":"multiple","typeLabel":"多选题","text":"三大改造时，初级形式的国家资本主义表现为（ ）。","options":[{"text":"委托加工","correct":true},{"text":"计划订货","correct":true},{"text":"统购统销","correct":false},{"text":"经销代销","correct":true}],"answer":"ABD","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-14","number":14,"type":"multiple","typeLabel":"多选题","text":"在党的七届二中全会上，毛泽东将“国家和私人合作的国家资本主义经济”作为新中国的几种主要的经 济成分之一。在新中国社会主义改造过程中，中国共产党采用国家资本主义的方式开展对资本主义工商业的 社会主义改造，即通过在一定的时期内有步骤地、有区别地把一切对国计民生有利的、而又为国家所需要的 资本主义企业基本上改造为国家资本主义企业，并有计划地稳步地使低级形式的国家资本主义向高级形式的 国家资本主义发展。国家资本主义（ ）。","options":[{"text":"是与社会主义直接相联系的、国家直接控制和支配下的资本主义经济","correct":true},{"text":"不是一种独立的经济形态","correct":true},{"text":"其性质取决于生产力的发展水平","correct":false},{"text":"是私人资本主义经济向社会主义国营经济过渡的形式","correct":true}],"answer":"ABD","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-15","number":15,"type":"multiple","typeLabel":"多选题","text":"我国在对个体农业进行社会主义改造的过程中，成功地开辟了一条适合我国情况的农业社会主义改造道 路，其内容主要有（ ）。","options":[{"text":"积极引导农民组织起来，走互助合作道路","correct":true},{"text":"遵循自愿互利、典型示范、国家帮助的原则","correct":true},{"text":"坚持积极领导、稳步前进的方针，采取循序渐进的步骤","correct":true},{"text":"在有条件的地区推广农业生产责任制","correct":false}],"answer":"ABC","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-16","number":16,"type":"multiple","typeLabel":"多选题","text":"新民主主义社会在经济上实行国营经济领导下的合作社经济、个体经济、私人资本主义经济和国家资本 主义经济五种经济成分并存的经济制度，在五种经济成分中，属于过渡形式的经济成分是（ ）。","options":[{"text":"个体经济","correct":false},{"text":"资本主义经济","correct":false},{"text":"国家资本主义经济","correct":true},{"text":"合作社经济","correct":true}],"answer":"CD","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-17","number":17,"type":"multiple","typeLabel":"多选题","text":"以毛泽东为代表的中国共产党人根据马克思列宁主义关于农业社会主义改造的基本原理，从我国农村实 际出发，制定并实行了一整套适合中国特点的对农业进行社会主义改造的方针、政策和办法。土地改革完成 后，我国广大农民从封建剥削制度下解放出来，生产积极性大大提高。这种积极性表现在（ ）的积极性。","options":[{"text":"对外开放","correct":false},{"text":"个体经济","correct":true},{"text":"互助合作","correct":true},{"text":"自愿赎买","correct":false}],"answer":"BC","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-18","number":18,"type":"multiple","typeLabel":"多选题","text":"以毛泽东同志为代表的中国共产党人，从我国农村实际出发，充分利用民主革命胜利后所取得的政治条 件和物质基础，领导中国人民走适合中国特色的社会主义改造道路。其中，农业社会主义改造和手工业社会 主义改造的相同点包括（ ）。","options":[{"text":"采取由低级到高级、循序渐进的步骤","correct":true},{"text":"采取委托加工、计划订货的方法","correct":false},{"text":"采取积极领导、稳步前进的方针","correct":true},{"text":"采用统购包销、经销代销的方法","correct":false}],"answer":"AC","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-19","number":19,"type":"multiple","typeLabel":"多选题","text":"中国共产党根据马克思、恩格斯和列宁关于采用和平方式变革所有制的设想，结合中国的具体情况，提 出了对资本主义工商业实行和平赎买的方针。所谓赎买，就是国家有偿地将私营企业改变为国营企业，将资 本主义私有制改变为社会主义公有制。我国之所以能够对资本主义工商业进行社会主义改造，主要原因是（ ） 。","options":[{"text":"民族资产阶级在社会主义革命阶段的两面性","correct":true},{"text":"国家有偿地将私营企业改变为国营企业","correct":false},{"text":" ter-3-multiple-28","number":28,"type":"multiple","typeLabel":"多选题","text":"党提出向社会主义过渡的总路线的现实依据包括（ ）。","options":[{"text":"社会主义国营经济相对强大和迅速发展","correct":true},{"text":"广大农民具有走互助合作道路的要求","correct":true},{"text":"国家在利用和限制资本主义工商业的过程中积累了经验","correct":true},{"text":"当时的国际形势有利于中国向社会主义过渡","correct":true}],"answer":"ABCD","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-29","number":29,"type":"multiple","typeLabel":"多选题","text":"自愿互利原则是中国对农业和手工业实行社会主义改造的一项基本原则。关于自愿互利原则，下列表述 正确的有（ ）。","options":[{"text":"坚持自愿原则，就是采取耐心说服教育、典型示范和国家帮助的方法","correct":true},{"text":"农民和手工业者是否入社、何时加入，都取决于他们的意愿","correct":true},{"text":"坚持互利原则，就是要合理地处理生产资料入社的折价和收益补偿问题","correct":true},{"text":"自愿互利原则的贯彻，力求把合作社办得对生产者、国家和消费者三方面都有利","correct":true}],"answer":"ABCD","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-30","number":30,"type":"multiple","typeLabel":"多选题","text":"我国之所以能够采取赎买的方式对资本主义工商业进行和平改造，其原因包括（ ）。","options":[{"text":"民族资产阶级在社会主义革命时期具有两面性","correct":true},{"text":"中国共产党与民族资产阶级长期保持着统一战线的关系","correct":true},{"text":"我国已经建立了人民民主专政的国家政权和强大的社会主义国营经济","correct":true},{"text":"当时国家对粮食和工业原料的统购统销使私人资本主义企业只能接受社会主义改造","correct":true}],"answer":"ABCD","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-31","number":31,"type":"multiple","typeLabel":"多选题","text":"无产阶级在同资产阶级建立统一战线时，必须坚持独立自主的原则。这一原则要求保持党在（ ）方面的 独立性。","options":[{"text":"思想上","correct":true},{"text":"政治上","correct":true},{"text":"组织上","correct":true},{"text":"经济上","correct":false}],"answer":"ABC","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-32","number":32,"type":"multiple","typeLabel":"多选题","text":"毛泽东指出，新民主主义革命的“新”体现在多个方面。下列属于新民主主义革命之“新”的表现有（ ） 。","options":[{"text":"新的时代条件——处于世界无产阶级社会主义革命的时代","correct":true},{"text":"新的领导力量——无产阶级及其政党","correct":true},{"text":"新的指导思想——马克思列宁主义","correct":true},{"text":"新的革命前途——资本主义","correct":false}],"answer":"ABC","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-33","number":33,"type":"multiple","typeLabel":"多选题","text":"社会主义基本制度的确立，是马克思列宁主义关于社会主义革命理论在中国的正确运用和创造性发展的 结果。这表明（ ）。","options":[{"text":"马克思列宁主义具有真理性","correct":true},{"text":"中国共产党创造性地运用了马克思列宁主义","correct":true},{"text":"中国社会主义革命道路具有独创性","correct":true},{"text":"中国完全参考了苏联的社会主义革命模式","correct":false}],"answer":"ABC","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-34","number":34,"type":"multiple","typeLabel":"多选题","text":"《论十大关系》后五条论述的是政治生活和思想文化生活领域如何调动各种积极因素的问题，包括（ ）。","options":[{"text":"汉族和少数民族的关系","correct":true},{"text":"党和非党的关系","correct":true},{"text":"革命和反革命的关系","correct":true},{"text":"是非关系和中国与外国的关系","correct":true}],"answer":"ABCD","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-multiple-35","number":35,"type":"multiple","typeLabel":"多选题","text":"党的八大提出，要扩大社会主义民主，加强对于国家工作的监督。这些监督包括（ ）。","options":[{"text":"加强党对于国家机关的领导和监督","correct":true},{"text":"加强全国人民代表大会和它的常务委员会的监督","correct":true},{"text":"加强各级政府机关的由上而下的监督和由下而上的监督","correct":true},{"text":"加强人民群众和机关中的下级工作人员对于国家机关的监督","correct":true}],"answer":"ABCD","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-fill-1","number":1,"type":"fill","typeLabel":"填空题","text":"以（ ）为主要代表的中国共产党人，在马克思列宁主义的理论指导下，积极探讨新民主主义革命胜利后中 国社会逐步向社会主义过渡的问题。","options":[],"answer":"毛泽东","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-fill-2","number":2,"type":"fill","typeLabel":"填空题","text":"（ ）同志科学地分析了新中国成立后经济、政治和社会发生的深刻变化及发展趋势，及时提出了党在过渡 时期的总路线，放弃了一举过渡的最初设想。","options":[],"answer":"毛泽东","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-judge-1","number":1,"type":"judge","typeLabel":"判断题","text":"新民主主义社会是由新民主主义向社会主义转变的独立的社会形态。","options":[],"answer":"错","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-judge-2","number":2,"type":"judge","typeLabel":"判断题","text":"国家资本主义经济是私人资本主义经济向资本主义国营经济过渡的形式。","options":[],"answer":"错","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-judge-3","number":3,"type":"judge","typeLabel":"判断题","text":"在新民主主义社会中，社会主义的因素在政治上居于领导地位，非社会主义因素在经济上居于领导地位。","options":[],"answer":"错","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-judge-4","number":4,"type":"judge","typeLabel":"判断题","text":"国内的私人资本主义经济在1952年我国国民经济得以恢复后要求把有限的资源、资金和技术力量集中使用 到重点建设工程上来。","options":[],"answer":"错","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-judge-5","number":5,"type":"judge","typeLabel":"判断题","text":"要从根本上改变旧中国贫穷落后的面貌，把中国从一个落后的农业国变为一个先进的工业国，就必须实现 国家的工业化。","options":[],"answer":"对","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-judge-6","number":6,"type":"judge","typeLabel":"判断题","text":"从个别企业的公私合营到全行业公私合营，是党和国家对资本主义工商业采取利用、限制、改造政策的必 然趋势，也是经济运行中市场化配置不断强化的必然结果。","options":[],"answer":"错","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-judge-7","number":7,"type":"judge","typeLabel":"判断题","text":"世界历史发展的一般规律排斥个别发展阶段在发展的形式或顺序上表现出特殊性。","options":[],"answer":"错","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-judge-8","number":8,"type":"judge","typeLabel":"判断题","text":"中国的社会主义可以不经过社会生产力的极大发展就超越社会主义初级阶段。","options":[],"answer":"错","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-judge-9","number":9,"type":"judge","typeLabel":"判断题","text":"我国工业化、现代化建设取得的辉煌成就，离不开选择了社会主义道路这个根本的前提条件。","options":[],"answer":"对","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-judge-10","number":10,"type":"judge","typeLabel":"判断题","text":"新民主主义社会不是一个独立的社会形态，而是一个由新民主主义向社会主义转变的过渡性社会形态。","options":[],"answer":"对","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-judge-11","number":11,"type":"judge","typeLabel":"判断题","text":"在新民主主义社会中，民族资产阶级与工人阶级的矛盾只保留了对抗性的一面，已经没有非对抗性的一 面了。","options":[],"answer":"错","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-judge-12","number":12,"type":"judge","typeLabel":"判断题","text":"近代以来的历史证明，中国社会经济状况允许走资本主义道路，如果搞资本主义可以成为独立的资本主 义强国。","options":[],"answer":"错","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-judge-13","number":13,"type":"judge","typeLabel":"判断题","text":"党的七届二中全会专门讨论了建设新民主主义社会的问题，毛泽东在报告中明确提出了我国要“由新民 主主义社会发展到将来的社会主义社会”的历史任务。","options":[],"answer":"对","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-judge-14","number":14,"type":"judge","typeLabel":"判断题","text":"新中国成立后，帝国主义阵营逐渐壮大，对我国军事上侵略威胁、经济上严密封锁、政治上孤立遏制， 实行过渡时期总路线总体上处于不利的国际环境中。","options":[],"answer":"错","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-judge-15","number":15,"type":"judge","typeLabel":"判断题","text":"对资本主义工商业实行和平赎买，是指国家支付一笔巨额补偿资金将私营企业收归国有。","options":[],"answer":"错","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-judge-16","number":16,"type":"judge","typeLabel":"判断题","text":"对资本主义工商业的社会主义改造，实现了对企业的改造和对人的改造相结合，既避免了激烈的阶级对 抗，又推动了生产力的发展。","options":[],"answer":"对","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-judge-17","number":17,"type":"judge","typeLabel":"判断题","text":"毛泽东指出，用和平的方法，即用说服教育的方法，只能改变个体的所有制为社会主义的集体所有制， 不能改变资本主义所有制为社会主义所有制。","options":[],"answer":"错","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-judge-18","number":18,"type":"judge","typeLabel":"判断题","text":"中国共产党早在新民主主义革命时期就开始重视国家的工业化，提出保护民族工商业的政策。但在半殖 民地半封建社会，我国民族工业受帝国主义和封建主义的双重压迫，难以获得大的发展。","options":[],"answer":"对","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-judge-19","number":19,"type":"judge","typeLabel":"判断题","text":"第二国际的机会主义者认为，经济文化比较落后的国家可以先于发达国家实行社会主义革命、建立社会 主义制度。","options":[],"answer":"错","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-judge-20","number":20,"type":"judge","typeLabel":"判断题","text":"由于经济文化还比较落后，中国的社会主义只能是初级阶段的社会主义，但可以经过主观努力超越这个 阶段。","options":[],"answer":"错","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-judge-21","number":21,"type":"judge","typeLabel":"判断题","text":"社会主义基本制度的确立，使广大劳动人民真正成为国家的主人，但劳动人民仍然处于被剥削被奴役的 地位。","options":[],"answer":"错","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-judge-22","number":22,"type":"judge","typeLabel":"判断题","text":"社会主义基本制度的确立，完全否定了马克思列宁主义的真理性，说明科学社会主义理论已经过时。","options":[],"answer":"错","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-4-single-1","number":1,"type":"single","typeLabel":"单选题","text":"只有到了社会主义社会和共产主义社会，社会主要矛盾才能不以阶级矛盾的方式体现出来。党在八大前后 ，特别是毛泽东在1957年2月所作的（ ）的报告，系统论述了社会主义社会矛盾的理论。","options":[{"text":"《关于正确处理人民内部矛盾的问题》","correct":true},{"text":"《中国社会各阶级的分析》","correct":false},{"text":"《论十大关系》","correct":false},{"text":"《论人民民主专政》","correct":false}],"answer":"A","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-2","number":2,"type":"single","typeLabel":"单选题","text":"社会主义改造基本完成后，党的八大指出，我们国内的主要矛盾是（ ）。","options":[{"text":"资产阶级和工人阶级的矛盾、封建主义和人民大众的矛盾","correct":false},{"text":"人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾","correct":true},{"text":"人民日益增长的物质文化需要同落后的社会生产之间的矛盾","correct":false},{"text":"人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾","correct":false}],"answer":"B","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-3","number":3,"type":"single","typeLabel":"单选题","text":"针对人民内部矛盾在具体实践中的不同情况，毛泽东提出了一系列具体方针、原则，其中不包括（ ）。","options":[{"text":"对于人民群众和政府机关的矛盾，兼顾国家、集体和个人三方面的利益原则","correct":true},{"text":"对于民族之间的矛盾，实行民族平等、团结互助的方针，着重反对大汉族主义，也要反对地方民族主 义","correct":false},{"text":"对于科学文化领域里的矛盾，实行“百花齐放、百家争鸣”的方针，通过自由讨论和科学实践、艺术 实践去解决","correct":false},{"text":"对于共产党和民主党派的矛盾，实行在坚持社会主义道路和共产党领导的前提下“长期共存、互相监 督”的方针","correct":false}],"answer":"A","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-4","number":4,"type":"single","typeLabel":"单选题","text":"毛泽东指出：“中国民族和人民要彻底解放，必须实现国家工业化，而我们已作了的工作，还只是向这个 方向刚才开始走。”下列各项中，不符合毛泽东所提出的工业化发展思路的是（ ）。","options":[{"text":"重工业和轻工业同时并举","correct":false},{"text":"中央工业和地方工业同时并举","correct":false},{"text":"工业与农业协调发展","correct":true},{"text":"大型企业和中小型企业同时并举","correct":false}],"answer":"C","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-5","number":5,"type":"single","typeLabel":"单选题","text":"1956年9月20日，陈云在党的八大上作了题为《关于资本主义工商业改造高潮以后的新问题》的报告，提 出了“三个主体、三个补充”的设想，下列各项中，不符合这一设想的是（ ）。","options":[{"text":"一定数量的个体经营是国家经营和集体经营的补充","correct":false},{"text":"按照市场变化在国家计划许可范围内的自由生产是计划生产的补充","correct":false},{"text":"自由市场是社会主义的统一市场的主体","correct":true},{"text":"计划生产是工农业生产的主体","correct":false}],"answer":"C","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-6","number":6,"type":"single","typeLabel":"单选题","text":"1954年9月15日，第一届全国人民代表大会第一次会议在北京召开，（ ）在会议上所作的政府工作报告中 代表党中央第一次提出关于“四个现代化”的构想。","options":[{"text":"毛泽东","correct":false},{"text":"刘少奇","correct":false},{"text":"周恩来","correct":true},{"text":"邓小平","correct":false}],"answer":"C","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-7","number":7,"type":"single","typeLabel":"单选题","text":"新中国成立初期，党就提出，实现“四个现代化”，关键在于（ ）现代化。","options":[{"text":"农业","correct":false},{"text":"工业","correct":false},{"text":"科学技术","correct":true},{"text":"国防","correct":false}],"answer":"C","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-8","number":8,"type":"single","typeLabel":"单选题","text":"20世纪60年代，为满足备战需要、改变我国经济发展战略布局，国家启动“三线建设”。下列省区中，不 属于“三线”的是（ ）。","options":[{"text":"云南","correct":false},{"text":"贵州","correct":false},{"text":"甘肃","correct":false},{"text":"新疆","correct":true}],"answer":"D","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-9","number":9,"type":"single","typeLabel":"单选题","text":"1963年9月28日，毛泽东在与日共中央政治局委员听涛克己的谈话中提出“两个中间地带”的战略思想， 在这一思想中，第一个中间地带不包括（ ）。","options":[{"text":"亚洲","correct":false},{"text":"非洲","correct":false},{"text":"拉丁美洲","correct":false},{"text":"欧洲","correct":true}],"answer":"D","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-10","number":10,"type":"single","typeLabel":"单选题","text":"我们党初步探索适合中国国情的社会主义建设道路，在理论和实践上作出许多开创性贡献，为改革开放 后开辟中国特色社会主义道路提供了理论准备和宝贵经验。毛泽东发表的（ ）成为党探索中国社会主义建设 道路的良好开端。","options":[{"text":"《论人民民主专政》","correct":false},{"text":"《论十大关系》","correct":true},{"text":"《纪念孙中山先生》","correct":false},{"text":"《关于正确处理人民内部矛盾的问题》","correct":false}],"answer":"B","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-11","number":11,"type":"single","typeLabel":"单选题","text":"毛泽东在1957年2月所作的《关于正确处理人民内部矛盾的问题》的报告中，系统论述了社会主义社会矛 盾的理论。毛泽东强调，社会主义国家政治生活的主题是（ ）。","options":[{"text":"正确处理轻工业和重工业比例的问题","correct":false},{"text":"正确处理人民内部矛盾的问题","correct":true},{"text":"正确处理同外国关系的问题","correct":false},{"text":"正确处理城市建设和农村发展的问题","correct":false}],"answer":"B","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-12","number":12,"type":"single","typeLabel":"单选题","text":"20世纪50年代中期，毛泽东明确提出要走一条有别于苏联的中国工业化道路。走中国工业化道路主要是 强调要正确处理（ ）。","options":[{"text":"信息化和工业化的关系","correct":false},{"text":"现代科技和传统技术的关系","correct":false},{"text":"农业现代化和城镇化的关系","correct":false},{"text":"重工业和轻工业、农业的关系","correct":true}],"answer":"D","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-13","number":13,"type":"single","typeLabel":"单选题","text":"党的八大正确分析了社会主义改造完成后我国社会主要矛盾的变化，指出社会主义制度在我国已经基本 上建立起来了，我们国内的主要矛盾，已经是（ ）。","options":[{"text":"人民日益增长的物质文化需要同落后的社会生产之间的矛盾","correct":false},{"text":"人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾","correct":false},{"text":"人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾","correct":true},{"text":"封建主义同人民大众的矛盾","correct":false}],"answer":"C","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-14","number":14,"type":"single","typeLabel":"单选题","text":"党的八大提出，要扩大（ ），加强对国家工作的监督，健全社会主义法制。","options":[{"text":"阶级斗争","correct":false},{"text":"社会主义民主","correct":true},{"text":"统一战线","correct":false},{"text":"党的政治宣传","correct":false}],"answer":"B","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-15","number":15,"type":"single","typeLabel":"单选题","text":"《论十大关系》的报告围绕的基本方针是（ ）。","options":[{"text":"独立自主","correct":false},{"text":"自力更生为主，争取外援为辅","correct":false},{"text":"调动一切积极因素，为社会主义事业服务","correct":true},{"text":"走中国特色社会主义道路","correct":false}],"answer":"C","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-16","number":16,"type":"single","typeLabel":"单选题","text":"毛泽东认为，解决社会主义基本矛盾的途径和方法是（ ）。","options":[{"text":"经过革命","correct":false},{"text":"经过社会主义制度本身来解决","correct":true},{"text":"经过发展生产力","correct":false},{"text":"经过改变社会主义制度","correct":false}],"answer":"B","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-17","number":17,"type":"single","typeLabel":"单选题","text":"新中国的工业化是在苏联的影响下起步的。走中国工业化道路，是中国共产党初步探索我国社会主义建 设道路的一个重要思想。在《关于正确处理人民内部矛盾的问题》中，毛泽东明确提出了中国工业化道路的 问题，主要是指（ ）。","options":[{"text":"经济建设和国防建设的关系问题","correct":false},{"text":"中央和地方的关系问题","correct":false},{"text":"沿海工业和内地工业的关系问题","correct":false},{"text":"重工业、轻工业和农业的发展关系问题","correct":true}],"answer":"D","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-18","number":18,"type":"single","typeLabel":"单选题","text":"新中国成立初期，党面临一个崭新课题，就是如何在中国这样一个经济文化比较落后的东方大国建设和 巩固社会主义。1956年4月和5月，毛泽东先后在中央政治局扩大会议和最高国务会议上作了《论十大关系》 的报告，初步总结了我国社会主义建设的经验，明确提出（ ）。","options":[{"text":"走一条有别于苏联的中国工业化道路","correct":false},{"text":"以苏联为鉴，独立自主地探索适合中国情况的社会主义建设道路","correct":true},{"text":"社会主义社会的基本矛盾仍然是生产力和生产关系的矛盾","correct":false},{"text":"敌我矛盾和人民内部矛盾是两类不同性质的社会矛盾","correct":false}],"answer":"B","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-19","number":19,"type":"single","typeLabel":"单选题","text":"毛泽东指出，敌我矛盾和人民内部矛盾是两类性质完全不同的矛盾。区分这两类矛盾的基本方法是（ ）。","options":[{"text":"前者是分清是非的问题，后者是分清敌我的问题","correct":false},{"text":"前者是分清敌我的问题，后者是分清是非的问题","correct":true},{"text":"前者需要用民主方法解决，后者需要用专政方法解决","correct":false},{"text":"两者都需要用专政方法解决","correct":false}],"answer":"B","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-20","number":20,"type":"single","typeLabel":"单选题","text":"毛泽东在《关于正确处理人民内部矛盾的问题》中明确提出了中国工业化道路的问题。中国工业化道路 主要是指（ ）。","options":[{"text":"重工业和轻工业、农业的发展关系问题","correct":true},{"text":"中央工业和地方工业的关系问题","correct":false},{"text":"沿海工业和内地工业的关系问题","correct":false},{"text":"大型企业和中小型企业的关系问题","correct":false}],"answer":"A","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-21","number":21,"type":"single","typeLabel":"单选题","text":"陈云在探索适合我国情况的经济体制和运行机制过程中，提出了“三个主体、三个补充”的设想。在工 商业经营方面，“三个主体、三个补充”指的是（ ）。","options":[{"text":"国家经营和集体经营是主体，一定数量的个体经营是补充","correct":true},{"text":"计划生产是主体，自由生产是补充","correct":false},{"text":"国家市场是主体，自由市场是补充","correct":false},{"text":"公有制是主体，私有制是补充","correct":false}],"answer":"A","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-22","number":22,"type":"single","typeLabel":"单选题","text":"毛泽东提出：“我们的教育方针，应该使受教育者在德育、智育、体育几方面都得到发展，成为有社会 主义觉悟的有文化的劳动者。”这一方针强调教育要培养（ ）。","options":[{"text":"各方面的专业技术人才","correct":false},{"text":"现代企业的管理人才","correct":false},{"text":"全面发展的社会主义建设者","correct":true},{"text":"精通前沿军事理论和技术的专家队伍","correct":false}],"answer":"C","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-23","number":23,"type":"single","typeLabel":"单选题","text":"20世纪70年代前期，毛泽东针对国际形势的变化逐渐形成了关于“三个世界划分”的战略思想。根据这 一思想，亚洲、非洲、拉丁美洲的广大发展中国家属于（ ）。","options":[{"text":"第一世界","correct":false},{"text":"第二世界","correct":false},{"text":"第三世界","correct":true},{"text":"中间地带","correct":false}],"answer":"C","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-single-24","number":24,"type":"single","typeLabel":"单选题","text":"在社会主义建设时期，党领导人民探索社会主义建设道路所取得的成果，对于巩固我国社会主义制度具 有重要意义。这些成果主要体现在（ ）。","options":[{"text":"完全照搬了苏联的社会主义建设模式","correct":false},{"text":"在经济政治文化等都取得了重大成就","correct":true},{"text":"迅速实现了社会主义的四个现代化","correct":false},{"text":"彻底解决了社会主义社会的所有矛盾","correct":false}],"answer":"B","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-multiple-1","number":1,"type":"multiple","typeLabel":"多选题","text":"《论十大关系》的报告以苏联的经验为鉴戒，提出探索适合我国国情的社会主义建设道路的任务，报告中 的（ ）论述了政治生活和思想文化生活领域如何调动各种积极因素的问题。","options":[{"text":"汉族与少数民族的关系","correct":true},{"text":"党与非党的关系","correct":true},{"text":"革命和反革命的关系","correct":true},{"text":"是非关系","correct":true}],"answer":"ABCD","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-multiple-2","number":2,"type":"multiple","typeLabel":"多选题","text":"调动各方面积极因素是我们党的传统。调动一切积极因素为社会主义事业服务，必须发展社会主义民主政 治，其具体要求包括（ ）。","options":[{"text":"开展反对官僚主义的斗争","correct":true},{"text":"加强党对于国家机关的领导和监督","correct":true},{"text":"巩固人民民主专政政权","correct":false},{"text":"着手系统地制定比较完备的法律","correct":true}],"answer":"ABD","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-multiple-3","number":3,"type":"multiple","typeLabel":"多选题","text":"正确处理物质利益、分配方面的人民内部矛盾，就要实行（ ）的方针，兼顾国家、集体和个人三方面的利 益。","options":[{"text":"统筹兼顾","correct":true},{"text":"平均分配","correct":false},{"text":"适当安排","correct":true},{"text":"共建共享","correct":false}],"answer":"AC","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-multiple-4","number":4,"type":"multiple","typeLabel":"多选题","text":"中国共产党领导的多党合作和政治协商制度是中国共产党、中国人民和各民主党派、无党派人士的伟大政 治创造。正确处理共产党和民主党派的矛盾，就要实行在坚持社会主义道路和共产党领导的前提下“（ ）” 的方针。","options":[{"text":"长期共存","correct":true},{"text":"互相监督","correct":true},{"text":"共同执政","correct":false},{"text":"求同存异","correct":false}],"answer":"AB","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-multiple-5","number":5,"type":"multiple","typeLabel":"多选题","text":"社会主义发展的历史证明，苏联模式是特定历史条件下的产物，并不是社会主义的唯一模式。由于受苏联 工业化模式的影响，我国一度过多强调（ ）的建设，影响了农业和轻工业的发展，造成了一定程度的比例失 调。","options":[{"text":"手工业","correct":false},{"text":"重工业","correct":true},{"text":"基础设施","correct":true},{"text":"加工业、制造业","correct":false}],"answer":"BC","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-multiple-6","number":6,"type":"multiple","typeLabel":"多选题","text":"解决台湾问题、实现祖国完全统一，是党矢志不渝的历史任务。关于祖国统一，1956年4月，毛泽东提出 （ ）等政策主张。","options":[{"text":"“和为贵”","correct":true},{"text":"“爱国一家”","correct":true},{"text":"“爱国不分先后”","correct":true},{"text":"“一国两制”","correct":false}],"answer":"ABC","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-multiple-7","number":7,"type":"multiple","typeLabel":"多选题","text":"在社会主义初步探索的过程中，我国建立起独立的比较完整的工业体系和国民经济体系，其具体表现包括 （ ）。","options":[{"text":"经济保持了较快的发展速度","correct":true},{"text":"从根本上解决了工业化“从无到有”的问题","correct":true},{"text":"农业生产条件显著改变","correct":true},{"text":"教育、科学、文化、卫生、体育事业有很大发展","correct":true}],"answer":"ABCD","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-multiple-8","number":8,"type":"multiple","typeLabel":"多选题","text":"毛泽东提出探索马克思主义同中国实际即社会主义建设实际的“第二次结合”，说明中国共产党（ ）。","options":[{"text":"开始探索适合中国特点的社会主义建设道路","correct":true},{"text":"开始摆脱苏联模式","correct":true},{"text":"开始重新认识“什么是社会主义、怎样建设社会主义”","correct":false},{"text":"开始改革开放的事业","correct":false}],"answer":"AB","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-multiple-9","number":9,"type":"multiple","typeLabel":"多选题","text":"走中国工业化道路的思想是党在社会主义建设道路初步探索中取得的理论成果之一。毛泽东所说的中国工 业化道路，就是正确处理重工业、轻工业和农业的关系，也就是他在《论十大关系》中论述的第一大关系。 为此，毛泽东提出了以农业为基础，以工业为主导，以农、轻、重为序发展国民经济的总方针，以及一整套 “两条腿走路”的方针，即（ ）。","options":[{"text":"重工业和轻工业同时并举","correct":true},{"text":"中央工业和地方工业同时并举","correct":true},{"text":"沿海工业和内地工业同时并举","correct":true},{"text":"外资企业和内资企业同时并举","correct":false}],"answer":"ABC","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-multiple-10","number":10,"type":"multiple","typeLabel":"多选题","text":"关于走工业化道路，陈云提出“三个主体、三个补充”的设想包括（ ）。","options":[{"text":"在生产计划方面，计划生产是工农业生产的主体，按照市场变化在国家计划许可范围内的自由生产是计 划生产的补充","correct":true},{"text":"在社会主义的统一市场里，国家市场是它的主体，一定范围内的国家领导的自由市场是国家市场的补 充","correct":true},{"text":"在工商业经营方面，国家经济和集体经济是工商业的主体，一定数量的个体经济是国家经济和集体经 济的补充","correct":true},{"text":"在对外交流方面自力更生是主体，引进技术是补充","correct":false}],"answer":"ABC","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-multiple-11","number":11,"type":"multiple","typeLabel":"多选题","text":"社会主义改造基本完成以后，中国共产党面临如何进行社会主义建设的问题。毛泽东明确提出：“现在 是社会主义革命和建设时期，我们要进行第二次结合，找出在中国怎样建设社会主义的道路”。1956年，以 毛泽东同志为主要代表的中国共产党人提出了一系列关于建设社会主义的重要方针，其中包括（ ）。","options":[{"text":"在经济建设上实行“既反保守又反冒进”的方针","correct":true},{"text":"在对外关系上实行“一边倒”的方针","correct":false},{"text":"在科学文化工作中实行“百花齐放、百家争鸣”的方针","correct":true},{"text":"在党与民主党派关系上实行“长期共存，互相监督”的方针","correct":true}],"answer":"ACD","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-multiple-12","number":12,"type":"multiple","typeLabel":"多选题","text":"1956年起，以毛泽东为主要代表的中国共产党人开始探索适合中国特点的社会主义建设道路。与此相联 系，毛泽东提出了一系列思想，主要有（ ）。","options":[{"text":"强调独立自主地探索适合中国情况的社会主义建设道路","correct":true},{"text":"提出以苏联为鉴","correct":true},{"text":"提出马克思主义同中国实际的“第二次结合”","correct":true},{"text":"强调改革开放","correct":false}],"answer":"ABC","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-multiple-13","number":13,"type":"multiple","typeLabel":"多选题","text":"在社会主义建设时期，党领导人民探索社会主义建设道路，历经艰辛和曲折，在理论和实践上取得了一 系列重要成果。这些成果对于巩固我国社会主义制度，开创和发展中国特色社会主义，促进世界社会主义的 发展，具有重要意义。具体包括（ ）。","options":[{"text":"社会主义建设的成就体现了社会主义制度的优越性，增强了广大人民群众走社会主义道路的信心","correct":true},{"text":"社会主义建设的经验教训为改革开放新时期中国特色社会主义的开创和发展提供了重要的思想资源","correct":true},{"text":"社会主义建设的探索与实践为其他国家的社会主义建设提供了经验和借鉴","correct":true},{"text":"社会主义建设的探索与实践奠定了建设和谐社会的基础","correct":false}],"answer":"ABC","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-multiple-14","number":14,"type":"multiple","typeLabel":"多选题","text":"1957年，毛泽东运用对立统一规律，以正确处理人民内部矛盾为总题目，总结了我国社会主义革命和建 设的经验，全面分析了社会主义社会的矛盾，提出了正确区分和解决两类不同性质的矛盾的方法，规定了正 确处理人民内部矛盾的一系列正确方针。中国共产党提出的正确处理人民内部矛盾的方针政策主要有（ ）。","options":[{"text":"“百花齐放、百家争鸣”","correct":true},{"text":"长期共存、相互监督","correct":true},{"text":"和平共处五项原则","correct":false},{"text":"统筹兼顾、适当安排","correct":true}],"answer":"ABD","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-multiple-15","number":15,"type":"multiple","typeLabel":"多选题","text":"毛泽东在《关于正确处理人民内部矛盾的问题》的报告中，系统论述了社会主义社会矛盾的理论。这一 理论提出的历史背景包括（ ）。","options":[{"text":"苏共二十大后，东欧一些社会主义国家发生了波兹南事件和匈牙利事件","correct":true},{"text":"帝国主义乘机掀起反苏反共反社会主义的浪潮","correct":true},{"text":"我国社会主义改造和建设中出现了一些失误","correct":true},{"text":"少数干部存在着官僚主义作风，严重脱离群众","correct":true}],"answer":"ABCD","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-multiple-16","number":16,"type":"multiple","typeLabel":"多选题","text":"毛泽东指出，人民内部矛盾是在人民根本利益一致基础上的矛盾，因而是非对抗性的矛盾。人民内部矛 盾包括（ ）。","options":[{"text":"工人阶级内部的矛盾","correct":true},{"text":"工农两个阶级之间的矛盾","correct":true},{"text":"政府和人民群众之间的矛盾","correct":true},{"text":"国家机关某些工作人员的官僚主义作风同群众之间的矛盾","correct":true}],"answer":"ABCD","explanation":"","source":"第4章章节专用题库","chapter":"4","section":"4.0","warning":false,"warningText":""},{"id":"chapter-4-multiple-17","number":17,"type":"multiple","typeLabel" function handleAuth(fd){
 const pass=String(fd.get('password')||'');
 if(authRole==='admin'){
  if(authMode==='register'){toast('管理员不开放注册');return}
  if(pass!==(state.admin?.password||'（仅在Supabase后台设置）')){toast('管理员密码不正确');return}
  let a=state.accounts.find(x=>x.role==='admin');if(!a){a={id:'admin-local',role:'admin',username:'admin',nickname:'管理员',password:pass,numberNick:'',createdAt:Date.now()};state.accounts.push(a)}a.password=pass;state.active=a.id;save();render();return;
 }
 if(authMode==='register'&&authRole==='student'){
  const nickname=String(fd.get('nickname')||'').trim(),numberNick=String(fd.get('numberNick')||'').trim();
  if(!nickname){toast('请填写昵称');return}if(state.accounts.some(x=>x.role==='student'&&x.nickname===nickname)){toast('昵称已被注册');return}
  const username='internal-'+uid();
  const a={id:uid(),role:'student',username,nickname,numberNick,password:pass,createdAt:Date.now()};state.accounts.push(a);state.localUsers[a.id]={progress:{},wrong:{},favorites:[],attempts:{},tests:[],testBest:{},history:[]};state.active=a.id;save();publishStudent(a);toast('注册成功');render();return;
 }
 if(authMode==='register'&&authRole==='teacher'){
  const nickname=String(fd.get('nickname')||'').trim(),username=nickname,seed=String(fd.get('seed')||'').trim();
  if(!seedValid(seed)){toast('种子无效或已过期');return}
  if(state.accounts.some(a=>a.role==='teacher'&&a.nickname===nickname)){toast('教师昵称已存在');return}
  const a={id:uid(),role:'teacher',username,nickname,password:pass,createdAt:Date.now()};state.accounts.push(a);state.active=a.id;save();toast('教师账号创建成功');render();return;
 }
 const username=String(fd.get('username')||'').trim(),a=state.accounts.find(x=>(x.nickname===username||x.username===username)&&x.role===authRole&&x.password===pass);
 if(!a){toast('账号或密码不正确');return}
 state.active=a.id;save();render();
}
function getSeed(){const now=Date.now(),s=state.teacherSeed||{value:'',createdAt:0};if(!s.value||now-s.createdAt>=30*60*1000){s.value=Math.random().toString(36).slice(2,6).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();s.createdAt=now;state.teacherSeed=s;save()}return s}
function seedValid(v){const s=getSeed();return v===s.value&&Date.now()-s.createdAt<30*60*1000}
function publishStudent(a){/* 本机演示数据；正式版改由 Supabase 服务端接收精简汇总。 */const list=shared();if(!list.some(x=>x.id===a.id))list.push({id:a.id,username:a.username,nickname:a.nickname,numberNick:a.numberNick,role:'student',scopeStats:{},testBest:{},attemptCount:0,updatedAt:Date.now()});saveShared(list);syncStudentSummary(a)}
function syncStudentSummary(a){if(!a||a.role!=='student')return;const d=localData(a.id),qs=allQuestions();const calc=list=>{let attempted=0,attempts=0,correct=0;list.forEach(q=>{const p=d.progress[String(q.id)];if(p){attempts+=Number(p.attempts)||0;correct+=Number(p.correct)||0;if((p.attempts||0)>0)attempted++}});return {done:attempted,total:list.length,progress:list.length?Math.round(attempted/list.length*100):0,attempts,correct,accuracy:attempts?Math.round(correct/attempts*100):0}};const chapters={};[...new Set(qs.map(q=>String(q.chapter||'导论')))].forEach(c=>chapters[c]=calc(qs.filter(q=>String(q.chapter||'导论')===c)));const scopeStats={book:calc(bookQuestions()),chapters};scopeStats.book.attempts=Number(d.totalAttempts)||0;const list=shared();let row=list.find(x=>x.id===a.id);if(!row){row={id:a.id,username:a.username,nickname:a.nickname,numberNick:a.numberNick,role:'student'};list.push(row)}row.scopeStats=scopeStats;row.progress=scopeStats;row.testBest={...d.testBest};row.attemptCount=Number(d.totalAttempts)||0;const testScores=[d.testBest['comprehensive-book'],d.testBest['youth-book']].filter(v=>v!==undefined&&v!==null);row.testAccuracy=testScores.length?Math.round(testScores.reduce((n,v)=>n+Number(v),0)/testScores.length):0;row.updatedAt=Date.now();saveShared(list)}

// Learning library: notes + categories in localStorage, image bytes in IndexedDB.
function studyDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open('xinhuo-study-v1',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('images'))req.result.createObjectStore('images')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function studyImagePut(id,blob){const db=await studyDb();return new Promise((res,rej)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').put(blob,id);tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>rej(tx.error)})}
async function studyImageGet(id){const db=await studyDb();return new Promise((res,rej)=>{const tx=db.transaction('images','readonly'),req=tx.objectStore('images').get(id);req.onsuccess=()=>{db.close();res(req.result)};req.onerror=()=>rej(req.error)})}
async function studyImageDelete(id){const db=await studyDb();return new Promise((res,rej)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').delete(id);tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>rej(tx.error)})}
let studyFilter='全部',studySearch='';
function renderStudy(a,d){
 d.study=d.study||{categories:['课堂笔记','重点整理','图片资料'],items:[]};const data=d.study;const cats=['全部',...data.categories];if(!cats.includes(studyFilter))studyFilter='全部';const items=data.items.filter(x=>(studyFilter==='全部'||x.category===studyFilter)&&((x.title+' '+(x.content||'')).toLowerCase().includes(studySearch.toLowerCase()))).sort((a,b)=>b.updated-a.updated);
 $('#main').innerHTML=`<div class="pagehead"><div><div class="eyebrow">学习空间</div><h1>我的学习资料</h1><div class="subline">笔记与图片保存在此浏览器 · 可以按分类和章节整理</div></div><div class="row"><button class="secondary" id="studyCategory">＋ 分类</button><button class="primary" id="studyAdd">＋ 添加笔记 / 图片</button></div></div><div class="card"><div class="toolbar"><div class="field" style="flex:2;min-width:200px"><label>搜索笔记</label><input id="studySearch" placeholder="标题或内容关键词" value="${esc(studySearch)}"></div><div class="field" style="min-width:175px"><label>分类</label><select id="studyFilter">${cats.map(c=>`<option value="${esc(c)}" ${studyFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div><div class="study-cats">${cats.map(c=>`<span class="study-cat-wrap"><button class="${studyFilter===c?'primary':'secondary'}" data-studycat="${esc(c)}">${esc(c)} (${c==='全部'?data.items.length:data.items.filter(x=>x.category===c).length})</button>${c==='全部'?'':`<button class="study-cat-remove" data-removecat="${esc(c)}" title="删除分类 ${esc(c)}" aria-label="删除分类 ${esc(c)}">×</button>`}</span>`).join('')}</div></div><div class="study-grid" id="studyList">${items.length?items.map(x=>`<div class="card study-item"><div class="between"><span class="pill">${esc(x.category)}</span><span class="small muted">${esc(x.chapter==='none'?'自由笔记':chapterLabel(x.chapter))}</span></div><h3>${esc(x.title)}</h3>${x.content?`<p class="study-body">${esc(x.content)}</p>`:''}${x.hasImage?`<div class="study-picture" data-studyimg="${esc(x.id)}">加载图片中…</div>`:''}<div class="between" style="margin-top:15px"><span class="small muted">${new Date(x.updated).toLocaleDateString()}</span><div class="row"><button class="secondary" data-studyedit="${esc(x.id)}">编辑</button><button class="ghostbtn" data-studydel="${esc(x.id)}">删除</button></div></div></div>`).join(''):'<div class="empty">暂无资料。可以添加第一篇笔记，也可以上传课堂图片。</div>'}</div>`;
 $('#studyFilter').onchange=e=>{studyFilter=e.target.value;renderStudy(a,d)};$('#studySearch').oninput=e=>{studySearch=e.target.value;const caret=e.target.selectionStart;renderStudy(a,d);const x=$('#studySearch');x.focus();x.setSelectionRange(caret,caret)};$$('[data-studycat]').forEach(x=>x.onclick=()=>{studyFilter=x.dataset.studycat;renderStudy(a,d)});
 $$('[data-removecat]').forEach(btn=>btn.onclick=()=>{const cat=btn.dataset.removecat;if(!data.categories.includes(cat))return;const used=data.items.filter(x=>x.category===cat).length;const target=data.categories.find(x=>x!==cat)||'未分类';if(!confirm(`删除分类“${cat}”？${used?'该分类下 '+used+' 份资料会移动到“'+target+'”，不会删除笔记或图片。':'此分类没有资料。'}`))return;if(used)data.items.forEach(x=>{if(x.category===cat)x.category=target});data.categories=data.categories.filter(x=>x!==cat);if(!data.categories.length)data.categories=['未分类'];if(studyFilter===cat)studyFilter='全部';save();renderStudy(a,d);toast('分类已删除，资料已保留')});
 $('#studyCategory').onclick=()=>{const v=prompt('输入新分类名称（最多20字）');if(v===null)return;const name=v.trim().slice(0,20);if(!name||data.categories.includes(name)){toast('分类名称无效或已存在');return}data.categories.push(name);save();renderStudy(a,d)};
 $('#studyAdd').onclick=()=>studyEditor(a,d,null);$$('[data-studyedit]').forEach(x=>x.onclick=()=>studyEditor(a,d,data.items.find(y=>y.id===x.dataset.studyedit)));
 $$('[data-studydel]').forEach(x=>x.onclick=async()=>{const entry=data.items.find(y=>y.id===x.dataset.studydel);if(!entry||!confirm('确定删除这份学习资料吗？'))return;data.items=data.items.filter(y=>y!==entry);save();if(entry.hasImage)try{await studyImageDelete(a.id+':'+entry.id)}catch(e){}renderStudy(a,d)});
 $$('[data-studyimg]').forEach(async x=>{try{const img=await studyImageGet(a.id+':'+x.dataset.studyimg);if(!img){x.textContent='图片在当前浏览器中不可用';return}const url=URL.createObjectURL(img);const im=document.createElement('img');im.src=url;im.alt='学习资料图片';im.onload=()=>URL.revokeObjectURL(url);x.replaceChildren(im)}catch(e){x.textContent='图片加载失败'}});
}
function studyEditor(a,d,entry){
 const data=d.study;let old=entry||{id:uid(),title:'',content:'',chapter:'none',category:studyFilter==='全部'?data.categories[0]:studyFilter,hasImage:false};const pane=document.createElement('div');pane.className='study-overlay';pane.innerHTML=`<div class="card study-editor"><div class="between"><h2>${entry?'编辑资料':'添加学习资料'}</h2><button class="secondary" id="studyCancel">关闭</button></div><form id="studyForm" class="stack"><div class="field"><label>标题</label><input name="title" required maxlength="80" value="${esc(old.title)}" placeholder="例如：第一章复习要点"></div><div class="field"><label>分类</label><select name="category">${data.categories.map(c=>`<option value="${esc(c)}" ${c===old.category?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>对应章节</label><select name="chapter"><option value="none">不指定章节</option>${AVAILABLE_CHAPTERS.map(c=>`<option value="${esc(c)}" ${c===old.chapter?'selected':''}>${chapterLabel(c)}</option>`).join('')}</select></div><div class="field"><label>笔记内容</label><textarea name="content" rows="8" placeholder="记录课堂笔记、知识点、重点内容…">${esc(old.content)}</textarea></div><div class="field"><label>附加图片（可不选；再次上传会替换旧图片）</label><input name="picture" id="studyUpload" type="file" accept="image/*"></div>${old.hasImage?'<div class="small muted">已附带一张图片，未上传新文件则保留原图。</div>':''}<button class="primary" type="submit">保存资料</button></form></div>`;document.body.appendChild(pane);
 const close=()=>pane.remove();pane.querySelector('#studyCancel').onclick=close;pane.onclick=e=>{if(e.target===pane)close()};pane.querySelector('#studyForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);let picture=fd.get('picture');if(picture&&picture.size){if(!picture.type.startsWith('image/')){toast('只能上传图片');return}if(picture.size>12*1024*1024){toast('单张图片请控制在12MB内');return}}
 const next={...old,title:String(fd.get('title')||'').trim(),content:String(fd.get('content')||''),chapter:fd.get('chapter'),category:fd.get('category'),updated:Date.now()};if(!next.title){toast('标题不能为空');return}
 if(picture&&picture.size){try{await studyImagePut(a.id+':'+next.id,picture);next.hasImage=true}catch(err){toast('图片保存失败，请检查浏览器存储空间');return}}
 if(!entry)data.items.push(next);else Object.assign(entry,next);
 try{save()}catch(err){toast('文字笔记保存失败，浏览器空间可能不足');return}close();renderStudy(a,d);toast('资料已保存')};
}

async function refreshCloudStudents(){if(!sb)return;const {data:people,error}=await sb.from('profiles').select('id,nickname,role').eq('role','student').limit(2000);if(error){displayCloudError(error);return}const {data:stat, error:statError}=await sb.from('student_stats').select('user_id,scope_stats,test_best,attempt_count,updated_at').limit(2000);if(statError){displayCloudError(statError);return}const byId=new Map((stat||[]).map(x=>[x.user_id,x]));cloudRows=(people||[]).map(x=>{const d=byId.get(x.id)||{};return {id:x.id,nickname:x.nickname,username:x.nickname,role:'student',scopeStats:d.scope_stats||{},progress:d.scope_stats||{},testBest:d.test_best||{},attemptCount:d.attempt_count||0,updatedAt:d.updated_at?new Date(d.updated_at).getTime():0}})}
async function hydrateCloudSession(){if(!sb)return;const {data:{session},error}=await sb.auth.getSession();if(error||!session?.user){state.active=null;return}const {data:profile,error:pe}=await sb.from('profiles').select('id,nickname,role').eq('id',session.user.id).single();if(pe||!profile){state.active=null;displayCloudError(pe||new Error('未找到账号资料，请先执行数据库 SQL'));return}const a={id:profile.id,role:profile.role,nickname:profile.nickname,username:profile.nickname};state.accounts=[a];state.active=a.id;const d=localData(a.id);if(a.role==='student'){
 const {data:stats}=await sb.from('student_stats').select('progress_counts,test_best,attempt_count,learning_state').eq('user_id',a.id).maybeSingle();if(stats && !hasPendingSync(a.id) && (Object.keys(stats.progress_counts||{}).length || Object.keys(stats.learning_state||{}).length || Number(stats.attempt_count)>0 || Object.keys(stats.test_best||{}).length)){d.progress={};for(const [id,p] of Object.entries(stats.progress_counts||{})){const q=findQuestion(id);d.progress[id]={attempts:Number(p[0])||0,correct:Number(p[1])||0,chapter:String(q?.chapter||'导论'),section:String(q?.section||'导论.1')}}d.testBest=stats.test_best||{};d.totalAttempts=Number(stats.attempt_count)||0;const extra=stats.learning_state||{};d.wrong=extra.wrong||{};d.favorites=extra.favorites||[];d.tests=extra.tests||[];d.history=extra.history||[];d.attempts=extra.attempts||{}}else if(a.role==='student' && (hasPendingSync(a.id)||d.totalAttempts||Object.keys(d.progress||{}).length)){syncStudentSummary(a)}
 }else if(a.role==='teacher'){await refreshCloudStudents()}save()}
function renderAuth(){
 const isReg=authMode==='register'&&authRole!=='admin';
 $('#root').innerHTML=`<div class="authwrap"><section class="authvisual"><div class="brand"><span class="brandmark">知</span>薪火思政研学空间</div><div><h1>薪火思政研学空间<br><span class="auth-subtitle">毛泽东思想和中国特色社会主义理论体系概论</span></h1><p>昵称与密码登录。题库本地使用，轻量学习统计安全同步云端。</p></div></section><section class="authform"><div class="authbox"><h2>${authRole==='admin'?'管理员登录':isReg?'注册'+roleName(authRole)+'账号':'欢迎回来'}</h2><div class="muted">${authRole==='admin'?'仅限预先创建的唯一管理员':isReg?(authRole==='teacher'?'教师注册需要一次性注册码':'使用昵称创建学生账号'):'云端账号登录'}</div><div class="rolepick">${(isReg?['student','teacher']:['student','teacher','admin']).map(r=>`<button type="button" data-role="${r}" class="${authRole===r?'active':''}">${roleName(r)}</button>`).join('')}</div><form id="authForm" class="stack">${authRole==='admin'?'':`<div class="field"><label>昵称</label><input name="nickname" maxlength="24" required autocomplete="username" placeholder="输入唯一昵称"></div>`}<div class="field"><label>密码</label><input name="password" type="password" minlength="6" required autocomplete="${isReg?'new-password':'current-password'}" placeholder="输入密码"></div>${isReg?`<div class="field"><label>确认密码</label><input name="confirm" type="password" minlength="6" required autocomplete="new-password"></div>${authRole==='teacher'?'<div class="field"><label>教师注册码</label><input name="teacherCode" required maxlength="50" autocomplete="off" placeholder="管理员提供的一次性注册码"></div>':''}`:''}<button class="primary" type="submit" style="width:100%;padding:12px" ${cloudBusy?'disabled':''}>${cloudBusy?'正在处理…':authRole==='admin'?'进入管理员界面':isReg?'注册'+roleName(authRole):'登录'}</button></form>${authRole==='admin'?'<div class="footnote">管理员须先在 Supabase 后台创建并授权；首次配置后仅需输入密码。管理员不开放网页注册与注销。</div>':`<div class="authswitch">${isReg?'已有账号？':'还没有账号？'} <button class="linkbtn" id="switchAuth">${isReg?'返回登录':'注册'+roleName(authRole)+'账号'}</button></div><div class="footnote">${authRole==='teacher'?'教师注册需要管理员签发的有效注册码。':'成绩摘要同步云端，学习图片和笔记保留本机。'}</div>`}</div></section></div>`;
 $$('[data-role]').forEach(b=>b.onclick=()=>{authRole=b.dataset.role;authMode='login';renderAuth()});
 const sw=$('#switchAuth');if(sw)sw.onclick=()=>{authMode=authMode==='login'?'register':'login';renderAuth()};
 $('#authForm').onsubmit=e=>{e.preventDefault();handleAuth(new FormData(e.currentTarget))};
}
async function handleAuth(fd){if(cloudBusy)return;if(!sb){toast('Supabase SDK 加载失败，请联网使用');return}const nickname=authRole==='admin'?'管理员':String(fd.get('nickname')||'').trim(),password=String(fd.get('password')||'');if(!nickname||password.length<6){toast('请输入正确的登录信息');return}if(authMode==='register'&&password!==String(fd.get('confirm')||'')){toast('两次输入的密码不一致');return}
 const desiredRole=authRole,teacherCode=String(fd.get('teacherCode')||'').trim();if(authMode==='register'&&desiredRole==='teacher'&&!teacherCode){toast('请输入教师注册码');return}cloudBusy=true;renderAuth();try{if(authMode==='register'){
 const generatedEmail='u'+crypto.randomUUID().replace(/-/g,'')+'@example.com';const {data,error}=await sb.auth.signUp({email:generatedEmail,password,options:{data:{nickname}}});if(error)throw error;if(!data.session){throw Error('注册成功但缺少登录会话，请检查 Supabase Email confirmations 设置')}if(desiredRole==='teacher'){const {error:redeemError}=await sb.rpc('redeem_teacher_code',{p_code:teacherCode});if(redeemError)throw new Error('账号已创建为普通学生，但教师授权失败：'+redeemError.message+'。请联系管理员重新签发注册码。')}
 }else{let loginEmail;if(desiredRole==='admin'){loginEmail='2016841473@qq.com'}else{const {data:lookup,error:lookupError}=await sb.rpc('login_email_for_nickname',{p_nickname:nickname});if(lookupError)throw lookupError;if(!lookup)throw Error('昵称或密码不正确');loginEmail=lookup}const {error}=await sb.auth.signInWithPassword({email:loginEmail,password});if(error)throw Error(desiredRole==='admin'?'管理员未在 Supabase 完成创建／授权，或密码不正确。请检查管理员配置。':'密码不正确或账号尚未创建')}
 await hydrateCloudSession();const a=activeAccount();if(!a)throw Error('登录成功但没有找到账号资料，请检查数据库触发器');if(authMode==='login'&&a.role!==authRole){await sb.auth.signOut({scope:'local'});state.active=null;throw Error(desiredRole==='admin'?'管理员账号已认证，但尚未授予 admin 角色。请在 Supabase SQL Editor 执行管理员授权语句。':'身份与所选入口不匹配')}
 authMode='login';render();toast('已连接云端');
 }catch(e){displayCloudError(e);renderAuth()}finally{cloudBusy=false;if(!activeAccount())renderAuth()}}
function wireSettings(a){$('#saveProfile').onclick=async()=>{const nick=$('#editNick').value.trim(),pw=$('#editPassword').value;if(!nick){toast('昵称不能为空');return}if(pw&&pw.length<6){toast('新密码至少6位');return}try{if(nick!==a.nickname){const {error}=await sb.from('profiles').update({nickname:nick}).eq('id',a.id);if(error)throw error;a.nickname=nick;a.username=nick}if(pw){const {error}=await sb.auth.updateUser({password:pw});if(error)throw error}save();toast('资料已更新');renderApp()}catch(e){displayCloudError(e)}};const deleteBtn=$('#deleteMyAccount');if(deleteBtn)deleteBtn.onclick=async()=>{
 if(a.role==='admin')return;
 const typed=prompt('注销后云端账号和成绩不可恢复。请输入昵称“'+a.nickname+'”确认：');if(typed===null)return;
 if(typed!==a.nickname){toast('昵称不匹配，已取消');return}
 const pw=prompt('请输入当前账号密码，完成最后身份验证：');if(pw===null)return;
 if(!pw){toast('请输入当前密码');return}
 deleteBtn.disabled=true;
 try{
  const {data:lookup,error:le}=await sb.rpc('login_email_for_nickname',{p_nickname:a.nickname});if(le||!lookup)throw(le||Error('账号不存在'));
  const {error:verifyError}=await sb.auth.signInWithPassword({email:lookup,password:pw});if(verifyError)throw Error('密码验证失败，未执行注销');
  if(!confirm('最后确认：永久注销“'+a.nickname+'”？云端学习统计也将删除！'))return;
  const {error}=await sb.rpc('delete_my_account');if(error)throw error;
  clearTimeout(cloudTimer);const keys=(state.localUsers[a.id]?.study?.items||[]).filter(x=>x.hasImage).map(x=>x.id);
  try{for(const id of keys)await studyImageDelete(id)}catch(e){console.warn('本机图片清理失败',e)}
  delete state.localUsers[a.id];save();
  await sb.auth.signOut();state.active=null;state.accounts=[];save();authRole='student';authMode='login';renderAuth();toast('账号已永久注销');
 }catch(e){displayCloudError(e)}finally{if(document.contains(deleteBtn))deleteBtn.disabled=false}
};$('#themeSwitch').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';save();render()};const exportBtn=$('#exportData'),importBtn=$('#importData');if(exportBtn)exportBtn.onclick=()=>{const blob=new Blob([JSON.stringify({account:{nickname:a.nickname,role:a.role},localData:localData(a.id)},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),el=document.createElement('a');el.href=url;el.download='study-local-backup.json';el.click();URL.revokeObjectURL(url)};if(importBtn)importBtn.onclick=()=>toast('云端版不支持导入旧账号；学习资料可留在本机')}
async function init(){if(localStorage.getItem('xh_cloud_v9_initialized')!=='1'){state.localUsers={};localStorage.setItem('xh_cloud_v9_initialized','1')}state.accounts=[];state.active=null;/* preserve new local notes and images after first migration */save();if(!sb){renderAuth();toast('无法加载 Supabase，请检查网络');return}await hydrateCloudSession();render()}

init();
})();
</script>
