ns":[{"text":"浴血奋战、百折不挠","correct":false},{"text":"自力更生、发愤图强","correct":false},{"text":"解放思想、锐意进取","correct":true},{"text":"自信自强、守正创新","correct":false}],"answer":"C","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-single-6","number":6,"type":"single","typeLabel":"单选题","text":"党的十八大以来，以（ ）同志为主要代表的中国共产党人创立了习近平新时代中国特色社会主义思想，谱 写了新时代中国特色社会主义新篇章。","options":[{"text":"邓小平","correct":false},{"text":"江泽民","correct":false},{"text":"胡锦涛","correct":false},{"text":"习近平","correct":true}],"answer":"D","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-single-7","number":7,"type":"single","typeLabel":"单选题","text":"马克思主义是我们立党立国、兴党强国的根本指导思想。马克思主义能不能在实践中发挥作用，关键在于 （ ）。","options":[{"text":"全面掌握马克思主义的知识体系","correct":false},{"text":"为当下实践寻找马克思、恩格斯的经典语录的支持","correct":false},{"text":"能否打破常规、创新理论","correct":false},{"text":"能否把马克思主义基本原理同中国实际和时代特征结合起来","correct":true}],"answer":"D","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-single-8","number":8,"type":"single","typeLabel":"单选题","text":"“马克思主义中国化”这一命题最先出自（ ）。","options":[{"text":"《论新阶段》","correct":true},{"text":"《论持久战》","correct":false},{"text":"《矛盾论》","correct":false},{"text":"《实践论》","correct":false}],"answer":"A","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-single-9","number":9,"type":"single","typeLabel":"单选题","text":"在革命和建设的长期实践中，以毛泽东同志为主要代表的中国共产党人，把马克思列宁主义基本原理同中 国具体实际结合起来，形成了适合中国情况的科学指导思想，即毛泽东思想。在毛泽东思想的指导下，中国 共产党团结带领中国人民，创造了新民主主义革命、社会主义革命和建设的伟大成就。其中，新民主主义革 命的伟大成就，为实现中华民族伟大复兴创造了（ ）。","options":[{"text":"根本社会条件","correct":true},{"text":"根本政治前提和制度基础","correct":false},{"text":"充满新的活力的体制保证和快速发展的物质条件","correct":false},{"text":"更为完善的制度保证、更为坚实的物质基础、更为主动的精神力量","correct":false}],"answer":"A","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-single-10","number":10,"type":"single","typeLabel":"单选题","text":"马克思主义必须中国化才能落地生根、本土化才能深入人心。以毛泽东同志为主要代表的中国共产党人 逐渐认识到，面对中国的特殊国情，不能教条式地对待马克思列宁主义，必须从中国实际出发，实现马克思 主义中国化。首次指出毛泽东思想是“中国化的马克思主义”是在（ ）。","options":[{"text":"《改造我们的学习》","correct":false},{"text":"《论人民民主专政》","correct":false},{"text":"《关于修改党章的报告》","correct":true},{"text":"《共同纲领》","correct":false}],"answer":"C","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-single-11","number":11,"type":"single","typeLabel":"单选题","text":"毛泽东曾在不同场合多次谈到，调查研究有两种方法，一种是走马看花，一种是下马看花。走马看花， 不深入，还必须用第二种方法，就是下马看花，过细看花，分析一朵花。毛泽东强调“下马看花”的实际意 义在于（ ）。","options":[{"text":"解决实际问题必须要有先进理论的指导","correct":false},{"text":"运用多种综合方法分析调查研究的材料","correct":false},{"text":"马克思主义理论必须适合中国革命的具体实际","correct":false},{"text":"只有全面深入了解中国的实际，才能找出规律","correct":true}],"answer":"D","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-single-12","number":12,"type":"single","typeLabel":"单选题","text":"中国共产党的历史，是一部不断推进马克思主义中国化时代化的历史，是一部不断推进理论创新、进行 理论创造的历史。中国共产党坚持以理论创新引领事业发展，从新的实践和时代特征出发坚持和发展马克思 主义，形成了中国特色社会主义理论体系。成功开创了中国特色社会主义的是（ ）。","options":[{"text":"邓小平理论","correct":true},{"text":"“三个代表”重要思想","correct":false},{"text":"科学发展观","correct":false},{"text":"习近平新时代中国特色社会主义思想","correct":false}],"answer":"A","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-single-13","number":13,"type":"single","typeLabel":"单选题","text":"（ ）一声炮响，给中国送来了马克思列宁主义，给苦苦探寻救亡图存出路的中国人民指明了前进方向、 提供了全新选择。","options":[{"text":"鸦片战争","correct":false},{"text":"新文化运动","correct":false},{"text":"五四运动","correct":false},{"text":"十月革命","correct":true}],"answer":"D","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-single-14","number":14,"type":"single","typeLabel":"单选题","text":"习近平新时代中国特色社会主义思想实现了马克思主义中国化时代化新的飞跃，以下不正确的是（ ）。","options":[{"text":"习近平新时代中国特色社会主义思想是当代中国马克思主义","correct":false},{"text":"习近平新时代中国特色社会主义思想是二十一世纪马克思主义","correct":false},{"text":"习近平新时代中国特色社会主义思想是中华文化和中国精神的时代精华","correct":false},{"text":"习近平新时代中国特色社会主义思想是中国革命和建设的科学指南","correct":true}],"answer":"D","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-single-15","number":15,"type":"single","typeLabel":"单选题","text":"推进马克思主义中国化时代化需要不断回答“四个之问”。这“四个之问”是指（ ）。","options":[{"text":"中国之问、世界之问、人民之问、时代之问","correct":true},{"text":"历史之问、现实之问、未来之问、实践之问","correct":false},{"text":"宇宙之问、空间之问、发展之问、改革之问","correct":false},{"text":"民族之问、宗教之问、社会之问、个人之问","correct":false}],"answer":"A","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-single-16","number":16,"type":"single","typeLabel":"单选题","text":"1938年，毛泽东在党的六届六中全会上所作《论新阶段》的报告中，明确提出并系统阐述了“马克思主 义的中国化”这一命题。毛泽东在这一报告中强调的观点是（ ）。","options":[{"text":"马克思主义必须同中国工人运动紧密结合","correct":false},{"text":"没有抽象的马克思主义，只有具体的马克思主义，马克思主义必须按照中国的特点去应用","correct":true},{"text":"马克思主义中国化的第一次历史性飞跃是毛泽东思想","correct":false},{"text":"马克思主义基本原理同中华优秀传统文化相结合是开辟和发展中国特色社会主义的必由之路","correct":false}],"answer":"B","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-single-17","number":17,"type":"single","typeLabel":"单选题","text":"1945年党的七大上，刘少奇代表党中央作《关于修改党章的报告》，对马克思主义中国化从理论上作了 进一步阐述。在这一报告中，被明确称为“中国化的马克思主义”的是（ ）。","options":[{"text":"邓小平理论","correct":false},{"text":"新民主主义理论","correct":false},{"text":"毛泽东思想","correct":true},{"text":"中国特色社会主义理论体系","correct":false}],"answer":"C","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-multiple-1","number":1,"type":"multiple","typeLabel":"多选题","text":"马克思主义中国化时代化的理论成果是一脉相承又与时俱进的关系。毛泽东思想所蕴含的马克思主义的立 场、观点和方法，为中国特色社会主义理论体系提供了基本遵循；中国特色社会主义理论体系在新的历史条 件下进一步丰富和发展了毛泽东思想。它们都是（ ）。","options":[{"text":"马克思列宁主义在中国的运用和发展","correct":true},{"text":"党和国家必须长期坚持的指导思想","correct":true},{"text":"全国各族人民团结奋斗的共同思想基础","correct":true},{"text":"关于中国革命的正确的理论原则和经验总结","correct":false}],"answer":"ABC","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-multiple-2","number":2,"type":"multiple","typeLabel":"多选题","text":"新中国成立以后，以毛泽东同志为主要代表的中国共产党人，结合新的实际丰富和发展毛泽东思想，提出 关于社会主义建设的一系列重要思想，包括（ ）。","options":[{"text":"社会主义社会是一个很长的历史阶段","correct":true},{"text":"严格区分和正确处理敌我矛盾和人民内部矛盾","correct":true},{"text":"正确处理我国社会主义建设的十大关系，走出一条适合我国国情的工业化道路","correct":true},{"text":"在党与民主党派的关系上实行“长期共存、互相监督”的方针，在科学文化工作中实行“百花齐放、 百家争鸣”的方针","correct":true}],"answer":"ABCD","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-multiple-3","number":3,"type":"multiple","typeLabel":"多选题","text":"1938年，毛泽东在党的六届六中全会上作了《论新阶段》的报告，强调：“没有抽象的马克思主义，只有 具体的马克思主义。……马克思主义的中国化，使之在其每一表现中带着中国的特性，即是说，按照中国的 特点去应用它，成为全党亟待了解并亟须解决的问题。”马克思主义中国化时代化（ ）。","options":[{"text":"运用中国人民喜闻乐见的民族语言来阐述马克思主义，使其植根于中华优秀传统文化的土壤之中，具有 中国特色、中国风格、中国气派","correct":true},{"text":"总结和提炼中国革命、建设、改革的实践经验并将其上升为理论，不断丰富和发展马克思主义的理论 宝库，赋予马克思主义以新的时代内涵","correct":true},{"text":"运用马克思主义的立场、观点和方法，观察时代、把握时代、引领时代，解决中国革命、建设、改革 中的实际问题","correct":true},{"text":"揭示了资本主义生产方式的基本矛盾，阐明了社会主义代替资本主义的历史必然性","correct":false}],"answer":"ABC","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-multiple-4","number":4,"type":"multiple","typeLabel":"多选题","text":"在马克思主义中国化时代化的历史进程中，产生了毛泽东思想、邓小平理论、“三个代表”重要思想、科 学发展观、习近平新时代中国特色社会主义思想。习近平新时代中国特色社会主义思想是当代中国马克思主 义、二十一世纪马克思主义，是中华文化和中国精神的时代精华，是党和人民实践经验和集体智慧的结晶， 是中国特色社会主义理论体系的重要组成部分。马克思主义中国化时代化的理论成果之间的关系表现在（ ）。","options":[{"text":"都是对中国革命、建设、改革经验的总结","correct":false},{"text":"都是马克思列宁主义在中国的运用和发展","correct":true},{"text":"都是党和国家长期坚持的指导思想","correct":true},{"text":"都是全国各族人民团结奋斗的共同思想基础","correct":true}],"answer":"BCD","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-multiple-5","number":5,"type":"multiple","typeLabel":"多选题","text":"推进马克思主义中国化时代化，是解决中国实际问题的客观需要。马克思主义要在中国发挥指导作用，就 必须中国化时代化。马克思主义之所以能真正解决中国的实际问题，就在于（ ）。","options":[{"text":"与中国国情相结合","correct":true},{"text":"与时代发展同进步","correct":true},{"text":"为解决中国问题提供具体方案","correct":false},{"text":"借鉴其他国家发展经验","correct":false}],"answer":"AB","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-multiple-6","number":6,"type":"multiple","typeLabel":"多选题","text":"在马克思主义中国化时代化的过程中，产生了毛泽东思想和中国特色社会主义理论体系，这两大理论成果 的一脉相承性主要体现在，二者具有共同的（ ）。","options":[{"text":"马克思主义的理论基础","correct":true},{"text":"革命和建设的根本任务","correct":false},{"text":"实事求是的理论精髓","correct":true},{"text":"和平与发展的时代背景","correct":false}],"answer":"AC","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-multiple-7","number":7,"type":"multiple","typeLabel":"多选题","text":"中国共产党以一系列重要思想理论作为自己的指导思想和行动指南，包括（ ）。","options":[{"text":"马克思主义、毛泽东思想","correct":true},{"text":"邓小平理论、“三个代表”重要思想","correct":true},{"text":"科学发展观","correct":true},{"text":"习近平新时代中国特色社会主义思想","correct":true}],"answer":"ABCD","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-multiple-8","number":8,"type":"multiple","typeLabel":"多选题","text":"中国特色社会主义理论体系始终坚持将毛泽东思想活的灵魂贯穿于自身之中。毛泽东思想活的灵魂所包含 的内容有（ ）。","options":[{"text":"实事求是","correct":true},{"text":"群众路线","correct":true},{"text":"独立自主","correct":true},{"text":"解放思想","correct":false}],"answer":"ABC","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-multiple-9","number":9,"type":"multiple","typeLabel":"多选题","text":"1840年鸦片战争以后，中国逐步成为半殖民地半封建社会，无数仁人志士为探寻救亡图存的出路进行了不 懈努力。以失败而告终的救亡运动包括（ ）。","options":[{"text":"太平天国运动","correct":true},{"text":"洋务运动","correct":true},{"text":"戊戌变法","correct":true},{"text":"义和团运动","correct":true}],"answer":"ABCD","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-multiple-10","number":10,"type":"multiple","typeLabel":"多选题","text":"十月革命给中国送来了马克思列宁主义，中国共产党应运而生。中国共产党的产生所依赖的条件包括（ ） 。","options":[{"text":"中国人民和中华民族的伟大觉醒","correct":true},{"text":"马克思列宁主义同中国工人运动的紧密结合","correct":true},{"text":"辛亥革命的成功经验","correct":false},{"text":"共产国际的直接领导","correct":false}],"answer":"AB","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-fill-1","number":1,"type":"fill","typeLabel":"填空题","text":"马克思主义中国化时代化，就是要坚持运用辩证唯物主义和（ ），从理论和实践的结合上深入回答关系党 和国家事业发展、党治国理政的重大时代课题。","options":[],"answer":"历史唯物主义；唯物史观（两种表述均为页面所列答案）","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-fill-2","number":2,"type":"fill","typeLabel":"填空题","text":"中国共产党为什么能，中国特色社会主义为什么好，归根到底是马克思主义行，是中国化（ ）的马克思主 义行。","options":[],"answer":"时代化","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-judge-1","number":1,"type":"judge","typeLabel":"判断题","text":"准确把握马克思主义中国化时代化的科学内涵，要做到坚持马克思主义经典作家全部论断与吸收西方治国 理政智慧相统一。","options":[],"answer":"错","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-judge-2","number":2,"type":"judge","typeLabel":"判断题","text":"马克思主义中国化时代化不断取得成功，使世界范围内社会主义和资本主义两种意识形态、两种社会制度 的历史演进及其较量发生了有利于资本主义的重大转变。","options":[],"answer":"错","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-judge-3","number":3,"type":"judge","typeLabel":"判断题","text":"改革开放以来形成的中国特色社会主义理论体系是指导党和人民沿着中国特色社会主义道路实现中华民族 伟大复兴的正确理论，是立于时代前沿、与时俱进的科学理论。","options":[],"answer":"对","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-judge-4","number":4,"type":"judge","typeLabel":"判断题","text":"与毛泽东思想不同，中国特色社会主义理论体系以独创性的理论成果丰富和发展了马克思主义的理论宝库。","options":[],"answer":"错","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-judge-5","number":5,"type":"judge","typeLabel":"判断题","text":"恩格斯在《共产党宣言》序言中指出，“这些原理的实际运用，随时随地都要以当时的历史条件为转移”。","options":[],"answer":"对","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-judge-6","number":6,"type":"judge","typeLabel":"判断题","text":"理论的根本任务是构建一套完整严密的逻辑体系，以证明自身的科学性。","options":[],"answer":"错","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-judge-7","number":7,"type":"judge","typeLabel":"判断题","text":"坚持马克思主义一定要有发展的观点，以我们正在做的事情为中心，着眼于马克思主义理论的运用。","options":[],"answer":"对","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-导论-judge-8","number":8,"type":"judge","typeLabel":"判断题","text":"马克思列宁主义揭示了人类社会历史发展的规律，其基本原理具有普遍真理性，但因为当代中国国情发生 了深刻变化，这些原理在一定意义上已经失去了现实指导意义。","options":[],"answer":"错","explanation":"","source":"导论章节专用题库","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"chapter-1-single-1","number":1,"type":"single","typeLabel":"单选题","text":"要引领和推动时代发展，首先必须顺应时代大势，把握时代主题，抓住时代根本，揭示其本质特 征。19 世纪末20 世纪初，世界进入帝国主义和无产阶级革命时代，（ ）成为时代主题。","options":[{"text":"经济全球化","correct":false},{"text":"战争与革命","correct":true},{"text":"世界大同","correct":false},{"text":"生态可持续","correct":false}],"answer":"B","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-single-2","number":2,"type":"single","typeLabel":"单选题","text":"独立自主是中华民族精神之魂，是我们立党立国的重要原则。（ ）开启了党独立自主解决中国革 命实际问题的新阶段，在最危急关头挽救了党、挽救了红军、挽救了中国革命。","options":[{"text":"党的一大","correct":false},{"text":"八七会议","correct":false},{"text":"古田会议","correct":false},{"text":"遵义会议","correct":true}],"answer":"D","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-single-3","number":3,"type":"single","typeLabel":"单选题","text":"（ ）将毛泽东思想写入党章，确立为党必须长期坚持的指导思想。","options":[{"text":"党的五大","correct":false},{"text":"党的六大","correct":false},{"text":"党的七大","correct":true},{"text":"党的八大","correct":false}],"answer":"C","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-single-4","number":4,"type":"single","typeLabel":"单选题","text":"（ ）从组织上确立了党对军队的领导，是建设无产阶级领导的新型人民军队的重要开端。","options":[{"text":"八七会议","correct":false},{"text":"南昌起义","correct":false},{"text":"三湾改编","correct":true},{"text":"遵义会议","correct":false}],"answer":"C","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-single-5","number":5,"type":"single","typeLabel":"单选题","text":"无产阶级的领导权是中国革命的中心问题。无产阶级及其政党要实现自己对同盟者的领导，所必须 具备的条件不包括（ ）。","options":[{"text":"率领被领导者向着共同的敌人作坚决斗争并取得胜利","correct":false},{"text":"先进的军事实力","correct":true},{"text":"对被领导者给以物质利益，至少不损害其利益","correct":false},{"text":"给被领导者以政治教育","correct":false}],"answer":"B","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-single-6","number":6,"type":"single","typeLabel":"单选题","text":"调查研究是谋事之基、成事之道。毛泽东在（ ）中提出了“没有调查，没有发言权”的著名论 断。","options":[{"text":"《矛盾论》","correct":false},{"text":"《论持久战》","correct":false},{"text":"《反对本本主义》","correct":true},{"text":"《论联合政府》","correct":false}],"answer":"C","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-single-7","number":7,"type":"single","typeLabel":"单选题","text":"（ ）在《反对本本主义》中指出：“中国革命斗争的胜利要靠中国同志了解中国情况。”","options":[{"text":"毛泽东","correct":true},{"text":"刘少奇","correct":false},{"text":"周恩来","correct":false},{"text":"邓小平","correct":false}],"answer":"A","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-single-8","number":8,"type":"single","typeLabel":"单选题","text":"（ ）通过的《中国共产党中央委员会关于建国以来党的若干历史问题的决议》对毛泽东和毛泽东 思想的历史地位作出了科学的、实事求是的评价。","options":[{"text":"党的七届二中全会","correct":false},{"text":"党的十一届三中全会","correct":false},{"text":"党的十一届六中全会","correct":true},{"text":"党的八届三中全会","correct":false}],"answer":"C","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-single-9","number":9,"type":"single","typeLabel":"单选题","text":"面对中国近代以来山河破碎、内忧外患的深重灾难，以毛泽东为主要代表的中国共产党人，胸怀远 大理想，脚踏中国大地，创立了毛泽东思想。毛泽东思想初步形成的标志是提出并阐述了（ ）。","options":[{"text":"实事求是的思想路线","correct":false},{"text":"农村包围城市、武装夺取政权的思想","correct":true},{"text":"新民主主义革命的总路线","correct":false},{"text":"中国革命的首要问题","correct":false}],"answer":"B","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-single-10","number":10,"type":"single","typeLabel":"单选题","text":"毛泽东思想作为马克思主义中国化时代化的第一个重大理论成果，是由一系列相互联系的重要理 论观点所构成的完整的科学思想体系。这一科学思想体系所围绕的主题是（ ）。","options":[{"text":"中国社会性质和阶级状况","correct":false},{"text":"中国革命和建设","correct":true},{"text":"中国改革的前途","correct":false},{"text":"中国改革和发展","correct":false}],"answer":"B","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-single-11","number":11,"type":"single","typeLabel":"单选题","text":"面对中国近代以来山河破碎、内忧外患的深重灾难，以毛泽东为主要代表的中国共产党人，胸怀 远大理想，脚踏中国大地，开马克思主义中国化时代化之先河，创立了毛泽东思想。毛泽东思想初步 形成的标志是提出并深入阐述（ ）。","options":[{"text":"实事求是的思想路线","correct":false},{"text":"农村包围城市、武装夺取政权的思想","correct":true},{"text":"新民主主义理论","correct":false},{"text":"中国革命的首要问题","correct":false}],"answer":"B","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-single-12","number":12,"type":"single","typeLabel":"单选题","text":"毛泽东思想是在土地革命战争后期和抗日战争时期得到系统总结和多方面展开并达到逐步成熟 的。下列著作中，属于体现毛泽东思想走向成熟阶段的著作是（ ）。","options":[{"text":"《将革命进行到底》","correct":false},{"text":"《中国革命和中国共产党》","correct":true},{"text":"《反对本本主义》","correct":false},{"text":"《论人民民主专政》","correct":false}],"answer":"B","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-single-13","number":13,"type":"single","typeLabel":"单选题","text":"毛泽东思想是马克思主义中国化时代化的第一大理论成果，是在中国革命和建设的实践中逐步形 成和发展起来的。土地革命战争时期，毛泽东思想初步形成的标志是（ ）。","options":[{"text":"农村包围城市、武装夺取政权理论的初步形成","correct":true},{"text":"新民主主义理论的系统阐明","correct":false},{"text":"人民民主专政理论的完整论述","correct":false},{"text":"思想政治工作和文化工作理论的系统提出","correct":false}],"answer":"A","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-single-14","number":14,"type":"single","typeLabel":"单选题","text":"毛泽东同志指出：“我们共产党人好比种子，人民好比土地。我们到了一个地方，就要同那里的 人民结合起来，在人民中间生根、开花。”我们党的生命线和根本工作路线是（ ）。","options":[{"text":"实事求是","correct":false},{"text":"群众路线","correct":true},{"text":"独立自主","correct":false},{"text":"解放思想","correct":false}],"answer":"B","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-single-15","number":15,"type":"single","typeLabel":"单选题","text":"毛泽东思想和中国特色社会主义理论体系是马克思主义中国化的两大理论成果。贯穿这两大理论 成果始终，并体现在两大成果各个基本观点中的世界观和方法论的基础是（ ）。","options":[{"text":"改革创新","correct":false},{"text":"独立自主","correct":false},{"text":"实事求是","correct":true},{"text":"群众路线","correct":false}],"answer":"C","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-single-16","number":16,"type":"single","typeLabel":"单选题","text":"马克思主义深刻改变了中国，中国也极大丰富了马克思主义。中国共产党的历史，是一部不断推 进马克思主义中国化的历史，是一部不断推进理论创新、进行理论创造的历史。在中国革命、建设、 改革的历史进程中，马克思主义中国化实现了两次历史性飞跃，形成了毛泽东思想和中国特色社会主 义理论体系。毛泽东思想形成的实践基础是（ ）。","options":[{"text":"新中国成立初期的探索实践","correct":false},{"text":"党领导人民进行革命和建设的成功实践","correct":true},{"text":"社会主义改革的成功实践","correct":false},{"text":"改革开放的成功实践","correct":false}],"answer":"B","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-single-17","number":17,"type":"single","typeLabel":"单选题","text":"在革命和建设长期实践中，以毛泽东同志为主要代表的中国共产党人，根据马克思列宁主义基本 原理，形成了适合中国情况的科学指导思想，这就是毛泽东思想。毛泽东思想以独创性理论丰富和发 展了马克思列宁主义。毛泽东思想初步形成的标志是（ ）。","options":[{"text":"新民主主义革命基本思想的提出","correct":false},{"text":"新民主主义革命理论的系统阐述","correct":false},{"text":"农村包围城市，武装夺取政权思想的提出","correct":true},{"text":"提出“马克思主义的中国中国化”","correct":false}],"answer":"C","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-multiple-1","number":1,"type":"multiple","typeLabel":"多选题","text":"阶级斗争是社会基本矛盾在阶级社会中的表现。毛泽东在（ ）等著作中，分析了中国社会各阶级 在革命中的地位和作用，明确指出无产阶级领导农民斗争的极端重要性，提出了关于新民主主义革命 的基本思想。","options":[{"text":"《中国社会各阶级的分析》","correct":true},{"text":"《湖南农民运动考察报告》","correct":true},{"text":"《论人民民主专政》","correct":false},{"text":"《论十大关系》","correct":false}],"answer":"AB","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-multiple-2","number":2,"type":"multiple","typeLabel":"多选题","text":"思想建设是党的基础性建设。针对历史上党内斗争中存在的“左”的错误，毛泽东提出（ ）的正 确方针，强调在党内斗争中要达到既弄清思想又团结同志的目的。","options":[{"text":"惩前毖后","correct":true},{"text":"重点教育","correct":false},{"text":"治病救人","correct":true},{"text":"训诫警示","correct":false}],"answer":"AC","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-multiple-3","number":3,"type":"multiple","typeLabel":"多选题","text":"经过（ ），实事求是的思想路线在全党得到了确立。","options":[{"text":"古田会议","correct":false},{"text":"党的五大","correct":false},{"text":"延安整风","correct":true},{"text":"党的七大","correct":true}],"answer":"CD","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-multiple-4","number":4,"type":"multiple","typeLabel":"多选题","text":"大革命时期，毛泽东关于新民主主义革命的基本思想的提出，标志着毛泽东思想开始萌芽。毛泽东 关于新民主主义革命的基本思想的内容包括（ ）。","options":[{"text":"分析了中国社会各阶级在革命中的地位和作用","correct":true},{"text":"明确指出无产阶级领导农民斗争的极端重要性","correct":true},{"text":"解决了无产阶级领导权的中心问题，即如何领导农民斗争的问题","correct":true},{"text":"坚持与民族资产阶级斗争到底","correct":false}],"answer":"ABC","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-multiple-5","number":5,"type":"multiple","typeLabel":"多选题","text":"解放战争时期和新中国成立以后，以毛泽东同志为主要代表的中国共产党人先后提出人民民主专政 理论、社会主义改造理论、关于严格区分和正确处理两类矛盾的学说特别是正确处理人民内部矛盾的 理论、适合我国国情的中国工业化道路理论等。毛泽东明确提出了把马克思列宁主义的基本原理同中 国具体实际进行“第二次结合，找出在中国怎样建设社会主义的道路”的任务，并对开辟适合中国国 情的社会主义建设道路进行了艰辛探索。集中体现这一时期形成的关于社会主义革命和社会主义建设 的重要思想的毛泽东著作主要有（ ）。","options":[{"text":"《在中国共产党第七届中央委员会第二次全体会议上的报告》","correct":true},{"text":"《论人民民主专政》","correct":true},{"text":"《论十大关系》","correct":true},{"text":"《关于正确处理人民内部矛盾的问题》","correct":true}],"answer":"ABCD","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-multiple-6","number":6,"type":"multiple","typeLabel":"多选题","text":"新中国成立的开国大典前，围绕军乐团演奏什么曲目，一度众说纷纭，提议用德国乐曲、苏联乐 曲、美国乐曲的意见都有。最终，毛泽东拍板：要听自己的乐曲，走自己的路。走自己的路，也就是 独立自主。独立自主是毛泽东思想活的灵魂的三个基本方面的内容之一，是（ ）。","options":[{"text":"中华民族的优良传统","correct":true},{"text":"中国共产党、中华人民共和国立党立国的重要原则","correct":true},{"text":"党从中国实际出发、依靠党和人民力量进行革命、建设、改革的必然结论","correct":true},{"text":"党的生命线和根本工作路线","correct":false}],"answer":"ABC","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-multiple-7","number":7,"type":"multiple","typeLabel":"多选题","text":"1957 年2 月，毛泽东在扩大的最高国务会议上发表《关于正确处理人民内部矛盾的问题》的讲话 中，提出了一系列正确处理人民内部矛盾的方针、原则，主要有（ ）。","options":[{"text":"统筹兼顾、适当安排","correct":true},{"text":"有理、有利、有节","correct":false},{"text":"百花齐放、百家争鸣","correct":true},{"text":"长期共存、互相监督","correct":true}],"answer":"ACD","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-multiple-8","number":8,"type":"multiple","typeLabel":"多选题","text":"2023 年3 月19 日，中共中央办公厅印发《关于在全党大兴调查研究的工作方案》，并将在全党大 兴调查研究作为在全党开展主题教育的重要内容。之所以说调查研究是我们党的传家宝，是因为1930 年毛泽东同志就曾在《反对本本主义》一文中深刻指出（ ）。","options":[{"text":"“谁是我们的敌人？谁是我们的朋友？这个问题是革命的首要问题”","correct":false},{"text":"“中国革命斗争的胜利要靠中国同志了解中国情况”","correct":true},{"text":"“调查就像‘十月怀胎’，解决问题就像‘一朝分娩’，调查就是解决问题”","correct":true},{"text":"“没有调查，没有发言权”","correct":true}],"answer":"BCD","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-multiple-9","number":9,"type":"multiple","typeLabel":"多选题","text":"邓小平指出：“马克思、列宁从来没有说过农村包围城市，这个原理在当时世界上还是没有的。但 是毛泽东同志根据中国的具体条件指明了革命的具体道路。”毛泽东找到农村包围城市、武装夺取政 权这条道路的根据是（ ）。","options":[{"text":"中国内无民主制度，外无民族独立","correct":true},{"text":"农民占人口绝大多数，是民主革命的主力军","correct":true},{"text":"中国革命的敌人长期占据着中心城市，农村是其统治的薄弱环节","correct":true},{"text":"中国经济政治发展的不平衡","correct":true}],"answer":"ABCD","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-multiple-10","number":10,"type":"multiple","typeLabel":"多选题","text":"毛泽东同志指出：“我们中华民族有同自己的敌人血战到底的气概，有在自力更生的基础上光复 旧物的决心，有自立于世界民族之林的能力。”坚持独立自主，就要（ ）。","options":[{"text":"坚持中国的事情必须由中国人民自己做主张","correct":true},{"text":"坚持在实践中检验真理和发展真理","correct":false},{"text":"坚持独立自主的和平外交政策","correct":true},{"text":"坚持独立思考走自己的路","correct":true}],"answer":"ACD","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-multiple-11","number":11,"type":"multiple","typeLabel":"多选题","text":"邓小平指出，没有毛主席，至少我们中国人民还要在黑暗中摸索更长的时间。我们应该珍视半个 多世纪以来在中国革命和建设过程中，把马克思主义基本原理同中国具体实际相结合所形成的科学理 论成果，并在新的实践中运用和发展。下列关于毛泽东思想的历史地位的表述正确的是（ ）。","options":[{"text":"毛泽东思想是中国革命和建设的科学指南","correct":true},{"text":"毛泽东思想是中国特色社会主义理论的开篇之作","correct":false},{"text":"毛泽东思想是马克思主义中国化第一次历史性飞跃的成果","correct":true},{"text":"毛泽东思想是中国共产党和中国人民宝贵的精神财富","correct":true}],"answer":"ACD","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-fill-1","number":1,"type":"fill","typeLabel":"填空题","text":"无产阶级在同资产阶级结成统一战线时，要保持独立性，实行又团结又斗争、以（ ）求团结的政 策。","options":[],"answer":"斗争","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-fill-2","number":2,"type":"fill","typeLabel":"填空题","text":"毛泽东提出的把对人民内部的（ ）和对敌人的专政互相结合起来就是人民民主专政的理论，丰富 了马克思列宁主义关于无产阶级专政的学说。","options":[],"answer":"民主","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-fill-3","number":3,"type":"fill","typeLabel":"填空题","text":"（ ）在解放战争中总结出著名的十大军事原则，创造性地解决了缔造一个在党的绝对领导下的人 民武装力量的一系列重大问题。","options":[],"answer":"毛泽东","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-fill-4","number":4,"type":"fill","typeLabel":"填空题","text":"共产党员不但要在组织上入党，而且要在（ ）上入党，经常注意以无产阶级思想改造和克服各种 非无产阶级思想。","options":[],"answer":"思想","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-fill-5","number":5,"type":"fill","typeLabel":"填空题","text":"群众路线是以（ ）同志为主要代表的中国共产党人坚持把马克思列宁主义关于人民群众是历史创 造者的原理，系统地运用在党的全部活动中形成的党的根本工作路线。","options":[],"answer":"毛泽东","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-fill-6","number":6,"type":"fill","typeLabel":"填空题","text":"毛泽东是马克思主义中国化时代化的伟大开拓者，是（ ）的主要创立者。","options":[],"answer":"毛泽东思想","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-fill-7","number":7,"type":"fill","typeLabel":"填空题","text":"实事求是、群众路线、独立自主是毛泽东把（ ）和历史唯物主义运用到中国革命和建设实践中所 形成的具有中国共产党人鲜明特色的立场、观点、方法。","options":[],"answer":"辩证唯物主义;唯物辩证法","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-judge-1","number":1,"type":"judge","typeLabel":"判断题","text":"世界进入帝国主义和无产阶级革命时代后，殖民地半殖民地国家发生的反对帝国主义的革命仍然属 于旧的世界资产阶级民主主义革命的范畴。","options":[],"answer":"错","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-judge-2","number":2,"type":"judge","typeLabel":"判断题","text":"第一次国共合作是中国革命具有决定意义的新起点。","options":[],"answer":"错","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-judge-3","number":3,"type":"judge","typeLabel":"判断题","text":"毛泽东在对革命实践经验和教训科学总结的基础上，系统阐述了旧民主主义革命理论，实现了马克 思主义与中国革命实践相结合的历史性飞跃。","options":[],"answer":"错","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-judge-4","number":4,"type":"judge","typeLabel":"判断题","text":"无产阶级在被迫同资产阶级、主要是同大资产阶级分裂时，不得接受民族资产阶级的同情。","options":[],"answer":"错","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-judge-5","number":5,"type":"judge","typeLabel":"判断题","text":"以经济建设为中心，是我们党一切行动的根本出发点和落脚点，是我们党区别于其他一切政党的根 本标志。","options":[],"answer":"错","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-judge-6","number":6,"type":"judge","typeLabel":"判断题","text":"中国共产党只有放在依靠自己力量的基点上，才能最大限度地动员群众、组织群众，才能不受制于 人，取得的胜利也才能够得到巩固。","options":[],"answer":"对","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-1-judge-7","number":7,"type":"judge","typeLabel":"判断题","text":"怎样科学评价毛泽东和毛泽东思想的问题，关系到怎样看待党和国家过去几十年奋斗和前进的历 史，关系到党的团结、国家的安定，也关系到党和国家未来的发展前途。","options":[],"answer":"对","explanation":"","source":"第1章章节专用题库","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"chapter-2-single-1","number":1,"type":"single","typeLabel":"单选题","text":"在革命实践中，党不断积累丰富的经验，对中国革命的规律性认识趋于成熟，逐步形成了系统化的适合中 国国情的新民主主义革命理论。在抗日战争时期，党制定（ ），使全党对中国革命基本问题的认识达到一致。","options":[{"text":"《中国共产党章程》","correct":false},{"text":"《关于若干历史问题的决议》","correct":true},{"text":"《关于建国以来党的若干历史问题的决议》","correct":false},{"text":"《关于党的百年奋斗重大成就和历史经验的决议》","correct":false}],"answer":"B","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-2","number":2,"type":"single","typeLabel":"单选题","text":"毛泽东在（ ）中完整地总结和概括了新民主主义革命总路线的内容。","options":[{"text":"《在晋绥干部会议上的讲话》","correct":true},{"text":"《反对本本主义》","correct":false},{"text":"《改造我们的学习》","correct":false},{"text":"《论人民民主专政》","correct":false}],"answer":"A","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-3","number":3,"type":"single","typeLabel":"单选题","text":"毛泽东曾明确地说，革命就是要反抗“那封建宗法性一切反动势力根本源泉之地主阶级，使中国大多数穷 苦人民得享有经济幸福”。关于地主阶级，下列评价中错误的是（ ）。","options":[{"text":"只能在经济上对中国社会前进起到进步作用","correct":true},{"text":"以封建制度剥削和压迫农民的阶级","correct":false},{"text":"帝国主义统治中国和封建军阀实行专制统治的社会基础","correct":false},{"text":"中国经济现代化和政治民主化主要的、直接的障碍","correct":false}],"answer":"A","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-4","number":4,"type":"single","typeLabel":"单选题","text":"在土地革命战争时期，中国革命的主要对象是（ ）。","options":[{"text":"帝国主义支持下的北洋军阀","correct":false},{"text":"国民党新军阀","correct":true},{"text":"日本帝国主义","correct":false},{"text":"美帝国主义支持下的国民党反动派","correct":false}],"answer":"B","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-5","number":5,"type":"single","typeLabel":"单选题","text":"城市小资产阶级是无产阶级的可靠同盟者。下列各项中，不属于城市小资产阶级的是（ ）。","options":[{"text":"知识分子","correct":false},{"text":"小商人","correct":false},{"text":"买办分子","correct":true},{"text":"手工业者","correct":false}],"answer":"C","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-6","number":6,"type":"single","typeLabel":"单选题","text":"恩格斯指出：“无产阶级是完全靠出卖自己的劳动而不是靠某一种资本的利润来获得生活资料的社会阶级。 ”一般无产阶级的基本优点不包括（ ）。","options":[{"text":"与先进的生产方式相联系","correct":false},{"text":"没有私人占有的生产资料","correct":false},{"text":"富于组织纪律性","correct":false},{"text":"掌握生产资料","correct":true}],"answer":"D","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-7","number":7,"type":"single","typeLabel":"单选题","text":"中国近代历史的特殊性，决定了中国民主革命分为旧民主主义革命和新民主主义革命。新民主主义革命与 社会主义革命性质不同，其表现不包括（ ）。","options":[{"text":"新民主主义革命在政治上争取和联合民族资产阶级去反对共同的敌人","correct":false},{"text":"新民主主义革命在经济上保护民族工商业，容许有利于国计民生的私人资本主义发展","correct":false},{"text":"新民主主义革命要建立的是资产阶级专政，而不是无产阶级专政","correct":true},{"text":"新民主主义革命仍然属于资产阶级民主主义革命的范畴","correct":false}],"answer":"C","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-8","number":8,"type":"single","typeLabel":"单选题","text":"土地改革是中国共产党在执政前后对中国传统土地制度及其社会关系进行的一次疾风暴雨式的巨大变革。 土地改革的主要和直接任务，就是满足（ ）的要求。","options":[{"text":"贫雇农","correct":true},{"text":"中农","correct":false},{"text":"富农","correct":false},{"text":"地主","correct":false}],"answer":"A","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-9","number":9,"type":"single","typeLabel":"单选题","text":"毛泽东在（ ）中总结了中国革命两次胜利和两次失败的经验教训，提出了统一战线、武装斗争、党的建设 是党在中国革命中战胜敌人的三个主要的法宝。","options":[{"text":"《井冈山的斗争》","correct":false},{"text":"《星星之火，可以燎原》","correct":false},{"text":"《〈共产党人〉发刊词》","correct":true},{"text":"《湖南农民运动考察报告》","correct":false}],"answer":"C","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-10","number":10,"type":"single","typeLabel":"单选题","text":"无产阶级的领导权是新民主主义革命理论的核心问题。毛泽东在（ ）中，对新民主主义革命的基本经验 作了集中概括，丰富和发展了马克思主义关于无产阶级领导人民革命的理论。","options":[{"text":"《论人民民主专政》","correct":true},{"text":"《实践论》","correct":false},{"text":"《井冈山的斗争》","correct":false},{"text":"《关于正确处理人民内部矛盾的问题》","correct":false}],"answer":"A","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-11","number":11,"type":"single","typeLabel":"单选题","text":"认清国情，是认清和解决革命问题的基本依据。近代中国最基本的国情是（ ）。","options":[{"text":"中国是一个半殖民地半封建的社会","correct":true},{"text":"中国的政治经济发展不平衡","correct":false},{"text":"中国是东方的大国","correct":false},{"text":"中国是一个农民占人口多数的国家","correct":false}],"answer":"A","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-12","number":12,"type":"single","typeLabel":"单选题","text":"毛泽东思想紧紧围绕中国革命和建设的主题，提出了一系列相互关联的重要理论观点，构成了一个完整 的科学思想体系。中国革命的中心问题是（ ）。","options":[{"text":"农民土地问题","correct":false},{"text":"统一战线问题","correct":false},{"text":"武装斗争问题","correct":false},{"text":"领导权问题","correct":true}],"answer":"D","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-13","number":13,"type":"single","typeLabel":"单选题","text":"“因为中国资产阶级根本上与剥削农民的豪绅地主相联结相混合，中国革命要推翻豪绅地主阶级，便不 能不同时推翻资产阶级。”这一观点属于（ ）。","options":[{"text":"“毕其功于一役”的观点","correct":true},{"text":"“二次革命论”的观点","correct":false},{"text":"民主主义革命是社会主义革命必要准备的观点","correct":false},{"text":"中国革命分“两步走”的观点","correct":false}],"answer":"A","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-14","number":14,"type":"single","typeLabel":"单选题","text":"半殖民地半封建社会的社会性质，决定了近代中国不可能是一个独立的民主国家，外部没有民族独立， 而受帝国主义压迫；内部没有起码的资产阶级民主，反动统治阶级凭借强大的反革命武装对人民实行独裁恐 怖统治。这种社会性质决定了中国革命的主要斗争形式是（ ）。","options":[{"text":"争取民主","correct":false},{"text":"农民运动","correct":false},{"text":"武装斗争","correct":true},{"text":"工人运动","correct":false}],"answer":"C","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-15","number":15,"type":"single","typeLabel":"单选题","text":"1939年7月7日，是卢沟桥事变爆发2周年纪念日，华北联大在延安举行开学典礼，校长成仿吾请毛泽东作 报告。毛泽东以他特有的广征博引方式发表讲话，他说：“当年姜子牙下昆仑山，元始天尊赠了他杏黄旗、 四不像和打神鞭三样法宝。现在你们出发上前线，我也赠给你们三样法宝。”毛泽东赠给的“三样法宝”是 指（ ）。","options":[{"text":"土地革命、武装斗争、农村革命根据地建设","correct":false},{"text":"统一战线、武装斗争、党的建设","correct":true},{"text":"实事求是、群众路线、独立自主","correct":false},{"text":"理论联系实际、密切联系群众、批评与自我批评","correct":false}],"answer":"B","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-16","number":16,"type":"single","typeLabel":"单选题","text":"统一战线是无产阶级政党策略思想的重要内容。无产阶级及其政党在统一战线中必须坚持的原则是（ ）。","options":[{"text":"“一切经过统一战线”","correct":false},{"text":"“一切服从统一战线”","correct":false},{"text":"斗争到底","correct":false},{"text":"独立自主","correct":true}],"answer":"D","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-17","number":17,"type":"single","typeLabel":"单选题","text":"要建设一个广大群众性的、马克思主义的无产阶级政党，是一项艰巨的任务，必须不断地结合革命形势 的发展需要加强党的建设。毛泽东思想关于党的建设理论中，始终放在党的建设的首位的是（ ）。","options":[{"text":"加强党的思想建设","correct":true},{"text":"加强党的组织建设","correct":false},{"text":"加强领导班子建设","correct":false},{"text":"保持党的优良作风","correct":false}],"answer":"A","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-18","number":18,"type":"single","typeLabel":"单选题","text":"官僚资本是中国资本主义经济的主体。没收官僚资本，具有民主革命和社会主义革命两重性质，其具有 社会主义革命的性质是（ ）。","options":[{"text":"反对外国帝国主义的附庸","correct":false},{"text":"反对中国的大资产阶级","correct":true},{"text":"反对中国的买办资产阶级","correct":false},{"text":"反对三座大山的经济基础","correct":false}],"answer":"B","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-19","number":19,"type":"single","typeLabel":"单选题","text":"新旧两种民主主义革命的根本区别是（ ）。","options":[{"text":"革命前途","correct":false},{"text":"领导力量","correct":true},{"text":"时代背景","correct":false},{"text":"指导思想","correct":false}],"answer":"B","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-21","number":21,"type":"single","typeLabel":"单选题","text":"新民主主义基本纲领是新民主主义革命总路线的具体展开和体现，新民主主义革命纲领包括政治、经济 和文化。在新民主主义经济纲领中，新民主主义革命的任务不包括（ ）。","options":[{"text":"摧毁民族工商业","correct":true},{"text":"没收官僚资本归新民主主义国家所有","correct":false},{"text":"推翻帝国主义和封建主义的统治","correct":false},{"text":"没收封建地主阶级的土地归农民所有","correct":false}],"answer":"A","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-22","number":22,"type":"single","typeLabel":"单选题","text":"毛泽东指出：“中国反帝反封建的资产阶级民主革命的任务，历史已判定不能经过资产阶级的领导，而 必须经过无产阶级的领导，才能够完成。”正因为新民主主义革命是由无产阶级及其政党——中国共产党领 导的，因此新民主主义革命（ ）。","options":[{"text":"性质是无产阶级社会主义革命","correct":false},{"text":"前途是社会主义","correct":true},{"text":"要建立的是无产阶级专政","correct":false},{"text":"要实现的目标是消灭资本主义剥削制度和改造小生产的私有制","correct":false}],"answer":"B","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-23","number":23,"type":"single","typeLabel":"单选题","text":"没收官僚资本归新民主主义国家所有，是新民主主义革命的题中应有之义。反对官僚资本主义并非因为 它是资本主义，而是因为这种资本主义同外国帝国主义、本国地主阶级和旧式富农密切地结合着。没收官僚 资本包含着（ ）。","options":[{"text":"资产阶级革命性质","correct":false},{"text":"旧民主主义革命性质","correct":false},{"text":"旧民主主义革命和新民主主义革命双重性质","correct":false},{"text":"新民主主义革命和社会主义革命双重性质","correct":true}],"answer":"D","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-24","number":24,"type":"single","typeLabel":"单选题","text":"在半殖民地半封建的近代中国，社会矛盾错综复杂。其中，占支配地位的主要矛盾是（ ）。","options":[{"text":"无产阶级和资产阶级的矛盾","correct":false},{"text":"农民阶级和地主阶级、官僚资产阶级的矛盾","correct":false},{"text":"帝国主义和中华民族的矛盾、封建主义和人民大众的矛盾","correct":true},{"text":"民族资产阶级和官僚资产阶级的矛盾","correct":false}],"answer":"C","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-single-25","number":25,"type":"single","typeLabel":"单选题","text":"新民主主义革命不是要建立资产阶级共和国，造成资产阶级专政，而是要（ ）。","options":[{"text":"建立无产阶级专政的共和国","correct":false},{"text":"建立各革命阶级在无产阶级领导之下的联合专政","correct":true},{"text":"建立工农联盟专政的共和国","correct":false},{"text":"建立资产阶级领导的联合政府","correc orrect":true}],"answer":"ABD","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-multiple-8","number":8,"type":"multiple","typeLabel":"多选题","text":"毛泽东指出：“拿资本主义的某种发展去代替外国帝国主义和本国封建主义的压迫，不但是一个进步，而 且是一个不可避免的过程。它不但有利于资产阶级，同时也有利于无产阶级，或者说更有利于无产阶级。” 这说明，在民主革命阶段，中国共产党实行保护民族工商业的经济纲领是有原因的，其原因在于（ ）。","options":[{"text":"资本主义的发展阶段在中国是不可避免的","correct":false},{"text":"新民主主义革命的性质决定的","correct":true},{"text":"中国生产力发展的水平决定的","correct":true},{"text":"民族资本主义经济是一种与新生产力相联系的先进的生产方式和经济成分","correct":true}],"answer":"BCD","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-multiple-9","number":9,"type":"multiple","typeLabel":"多选题","text":"1928—1930年，毛泽东相继写下了一系列文章，提出了“工农武装割据”，初步形成了农村包围城市的革 命道路理论。这些著作主要有（ ）。","options":[{"text":"《中国的红色政权为什么能够存在？》","correct":true},{"text":"《星星之火，可以燎原》","correct":true},{"text":"《井冈山的斗争》","correct":true},{"text":"《中国社会各阶级的分析》","correct":false}],"answer":"ABC","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-multiple-10","number":10,"type":"multiple","typeLabel":"多选题","text":"土地革命战争时期，毛泽东指出：“一国之内，在四周白色政权的包围中，有一小块或若干小块红色政 权的区域长期地存在，这是世界各国从来没有的事。这种奇事的发生，有其独特的原因。”红色政权能够存 在和发展的原因是（ ）。","options":[{"text":"近代中国是多个帝国主义间接统治的半殖民地国家，社会政治经济发展极端不平衡","correct":true},{"text":"国民革命的政治影响及良好的群众基础","correct":true},{"text":"全国革命形势的继续向前发展","correct":true},{"text":"相当力量正式红军的存在以及党的领导的有力量及其正确的政策","correct":true}],"answer":"ABCD","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-multiple-11","number":11,"type":"multiple","typeLabel":"多选题","text":"统一战线是中国共产党凝聚人心、汇聚力量的政治优势和战略方针。中国革命必须建立最广泛的统一战 线，这是由（ ）决定的。","options":[{"text":"中国半殖民地半封建社会的阶级状况","correct":true},{"text":"近代中国社会最大的压迫是阶级压迫","correct":false},{"text":"中国革命的长期性、残酷性及其发展的不平衡性","correct":true},{"text":"和平与发展的时代主题","correct":false}],"answer":"AC","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-multiple-12","number":12,"type":"multiple","typeLabel":"多选题","text":"在中国人民艰苦卓绝的抗日战争中，由于有抗日民族统一战线作为根本保证，中国最终赢得了近代以来 抗击外敌入侵的第一次完全胜利。中国共产党在抗日民族统一战线中的策略总方针是（ ）。","options":[{"text":"发展进步势力","correct":true},{"text":"打击反对势力","correct":false},{"text":"争取中间势力","correct":true},{"text":"孤立顽固势力","correct":true}],"answer":"ACD","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-multiple-13","number":13,"type":"multiple","typeLabel":"多选题","text":"毛泽东在系统论述新民主主义革命的基本经验时归纳的既是中国革命的基本特点，也是战胜敌人的基本 武器的是（ ）。","options":[{"text":"统一战线","correct":true},{"text":"武装斗争","correct":true},{"text":"党的建设","correct":false},{"text":"实事求是","correct":false}],"answer":"AB","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-multiple-14","number":14,"type":"multiple","typeLabel":"多选题","text":"毛泽东从中国的历史状况和社会状况出发，创立了无产阶级领导的、工农联盟为基础的、人民大众的， 反对（ ）的新民主主义革命的理论。","options":[{"text":"帝国主义","correct":true},{"text":"殖民主义","correct":false},{"text":"封建主义","correct":true},{"text":"官僚资本主义","correct":true}],"answer":"ACD","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-multiple-15","number":15,"type":"multiple","typeLabel":"多选题","text":"1945年4月23日至6月11日，中国共产党第七次全国代表大会在延安召开。毛泽东在《论联合政府》的报 告中明确指出：“以马克思列宁主义的理论思想武装起来的中国共产党，在中国人民中产生了新的工作作风。 ”中国共产党区别于其他一切政党的优良作风有（ ）。","options":[{"text":"艰苦奋斗的优良作风","correct":false},{"text":"理论和实践相结合的作风","correct":true},{"text":"和人民群众紧密联系在一起的作风","correct":true},{"text":"自我批评的作风","correct":true}],"answer":"BCD","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-multiple-16","number":16,"type":"multiple","typeLabel":"多选题","text":"毛泽东在谈到党对民主革命规律的认识时指出，从党的建立到抗日时期，我们经过了两次胜利两次失败。 “在抗日时期，我们才制定了合乎情况的党的总路线和一整套具体政策。这时候，中国民主革命这个必然王 国才被我们认识，我们才有了自由”。这表明（ ）。","options":[{"text":"党已完全掌握了新民主主义革命的发展规律","correct":false},{"text":"马克思主义必须与中国革命具体实际相结合","correct":true},{"text":"党对民主革命规律的认识必有一个过程","correct":true},{"text":"新民主主义革命理论是总结正反两方面经验形成的","correct":true}],"answer":"BCD","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-multiple-17","number":17,"type":"multiple","typeLabel":"多选题","text":"毛泽东曾在1940年《新民主主义论》中就提出过新民主主义的经济纲领，后又在《目前形势和我们的任 务》中对新民主主义经济纲领做了明确概括。关于新民主主义的经济纲领，说法正确的有（ ）。","options":[{"text":"没收封建地主阶级的土地归农民所有","correct":true},{"text":"没收官僚资产阶级的垄断资本归新民主主义的国家所有","correct":true},{"text":"保护民族工商业","correct":true},{"text":"发展新民主主义性质的经济","correct":false}],"answer":"ABC","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-multiple-18","number":18,"type":"multiple","typeLabel":"多选题","text":"毛泽东从中国的历史和现实出发，深刻研究中国革命的特点和规律，发展了马克思列宁主义关于无产阶 级在民主革命中的领导权思想，创立了无产阶级领导的，工农联盟为基础的，人民大众的，反对帝国主义、 封建主义和官僚资本主义的新民主主义革命理论。新民主主义革命理论的内容有（ ）。","options":[{"text":"无产阶级领导的统一战线要争取民族资产阶级参加","correct":true},{"text":"在同资产阶级结成统一战线时要保持无产阶级的独立性","correct":true},{"text":"中国革命只能以长期的武装斗争为主要形式","correct":true},{"text":"农民是无产阶级最可靠的同盟军","correct":true}],"answer":"ABCD","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-multiple-19","number":19,"type":"multiple","typeLabel":"多选题","text":"无产阶级及其政党对中国革命的领导权不是自然而然得来的，而是在与资产阶级争夺领导权的斗争中实 现的。领导的阶级和政党，要实现自己对于被领导的阶级、阶层、政党和人民团体的领导，必须（ ）。","options":[{"text":"率领被领导者向着共同敌人作坚决的斗争并取得胜利","correct":true},{"text":"对被领导者给以物质福利，至少不损害其利益","correct":true},{"text":"对被领导者给以政治教育","correct":true},{"text":"必须建立以工农联盟为基础的广泛的统一战线","correct":true}],"answer":"ABCD","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-multiple-20","number":20,"type":"multiple","typeLabel":"多选题","text":"中国半殖民地半封建社会的阶级状况复杂，毛泽东指出：“中国社会是一个两头小中间大的社会。”其 中，中间部分包括的阶级是（ ）。","options":[{"text":"无产阶级","correct":false},{"text":"大地主大资产阶级","correct":false},{"text":"农民、城市小资产阶级","correct":true},{"text":"其他的中间阶级","correct":true}],"answer":"CD","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-multiple-21","number":21,"type":"multiple","typeLabel":"多选题","text":"中国共产党从1921年成立至今，共经历了五次统一战线。在党领导中国人民进行新民主主义革命和社会 主义建设的过程中形成、发展和壮大起来的统一战线，在不同的历史时期有着不同的任务、内容以及特点。 作为近代中国革命胜利的三大法宝，建立统一战线的必要性是由（ ）所决定的。","options":[{"text":"中国半殖民地半封建社会的阶级状况","correct":true},{"text":"中国社会是“两头小中间大”的社会","correct":true},{"text":"半殖民地半封建的中国社会，诸多矛盾交织在一起","correct":false},{"text":"中国革命的长期性、残酷性及其发展的不平衡性","correct":true}],"answer":"ABD","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-multiple-22","number":22,"type":"multiple","typeLabel":"多选题","text":"毛泽东曾经指出，一切殖民地半殖民地国家的革命，在一定历史时期中所采取的国家形式，既不是资产 阶级专政的共和国，也不是无产阶级专政的共和国，而“只能是第三种形式，这就是所谓新民主主义共和国 ”，它是“过渡的形式”，但却“是不可移易的必要的形式。”新民主主义共和国的“过渡性”表现为（ ）。","options":[{"text":"社会主义的因素居于领导地位，但非社会主义因素仍占很大比重","correct":true},{"text":"中国共产党是执政党，各民主党派是参政党","correct":false},{"text":"公有制为主体，多种所有制经济并存","correct":false},{"text":"私有性质的经济成分需要被改造成社会主义经济","correct":true}],"answer":"AD","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-multiple-23","number":23,"type":"multiple","typeLabel":"多选题","text":"党对中国革命应该走什么样的道路的认识，经历了一个艰难的探索过程。1927年大革命失败后，党的工 作重心开始转向农村。在领导井冈山革命根据地的革命实践斗争中，提出了“工农武装割据”，初步形成了 农村包围城市的革命道路理论。毛泽东在这一时期相继写下的文章有（ ）。","options":[{"text":"《战争和战略问题》","correct":false},{"text":"《井冈山的斗争》","correct":true},{"text":"《星星之火，可以燎原》","correct":true},{"text":"《中国的红色政权为什么能够存在？》","correct":true}],"answer":"BCD","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-multiple-24","number":24,"type":"multiple","typeLabel":"多选题","text":"毛泽东在《中国革命和中国共产党》中论述了民主革命和社会主义革命的关系。他把新民主主义革命和 社会主义革命比喻为文章的上篇和下篇。“两篇文章，上篇与下篇，只有上篇做好，下篇才能做好。坚决地 领导民主革命，是争取社会主义胜利的条件。”这说明（ ）。","options":[{"text":"民主革命是社会主义革命的必要准备","correct":true},{"text":"中国的民主革命中包含了绝大部分的社会主义因素","correct":false},{"text":"中国国情决定中国革命必须分两步走","correct":false},{"text":"社会主义革命是民主革命的必然趋势","correct":true}],"answer":"AD","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-multiple-25","number":25,"type":"multiple","typeLabel":"多选题","text":"帝国主义列强通过武装入侵和强迫清政府签订一系列不平等条约，使中国半殖民地化。这些侵略造成的 结果包括（ ）。","options":[{"text":"操纵了中国的财政和经济命脉","correct":true},{"text":"操纵了中国的政治和军事力量","correct":true},{"text":"破坏中国的领土完整，使中国实际上处于许多帝国主义国家的统治或半统治之下","correct":true},{"text":"使中国的经济、政治和文化发展表现出极端的不平衡性","correct":true}],"answer":"ABCD","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-multiple-26","number":26,"type":"multiple","typeLabel":"多选题","text":"新民主主义革命与旧式民主主义革命相比，具有不同的特点。这些特点包括（ ）。","options":[{"text":"新民主主义革命不是要建立资产阶级共和国，而是要建立各革命阶级联合专政的民主共和国","correct":true},{"text":"新民主主义革命只推翻帝国主义、封建主义和官僚资本主义的反动统治","correct":true},{"text":"新民主主义革命不破坏参加反帝反封建的资本主义成分","correct":true},{"text":"新民主主义革命属于旧的世界资产阶级民主主义革命的范畴","correct":false}],"answer":"ABC","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-multiple-27","number":27,"type":"multiple","typeLabel":"多选题","text":"没收官僚资本归新民主主义国家所有，是新民主主义革命的题中应有之义。这是因为官僚资本主义（ ）。","options":[{"text":"同外国帝国主义、本国地主阶级和旧式富农密切结合","correct":true},{"text":"是一种买办的封建的国家垄断资本主义","correct":true},{"text":"同大地主大资产阶级的反革命国家政权密切结合","correct":true},{"text":"对中国的经济发展和社会进步起着严重的阻碍作用","correct":true}],"answer":"ABCD","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-multiple-28","number":28,"type":"multiple","typeLabel":"多选题","text":"毛泽东在《〈共产党人〉发刊词》中指出：“正确地理解了这三个问题及其相互关系，就等于正确地领 导了全部中国革命。”其中，“这三个问题”是指（ ）。","options":[{"text":"统一战线问题","correct":true},{"text":"武装斗争问题","correct":true},{"text":"党的建设问题","correct":true},{"text":"土地革命问题","correct":false}],"answer":"ABC","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-multiple-29","number":29,"type":"multiple","typeLabel":"多选题","text":"“枪杆子里面出政权”是党在革命斗争中得出的重要结论。关于人民军队的建设和武装斗争，下列表述 正确的有（ ）。","options":[{"text":"人民军队是一个执行革命的政治任务的武装集团","correct":true},{"text":"人民军队必须服从于无产阶级思想领导","correct":true},{"text":"人民军队必须服务于人民斗争和根据地建设","correct":true},{"text":"人民军队的主要任务是打仗，不需要做群众工作","correct":false}],"answer":"ABC","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-fill-1","number":1,"type":"fill","typeLabel":"填空题","text":"保持党在思想上、政治上和组织上的独立性，实行又联合又（ ）的方针，是坚持领导权的基本策略。","options":[],"answer":"斗争","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-fill-2","number":2,"type":"fill","typeLabel":"填空题","text":"秋收起义失败后，（ ）率领队伍开赴井冈山，创建了井冈山革命根据地，把武装斗争的主攻方向首先指向 农村。","options":[],"answer":"毛泽东","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-fill-3","number":3,"type":"fill","typeLabel":"填空题","text":"（ ）在党的六届六中全会上明确指出：“共产党的任务，基本地不是经过长期合法斗争以进入起义和战争 ，也不是先占城市后取乡村，而是走相反的道路。”","options":[],"answer":"毛泽东","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-1","number":1,"type":"judge","typeLabel":"判断题","text":"在近代中国，中国民族资本主义发展成为中国经济的主要形式，并在整个社会经济中占据主导地位。","options":[],"answer":"错","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-2","number":2,"type":"judge","typeLabel":"判断题","text":"虽然近代中国仍然保留着形式上的独立，实际上已经受制于帝国主义列强，丧失了真正独立的地位，成为 帝国主义列强的半殖民地。","options":[],"answer":"对","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-3","number":3,"type":"judge","typeLabel":"判断题","text":"十月革命建立了一条从西方无产者经过俄国革命，到东方被压迫民族的新的反对世界帝国主义的革命战线。","options":[],"answer":"对","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-4","number":4,"type":"judge","typeLabel":"判断题","text":"新民主主义革命要建立资产阶级共和国，造成资产阶级专政。","options":[],"answer":"错","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-5","number":5,"type":"judge","typeLabel":"判断题","text":"新民主主义革命理论的形成和发展，是建立在中国革命的实践、党对革命实践经验的科学概括和总结的基 础之上的。","options":[],"answer":"对","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-6","number":6,"type":"judge","typeLabel":"判断题","text":"没有两次国共合作的实践，就没有关于统一战线的理论。","options":[],"answer":"对","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-7","number":7,"type":"judge","typeLabel":"判断题","text":"没有在领导新民主主义革命的历程中，党由小到大、由弱到强的实践，就不会有党的建设的理论。","options":[],"answer":"对","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-8","number":8,"type":"judge","typeLabel":"判断题","text":"分清敌友是新民主主义革命的首要问题。","options":[],"answer":"对","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-9","number":9,"type":"judge","typeLabel":"判断题","text":"推翻帝国主义的压迫是近代中国走向独立和富强的前提。","options":[],"answer":"对","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-10","number":10,"type":"judge","typeLabel":"判断题","text":"官僚资本主义对广大劳动人民的残酷剥削和对民族工商业的巧取豪夺，严重束缚了近代中国社会生产力 的发展。","options":[],"answer":"对","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-11","number":11,"type":"judge","typeLabel":"判断题","text":"普及新文化是中国革命的中心问题，也是新民主主义革命理论的核心问题。","options":[],"answer":"错","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-12","number":12,"type":"judge","typeLabel":"判断题","text":"帝国主义希望中国民族资产阶级能够建立独立的资产阶级共和国。","options":[],"answer":"错","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-13","number":13,"type":"judge","typeLabel":"判断题","text":"社会主义阵营的强力外援是中国革命取得胜利的根本保证。","options":[],"answer":"错","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-14","number":14,"type":"judge","typeLabel":"判断题","text":"中国的新民主主义革命实质上就是无产阶级领导下的工人革命。","options":[],"answer":"错","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-15","number":15,"type":"judge","typeLabel":"判断题","text":"加强无产阶级政党的建设是实现无产阶级领导权的根本保证。","options":[],"answer":"对","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-16","number":16,"type":"judge","typeLabel":"判断题","text":"新民主主义革命的性质是无产阶级社会主义的。","options":[],"answer":"错","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-17","number":17,"type":"judge","typeLabel":"判断题","text":"新民主主义革命属于社会主义革命的范畴，是世界无产阶级社会主义革命的一部分。","options":[],"answer":"错","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-18","number":18,"type":"judge","typeLabel":"判断题","text":"革命的根本问题是经济统治问题。","options":[],"answer":"错","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-19","number":19,"type":"judge","typeLabel":"判断题","text":"中国社会的性质决定了中国革命的历史进程必须分两步走。","options":[],"answer":"对","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-20","number":20,"type":"judge","typeLabel":"判断题","text":"民族资本主义经济是一种与新生产力相联系的先进的生产方式和经济成分，对近代中国发展先进技术、 发展社会生产力具有积极作用。","options":[],"answer":"对","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-21","number":21,"type":"judge","typeLabel":"判断题","text":"中国共产党在成立初期，对于发动农民参加革命、建立农村革命根据地的重要性就具有了足够的认识。","options":[],"answer":"错","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-22","number":22,"type":"judge","typeLabel":"判断题","text":"工人阶级和非劳动人民的联盟是非基本的、辅助性的，是因为近代中国民族资产阶级在政治上和经济上 无法发挥作用。","options":[],"answer":"错","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-23","number":23,"type":"judge","typeLabel":"判断题","text":"人民军队必须是服从于无产阶级思想领导的、服务于人民斗争和根据地建设的工具。","options":[],"answer":"对","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-25","number":25,"type":"judge","typeLabel":"判断题","text":"毛泽东认为，在战略上要重视敌人，在战术上要藐视敌人，这是中国革命取得胜利的重要策略思想。","options":[],"answer":"错","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-26","number":26,"type":"judge","typeLabel":"判断题","text":"中国革命的主要敌人是帝国主义、封建主义和民族资本主义，它们是压在中国人民头上的三座大山。","options":[],"answer":"错","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-27","number":27,"type":"judge","typeLabel":"判断题","text":"城市小资产阶级包括知识分子、小商人、手工业者和自由职业者，由于受帝国主义、封建主义和官僚资 本主义的压迫，他们是中国革命的动力之一。","options":[],"answer":"对","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-28","number":28,"type":"judge","typeLabel":"判断题","text":"中国无产阶级从诞生之日起，就身受外国资本主义、本国封建势力和民族资产阶级的三重压迫，这些压 迫的严重性和残酷性是世界各民族中少见的。","options":[],"answer":"错","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-29","number":29,"type":"judge","typeLabel":"判断题","text":"新民主主义革命要建立的是无产阶级领导的各革命阶级的联合专政，而不是无产阶级专政。","options":[],"answer":"对","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-30","number":30,"type":"judge","typeLabel":"判断题","text":"没收封建地主阶级的土地归农民所有，是新民主主义经济纲领中极具特色的一项内容。","options":[],"answer":"错","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-31","number":31,"type":"judge","typeLabel":"判断题","text":"毛泽东在《中国的红色政权为什么能够存在？》《井冈山的斗争》《星星之火，可以燎原》等文章中提 出了“工农武装割据”思想，初步形成了农村包围城市的革命道路理论。","options":[],"answer":"对","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-32","number":32,"type":"judge","typeLabel":"判断题","text":"党领导的革命统一战线中，工人阶级同非劳动人民的联盟，主要是与民族资产阶级的联盟，这是统一战 线的基础，是基本的、主要的联盟。","options":[],"answer":"错","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-33","number":33,"type":"judge","typeLabel":"判断题","text":"大革命时期，党在统一战线、武装斗争和党的建设这三个基本问题上都有一定经验，因此能够巩固革命 的胜利。","options":[],"answer":"错","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-34","number":34,"type":"judge","typeLabel":"判断题","text":"在近代中国的诸多社会矛盾中，帝国主义和中华民族的矛盾是各种矛盾中最主要的矛盾。","options":[],"answer":"对","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-35","number":35,"type":"judge","typeLabel":"判断题","text":"以五四运动为标志，中国无产阶级开始作为独立的政治力量登上历史舞台，成为革命的领导力量。","options":[],"answer":"对","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-36","number":36,"type":"judge","typeLabel":"判断题","text":"邓小平指出，毛泽东思想从历史上证明了是好的，中国革命是由毛泽东思想引导到胜利的。","options":[],"answer":"对","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-2-judge-37","number":37,"type":"judge","typeLabel":"判断题","text":"毛泽东提出“须知政权是由枪杆子中取得的”著名论断，是在抗日战争时期总结正面战场经验的基础上 提出的。","options":[],"answer":"错","explanation":"","source":"第2章章节专用题库","chapter":"2","section":"2.0","warning":false,"warningText":""},{"id":"chapter-3-single-1","number":1,"type":"single","typeLabel":"单选题","text":"存在于新民主主义社会中的经济成分不包括（ ）。","options":[{"text":"社会主义性质的国营经济","correct":false},{"text":"农民和手工业者的个体经济","correct":false},{"text":"私人资本主义经济","correct":false},{"text":"官僚资本主义经济","correct":true}],"answer":"D","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-2","number":2,"type":"single","typeLabel":"单选题","text":"社会主要矛盾不是一成不变的，它在一定条件下会发生转变。随着土地改革的基本完成，（ ）逐步成为我 国社会的主要矛盾。","options":[{"text":"地主阶级和资产阶级的矛盾","correct":false},{"text":"帝国主义和中华民族的矛盾","correct":false},{"text":"工人阶级和资产阶级的矛盾","correct":true},{"text":"封建主义和人民大众的矛盾","correct":false}],"answer":"C","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-3","number":3,"type":"single","typeLabel":"单选题","text":"工业化是中国屹立于世界的必由之路。（ ）提出了使中国“稳步地由农业国转变为工业国，由新民主主义 国家转变为社会主义国家”即“两个转变”同时并举的思想。","options":[{"text":"党的一大","correct":false},{"text":"遵义会议","correct":false},{"text":"党的六届六中全会","correct":false},{"text":"党的七届二中全会","correct":true}],"answer":"D","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-4","number":4,"type":"single","typeLabel":"单选题","text":"到（ ）年，我国国民经济得以恢复，民主革命遗留任务已经完成，经济、政治及社会面貌发生巨大变化。","options":[{"text":"1949","correct":false},{"text":"1952","correct":true},{"text":"1954","correct":false},{"text":"1956","correct":false}],"answer":"B","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-5","number":5,"type":"single","typeLabel":"单选题","text":"马克思、恩格斯在《共产党宣言》中指出：“工人革命的第一步就是使（ ）上升为统治阶级，争得民主。 ”","options":[{"text":"无产阶级","correct":true},{"text":"大资产阶级","correct":false},{"text":"农民阶级","correct":false},{"text":"城市小资产阶级","correct":false}],"answer":"A","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-6","number":6,"type":"single","typeLabel":"单选题","text":"关于对农业、手工业的社会主义改造中的自愿互利基本原则，下列做法中错误的是（ ）。","options":[{"text":"采取耐心说服教育、典型示范和国家帮助的方法","correct":false},{"text":"入社过程中主要依据行政安排确定生产资料折价和收益补偿","correct":true},{"text":"在农民和手工业者加入合作社时，要合理地处理生产资料入社的折价和收益补偿问题","correct":false},{"text":"农民和手工业者入社以后，要处理好各方面的经济关系及生产和收益分配方面的问题","correct":false}],"answer":"B","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-7","number":7,"type":"single","typeLabel":"单选题","text":"1953年2月，中央作出《关于农业生产互助合作的决议》，要求在农村普遍成立社会主义萌芽性质的互助 组。关于农业互助组，下列说法中错误的是（ ）。","options":[{"text":"主要是为了解决农业生产过程中各自的劳动力、畜力、农具不足的困难","correct":false},{"text":"由农民自愿组成","correct":false},{"text":"土地耕畜和其他生产资料归集体所有","correct":true},{"text":"具有社会主义萌芽性质","correct":false}],"answer":"C","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-8","number":8,"type":"single","typeLabel":"单选题","text":"在社会主义改造时期，朱德及时指出，手工业要发展，必须响应党中央的号召，走组织起来的道路。关于 个体手工业经济，下列说法中错误的是（ ）。","options":[{"text":"建立在生产资料私有制和个体劳动基础上","correct":false},{"text":"规模狭小","correct":false},{"text":"经营分散","correct":false},{"text":"技术先进","correct":true}],"answer":"D","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-9","number":9,"type":"single","typeLabel":"单选题","text":"手工业社会主义改造通过手工业供销小组、手工业供销合作社、手工业生产合作社三种形式，逐步把大量 分散的个体手工业者组织起来。关于手工业供销合作社，下列说法中错误的是（ ）。","options":[{"text":"由供销合作社通过供应原料、推销产品，或加工订货","correct":false},{"text":"具有半社会主义性质","correct":false},{"text":"生产活动仍由各社员分散独立完成","correct":false},{"text":"统一供销业务，全部生产资料归公有","correct":true}],"answer":"D","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-10","number":10,"type":"single","typeLabel":"单选题","text":"国家资本主义有初级形式和高级形式之分，下列各项中，属于高级形式的国家资本主义的是（ ）。","options":[{"text":"统购包销","correct":false},{"text":"公私合营","correct":true},{"text":"委托加工","correct":false},{"text":"计划订货","correct":false}],"answer":"B","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-11","number":11,"type":"single","typeLabel":"单选题","text":"过渡时期总路线的特征是社会主义工业化和社会主义改造同时并举，到1956年我国社会主义改造基本完 成时，“（ ）”计划的主要指标已提前完成，到1957年，各项指标均超额完成。","options":[{"text":"一五","correct":true},{"text":"二五","correct":false},{"text":"三五","correct":false},{"text":"四五","correct":false}],"answer":"A","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-12","number":12,"type":"single","typeLabel":"单选题","text":"在中国这样一个人口多、底子薄的农业大国推进社会主义工业化，无疑是一项长期、复杂、艰巨的伟大 任务。中国共产党坚持社会主义改造与社会主义工业化同时并举的方针，在深刻的社会变革中的重要意义不 包括（ ）。","options":[{"text":"建立完善的工业体系","correct":true},{"text":"保持社会稳定","correct":false},{"text":"逐步改善人民生活","correct":false},{"text":"推动社会进步","correct":false}],"answer":"A","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-13","number":13,"type":"single","typeLabel":"单选题","text":"（ ）年底，我国对农业、手工业和资本主义工商业的社会主义改造基本完成，农业、手工业个体所有制 基本上转变成为劳动群众集体所有的公有制。","options":[{"text":"1949","correct":false},{"text":"1952","correct":false},{"text":"1956","correct":true},{"text":"1958","correct":false}],"answer":"C","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-14","number":14,"type":"single","typeLabel":"单选题","text":"1954年9月，第一届全国人民代表大会的召开和（ ）的制定及颁布施行，为各族人民参与国家政治生活 提供了必要条件和保证，为逐步健全和完善我国社会主义政治制度奠定了坚实的基础。","options":[{"text":"《中华人民共和国婚姻法》","correct":false},{"text":"《中华人民共和国宪法》","correct":true},{"text":"《中华人民共和国土地改革法》","correct":false},{"text":"《中华人民共和国民法（草稿）》","correct":false}],"answer":"B","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-15","number":15,"type":"single","typeLabel":"单选题","text":"社会主义革命和建设时期，党面临的主要任务是，实现从新民主主义到社会主义的转变，进行社会主义 革命，推进社会主义建设，为实现中华民族伟大复兴奠定根本政治前提和制度基础。中国社会步入社会主义 社会最主要的标志是（ ）。","options":[{"text":"社会主义政治制度的确立","correct":false},{"text":"社会主义经济制度的确立","correct":true},{"text":"民主革命遗留任务的完成","correct":false},{"text":"人民民主专政政权的建立","correct":false}],"answer":"B","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-16","number":16,"type":"single","typeLabel":"单选题","text":"农业生产合作社是在中国共产党和人民政府的领导和帮助下，由劳动农民在自愿互利的基础上组织起来 的合作经济组织。在农业合作化进程中，具有半社会主义性质的组织形式是（ ）。","options":[{"text":"临时互助组","correct":false},{"text":"常年互助组","correct":false},{"text":"初级合作社","correct":true},{"text":"高级合作社","correct":false}],"answer":"C","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-17","number":17,"type":"single","typeLabel":"单选题","text":"新民主主义社会在经济上实行国营经济、合作社经济、个体经济、私人资本主义经济和国家资本主义经 济五种经济成分并存的经济制度。五种经济成分中，在国民经济中居于领导地位的是（ ）。","options":[{"text":"国营经济","correct":true},{"text":"个体经济","correct":false},{"text":"国家资本主义经济","correct":false},{"text":"私人资本主义经济","correct":false}],"answer":"A","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-18","number":18,"type":"single","typeLabel":"单选题","text":"党在过渡时期总路线的主要内容被概括为“一化三改”，也曾被比喻为鸟的“主体”和“两翼”。“主 体”是指（ ）。","options":[{"text":"对个体农业的社会主义改造","correct":false},{"text":"对手工业的社会主义改造","correct":false},{"text":"对资本主义工商业的社会主义改造","corre ":""},{"id":"chapter-3-single-28","number":28,"type":"single","typeLabel":"单选题","text":"从中华人民共和国成立到社会主义改造基本完成，是我国从新民主主义到社会主义过渡的时期。这一时 期，我国社会的性质是新民主主义社会。从社会形态来看，新民主主义社会是（ ）。","options":[{"text":"一个完全独立的社会形态","correct":false},{"text":"以非公有制居于领导地位的社会形态","correct":false},{"text":"属于社会主义初级阶段的特殊社会形态","correct":false},{"text":"向社会主义社会转变的过渡性社会形态","correct":true}],"answer":"D","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-29","number":29,"type":"single","typeLabel":"单选题","text":"中国共产党在完成了民主革命的任务以后，就把建立社会主义社会作为新的奋斗目标。中共中央于1953 年正式提出党在过渡时期的总路线。这一路线的“主体”是（ ）。","options":[{"text":"确立社会主义制度","correct":false},{"text":"实施工商业赎买政策","correct":false},{"text":"实现国家的社会主义工业化","correct":true},{"text":"发展农业合作化","correct":false}],"answer":"C","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-30","number":30,"type":"single","typeLabel":"单选题","text":"在对农业的社会主义改造中，党创造出互助组、初级社、高级社等过渡形式。这种从实际出发引导农民 逐步走向社会主义的渐进的改造方式，可以使农民亲身体会到组织起来力量大，可以增加生产，有利于（ ）。","options":[{"text":"迅速实现农业机械化","correct":false},{"text":"防止出现两极分化","correct":true},{"text":"立即消灭富农阶级","correct":false},{"text":"实现土地私有化","correct":false}],"answer":"B","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-31","number":31,"type":"single","typeLabel":"单选题","text":"1954年9月，第一届全国人民代表大会的召开和《中华人民共和国宪法》的制定及颁布施行，成为我国社 会主义民主政治建设的里程碑。这部宪法明确规定了我国的国体是（ ）。","options":[{"text":"人民代表大会制度","correct":false},{"text":"无产阶级专政","correct":false},{"text":"人民民主专政","correct":true},{"text":"工农民主专政","correct":false}],"answer":"C","explanation":"","source":"第3章章节专用题库","chapter":"3","section":"3.0","warning":false,"warningText":""},{"id":"chapter-3-single-32","number":32,"type":"single","typeLabel":"单选题","text":"邓小平结合中国的情况指出，我们也是反对“庸俗的生产力论”。以下属于中国能搞社会主义的条件的 是（ ）。","options":[{"text":"中国已经有了高度发达的资本主义经济","correct":false},{"text":"中国已经有了先进的无产阶
