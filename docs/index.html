:"1.2","warning":false,"warningText":""},{"id":"11","number":11,"type":"single","typeLabel":"单选题","text":"1941年，毛泽东明确界定\"实事求是\"的科学含义是在（ ）","options":[{"text":"《新民主主义论》","correct":false},{"text":"《在延安文艺座谈会上的讲话》","correct":false},{"text":"《整顿党的作风》","correct":false},{"text":"《改造我们的学习》","correct":true}],"answer":"D","explanation":"毛泽东在《改造我们的学习》中，对\"实事求是\"作了马克思主义的科学解释。","source":"第一章·第一节","chapter":"1","section":"1.1","warning":false,"warningText":""},{"id":"12","number":12,"type":"single","typeLabel":"单选题","text":"毛泽东思想紧紧围绕（ ）的主题，提出一系列相互关联的重要理论观点，构成完整的科学思想体系","options":[{"text":"实现什么样的发展、怎样发展","correct":false},{"text":"建设什么样的党、怎样建设党","correct":false},{"text":"什么是社会主义、怎样建设社会主义","correct":false},{"text":"中国革命和建设","correct":true}],"answer":"D","explanation":"毛泽东思想紧紧围绕中国革命和建设的主题展开，回答了中国革命和建设的一系列基本问题。","source":"第一章·第二节","chapter":"1","section":"1.2","warning":false,"warningText":""},{"id":"13","number":13,"type":"single","typeLabel":"单选题","text":"在中国共产党的历史上，第一次提出毛泽东思想这个概念的是（ ）","options":[{"text":"刘少奇","correct":false},{"text":"朱德","correct":false},{"text":"邓小平","correct":false},{"text":"王稼祥","correct":true}],"answer":"D","explanation":"1943年王稼祥在《解放日报》发表的《中国共产党与中国民族解放的道路》中，第一次提出\"毛泽东 思想\"这一概念。","source":"第一章·第一节","chapter":"1","section":"1.1","warning":false,"warningText":""},{"id":"14","number":14,"type":"single","typeLabel":"单选题","text":"中共七大上对\"马克思主义中国化\"从理论上作出进一步阐述的领导人是（ ）","options":[{"text":"毛泽东","correct":false},{"text":"刘少奇","correct":true},{"text":"周恩来","correct":false},{"text":"朱德","correct":false}],"answer":"B","explanation":"刘少奇在中共七大关于修改党章的报告中，从理论上对马克思主义中国化作了进一步阐述。","source":"第一章·第一节","chapter":"1","section":"1.1","warning":false,"warningText":""},{"id":"15","number":15,"type":"single","typeLabel":"单选题","text":"实事求是是毛泽东思想的（ ）","options":[{"text":"基本点","correct":false},{"text":"精髓","correct":true},{"text":"出发点","correct":false},{"text":"根本点","correct":false}],"answer":"B","explanation":"实事求是是毛泽东思想的精髓，是中国共产党人始终坚持的思想路线。","source":"第一章·第二节","chapter":"1","section":"1.2","warning":false,"warningText":""},{"id":"16","number":16,"type":"single","typeLabel":"单选题","text":"近代中国社会的性质是（ ）","options":[{"text":"封建主义社会","correct":false},{"text":"半殖民地半封建社会","correct":true},{"text":"资本主义社会","correct":false},{"text":"社会主义社会","correct":false}],"answer":"B","explanation":"1840年鸦片战争以后，中国逐步沦为半殖民地半封建社会，这是近代中国最基本的国情。","source":"第二章·第一节","chapter":"2","section":"2.1","warning":false,"warningText":""},{"id":"17","number":17,"type":"single","typeLabel":"单选题","text":"近代中国社会最主要的矛盾是（ ）","options":[{"text":"农民阶级和地主阶级的矛盾","correct":false},{"text":"帝国主义和中华民族的矛盾","correct":true},{"text":"封建主义和人民大众的矛盾","correct":false},{"text":"工人阶级和资产阶级的矛盾","correct":false}],"answer":"B","explanation":"帝国主义和中华民族的矛盾是各种矛盾中最主要的矛盾。","source":"第二章·第一节","chapter":"2","section":"2.1","warning":false,"warningText":""},{"id":"18","number":18,"type":"single","typeLabel":"单选题","text":"区别旧民主主义革命与新民主主义革命的根本标志是（ ）","options":[{"text":"革命的指导思想不同","correct":false},{"text":"革命的领导阶级不同","correct":true},{"text":"革命的前途不同","correct":false},{"text":"革命的阵线不同","correct":false}],"answer":"B","explanation":"领导权掌握在无产阶级手中还是资产阶级手中，是区分新旧民主主义革命的根本标志。","source":"第二章·第二节","chapter":"2","section":"2.2","warning":false,"warningText":""},{"id":"19","number":19,"type":"single","typeLabel":"单选题","text":"新民主主义革命的性质是（ ）","options":[{"text":"新式的特殊的资产阶级民主主义的革命","correct":true},{"text":"无产阶级革命","correct":false},{"text":"农民革命","correct":false},{"text":"社会主义革命","correct":false}],"answer":"A","explanation":"新民主主义革命是无产阶级领导的反帝反封建的资产阶级民主革命，是新式的特殊的资产阶级民主主 义革命。","source":"第二章·第二节","chapter":"2","section":"2.2","warning":false,"warningText":""},{"id":"20","number":20,"type":"single","typeLabel":"单选题","text":"毛泽东首次在下列哪部文献中提出了\"新民主主义革命\"科学概念（ ）","options":[{"text":"《中国革命和中国共产党》","correct":true},{"text":"《中国社会各阶级的分析》","correct":false},{"text":"《新民主主义论》","correct":false},{"text":"《中国的红色政权为什么能够存在》","correct":false}],"answer":"A","explanation":"1939年《中国革命和中国共产党》中首次提出\"新民主主义革命\"的科学概念。","source":"第二章·第二节","chapter":"2","section":"2. ion":"3.1","warning":false,"warningText":""},{"id":"26","number":26,"type":"single","typeLabel":"单选题","text":"建国初期，国营经济的主要来源是（ ）","options":[{"text":"没收封建地主阶级的土地","correct":false},{"text":"赎买民族资本主义工商业","correct":false},{"text":"管制帝国主义在华企业","correct":false},{"text":"没收官僚资本","correct":true}],"answer":"D","explanation":"新中国成立初期建立社会主义国营经济的主要途径是没收官僚资本。","source":"第三章·第一节","chapter":"3","section":"3.1","warning":false,"warningText":""},{"id":"27","number":27,"type":"single","typeLabel":"单选题","text":"在农业社会主义改造中建立的初级农业生产合作社属于（ ）","options":[{"text":"新民主主义性质","correct":false},{"text":"社会主义萌芽性质","correct":false},{"text":"半社会主义性质","correct":true},{"text":"社会主义性质","correct":false}],"answer":"C","explanation":"初级农业生产合作社实行土地入股、统一经营和集体劳动，具有半社会主义性质。","source":"第三章·第二节 · P76-78","chapter":"3","section":"3.2","warning":false,"warningText":""},{"id":"28","number":28,"type":"single","typeLabel":"单选题","text":"过渡时期总路线被比喻为鸟的主体和两翼，其中主体是（ ）","options":[{"text":"对资本主义工商业的改造","correct":false},{"text":"社会主义工业化","correct":true},{"text":"对农业的改造","correct":false},{"text":"对手工业的改造","correct":false}],"answer":"B","explanation":"\"一化三改\"中，社会主义工业化是\"主体\"，三大改造是\"两翼\"。","source":"第三章·第一节","chapter":"3","section":"3.1","warning":false,"warningText":""},{"id":"29","number":29,"type":"single","typeLabel":"单选题","text":"新中国对资本主义工商业实行社会主义改造采取的政策是（ ）","options":[{"text":"限制","correct":false},{"text":"征用","correct":false},{"text":"没收","correct":false},{"text":"赎买","correct":true}],"answer":"D","explanation":"对资本主义工商业采取和平赎买的办法，通过国家资本主义形式逐步过渡。","source":"第三章·第二节","chapter":"3","section":"3.2","warning":false,"warningText":""},{"id":"30","number":30,"type":"single","typeLabel":"单选题","text":"在对资本主义工商业社会主义改造的第一、第二阶段，采取的利润分配政策是（ ）","options":[{"text":"定息","correct":false},{"text":"劳资两利","correct":false},{"text":"公私兼顾","correct":false},{"text":"\"四马分肥\"","correct":true}],"answer":"D","explanation":"全行业公私合营前，企业利润按\"四马分肥\"分配；全行业公私合营后实行定息。","source":"第三章·第二节","chapter":"3","section":"3.2","warning":false,"warningText":""},{"id":"31","number":31,"type":"single","typeLabel":"单选题","text":"社会主义制度在中国确立的主要标志是（ ）","options":[{"text":"中华人民共和国的成立","correct":false},{"text":"国民经济的恢复与调整","correct":false},{"text":"《中华人民共和国宪法》的颁布","correct":false},{"text":"社会主义改造的胜利完成","correct":true}],"answer":"D","explanation":"1956年底三大改造基本完成，标志着社会主义基本制度在我国初步确立。","source":"第三章·第三节","chapter":"3","section":"3.3","warning":false,"warningText":""},{"id":"32","number":32,"type":"single","typeLabel":"单选题","text":"在我国，剥削阶级和剥削制度被消灭的标志是（ ）","options":[{"text":"中华人民共和国的建立","correct":false},{"text":"全国大陆的统一","correct":false},{"text":"社会主义改造的完成","correct":true},{"text":"土地改革的完成","correct":false}],"answer":"C","explanation":"社会主义改造基本完成，结束了中国历史上长达数千年的阶级剥削制度。","source":"第三章·第三节","chapter":"3","section":"3.3","warning":false,"warningText":""},{"id":"33","number":33,"type":"single","typeLabel":"单选题","text":"（ ）标志着党探索中国社会主义建设道路的良好开端","options":[{"text":"《论十大关系》","correct":true},{"text":"《关于正确处理人民内部矛盾的问题》","correct":false},{"text":"《论新阶段》","correct":false},{"text":"《改造我们的学习》","correct":false}],"answer":"A","explanation":"1956年《论十大关系》围绕调动一切积极因素的基本方针，标志党探索社会主义建设道路的良好开端。","source":"第四章·第一节 · P93","chapter":"4","section":"4.1","warning":false,"warningText":""},{"id":"34","number":34,"type":"single","typeLabel":"单选题","text":"1956年毛泽东作《论十大关系》报告，围绕的基本方针是（ ）","options":[{"text":"正确处理人民内部的矛盾","correct":false},{"text":"坚持百花齐放、百家争鸣","correct":false},{"text":"调动一切积极因素，为社会主义事业服务","correct":true},{"text":"调整、巩固、充实、提高","correct":false}],"answer":"C","explanation":"《论十大关系》围绕调动一切积极因素为社会主义事业服务的基本方针展开。","source":"第四章·第一节 · P93","chapter":"4","section":"4.1","warning":false,"warningText":""},{"id":"35","number":35,"type":"single","typeLabel":"单选题","text":"毛泽东提出社会主义社会基本矛盾和两类不同性质矛盾学说的著作是（ ）","options":[{"text":"《论十大关系》","correct":false},{"text":"《矛盾论》","correct":false},{"text":"《论人民民主专政》","correct":false},{"text":"《关于正确处理人民内部矛盾的问题》","correct":true}],"answer":"D","explanation":"1957年《关于正确处理人民内部矛盾的问题》系统提出两类矛盾学说。","source":"第四章·第一节 · P97","chapter":"4","section":"4.1","warning":false,"warningText":""},{"id":"36","number":36,"type":"single","typeLabel":"单选题","text":"1957年毛泽东提出，正确处理人民内部矛盾是国家政治生活的主题，解决人民内部矛盾的方法是（ ）","options":[{"text":"发展生产力","correct":false},{"text":"专政的方法","correct":false},{"text":"民主的方法，说服教育的方法","correct":true},{"text":"统筹兼顾，适当安排","correct":false}],"answer":"C","explanation":"人民内部矛盾是非对抗性矛盾，只能用民主的、说服教育的方法解决。","source":"第四章·第一节 · P97","chapter":"4","section":"4.1","warning":false,"warningText":""},{"id":"37","number":37,"type":"single","typeLabel":"单选题","text":"党的八大提出，我国社会的主要矛盾已经不再是工人阶级和资产阶级的矛盾，而是（ ）","options":[{"text":"人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾","correct":true},{"text":"人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾","correct":false},{"text":"生产力与生产关系之间的矛盾","correct":false},{"text":"经济基础与上层建筑之间的矛盾","correct":false}],"answer":"A","explanation":"党的八大对社会主义改造完成后我国社会主要矛盾作出正确判断。","source":"第四章·第一节","chapter":"4","section":"4.1","warning":false,"warningText":""},{"id":"38","number":38,"type":"single","typeLabel":"单选题","text":"1954年，（ ）在一届全国人大一次会议上代表党中央第一次提出关于\"四个现代化\"的构想","options":[{"text":"毛泽东","correct":false},{"text":"朱德","correct":false},{"text":"周恩来","correct":true},{"text":"邓小平","correct":false}],"answer":"C","explanation":"周恩来在一届全国人大一次会议上首次提出\"四个现代化\"构想。","source":"第四章·第一节 · P103","chapter":"4","section":"4.1","warning":false,"warningText":""},{"id":"39","number":39,"type":"single","typeLabel":"单选题","text":"中国特色社会主义理论体系形成发展的时代是（ ）","options":[{"text":"和平与发展","correct":true},{"text":"革命与战争","correct":false},{"text":"改革开放","correct":false},{"text":"世界多极化","correct":false}],"answer":"A","explanation":"和平与发展成为时代主题，是中国特色社会主义理论体系形成发展的国际背景。","source":"第五章·第一节","chapter":"5","section":"5.1","warning":false,"warningText":""},{"id":"40","number":40,"type":"single","typeLabel":"单选题","text":"科学发展观所要解决的基本问题是（ ）","options":[{"text":"什么是社会主义、怎样建设社会主义","correct":false},{"text":"建设什么样的党、怎样建设党","correct":false},{"text":"建设什么样的国家、怎样建设国家","correct":false},{"text":"实现什么样的发展、怎样发展","correct":true}],"answer":"D","explanation":"科学发展观深刻回答了新形势下实现什么样的发展、怎样发展等重大问题。","source":"第五章·第二节","chapter":"5","section":"5.2","warning":false,"warningText":""},{"id":"41","number":41,"type":"single","typeLabel":"单选题","text":"第一次明确提出\"中国特色社会主义理论体系\"这一科学概念是在（ ）","options":[{"text":"党的十五大","correct":false},{"text":"党的十六大","correct":false},{"text":"党的十七大","correct":true},{"text":"党的十八大","correct":false}],"answer":"C","explanation":"党的十七大报告第一次明确提出\"中国特色社会主义理论体系\"并作了系统阐述。","source":"第五章·第二节","chapter":"5","section":"5.2","warning":false,"warningText":""},{"id":"42","number":42,"type":"single","typeLabel":"单选题","text":"邓小平理论首要的基本理论问题是（ ）","options":[{"text":"什么是解放思想，怎样坚持解放思想","correct":false},{"text":"什么是实事求是，怎样坚持实事求是","correct":false},{"text":"什么是改革开放，怎样实施改革开放","correct":false},{"text":"什么是社会主义，怎样建设社会主义","correct":true}],"answer":"D","explanation":"\"什么是社会主义、怎样建设社会主义\"是邓小平理论首要的基本理论问题。","source":"第六章·第二节","chapter":"6","section":"6.2","warning":false,"warningText":""},{"id":"43","number":43,"type":"single","typeLabel":"单选题","text":"我国现阶段最大的实际是（ ）","options":[{"text":"市场经济发展还很不充分","correct":false},{"text":"我国已经进入社会主义社会","correct":false},{"text":"生产力落后并且发展不平衡","correct":false},{"text":"我国正处于并将长期处于社会主义初级阶段","correct":true}],"answer":"D","explanation":"社会主义初级阶段是当代中国最大的实际，是建设中国特色社会主义的总依据。","source":"第六章·第二节","chapter":"6","section":"6.2","warning":false,"warningText":""},{"id":"44","number":44,"type":"single","typeLabel":"单选题","text":"社会主义社会的根本任务是（ ）","options":[{"text":"发展生产力","correct":true},{"text":"改革开放","correct":false},{"text":"发扬民主","correct":false},{"text":"共同富裕","correct":false}],"answer":"A","explanation":"生产力是社会发展的最根本决定性因素，社会主义的根本任务是发展生产力。","source":"第六章·第二节","chapter":"6","section":"6.2","warning":false,"warningText":""},{"id":"45","number":45,"type":"single","typeLabel":"单选题","text":"社会主义社会发展的直接动力是（ ）","options":[{"text":"发展","correct":false},{"text":"稳定","correct":false},{"text":"改革","correct":true},{"text":"科学技术","correct":false}],"answer":"C","explanation":"改革是社会主义制度的自我完善和发展，是社会主义社会发展的直接动力。","source":"第六章·第二节","chapter":"6","section":"6.2","warning":false,"warningText":""},{"id":"46","number":46,"type":"single","typeLabel":"单选题","text":"邓小平理论的精髓是（ ）","options":[{"text":"相信群众，依靠群众","correct":false},{"text":"发展和解放生产力","correct":false},{"text":"解放思想，实事求是","correct":true},{"text":"以经济建设为中心","correct":false}],"answer":"C","explanation":"解放思想、实事求是是邓小平理论的精髓，也是党的思想路线。","source":"第六章·第二节","chapter":"6","section":"6.2","warning":false,"warningText":""},{"id":"47","number":47,"type":"single","typeLabel":"单选题","text":"明确提出我国经济体制改革目标是建立社会主义市场经济体制的是在（ ）","options":[{"text":"党的十二大","correct":false},{"text":"党的十三大","correct":false},{"text":"党的十四大","correct":true},{"text":"党的十五大","correct":false}],"answer":"C","explanation":"1992年党的十四大明确提出建立社会主义市场经济体制的改革目标。","source":"第六章·第二节","chapter":"6","section":"6.2","warning":false,"warningText":""},{"id":"48","number":48,"type":"single","typeLabel":"单选题","text":"\"三个代表\"重要思想创造性地回答了（ ）","options":[{"text":"建设一个什么样的党、怎样建设党","correct":true},{"text":"什么是社会主义、怎样建设社会主义","correct":false},{"text":"什么是改革、怎样进行改革","correct":false},{"text":"什么是共产主义、怎样建设共产主义","correct":false}],"answer":"A","explanation":"\"三个代表\"重要思想围绕建设什么样的党、怎样建设党的问题形成。","source":"第七章·第二节","chapter":"7","section":"7.2","warning":false,"warningText":""},{"id":"49","number":49,"type":"single","typeLabel":"单选题","text":"（ ）是党执政兴国的第一要务","options":[{"text":"经济","correct":false},{"text":"文化","correct":false},{"text":"发展","correct":true},{"text":"政治","correct":false}],"answer":"C","explanation":"发展是党执政兴国的第一要务，中国解决所有问题的关键要靠自己的发展。","source":"第七章·第二节","chapter":"7","section":"7.2","warning":false,"warningText":""},{"id":"50","number":50,"type":"single","typeLabel":"单选题","text":"科学发展观的核心立场是（ ）","options":[{"text":"发展","correct":false},{"text":"以人为本","correct":true},{"text":"全面协调可持续","correct":false},{"text":"统筹兼顾","correct":false}],"answer":"B","explanation":"以人为本是科学发展观的核心立场，集中体现了我们党全心全意为人民服务的根本宗旨。","source":"第八章·第二节","chapter":"8","section":"8.2","warning":false,"warningText":""},{"id":"51","number":51,"type":"single","typeLabel":"单选题","text":"科学发展观的第一要义是（ ）","options":[{"text":"统筹兼顾","correct":false},{"text":"推动经济社会发展","correct":true},{"text":"以人为本","correct":false},{"text":"全面协调可持续","correct":false}],"answer":"B","explanation":"推动经济社会发展是科学发展观的第一要义，在当代中国坚持发展是硬道理的本质要求就是坚持科学 发展。","source":"第八章·第二节","chapter":"8","section":"8.2","warning":false,"warningText":""},{"id":"52","number":52,"type":"multiple","typeLabel":"多选题","text":"马克思主义中国化时代化，就是要（ ），坚持运用辩证唯物主义和历史唯物主义，从理论和实践的结 合上深入回答重大时代课题","options":[{"text":"增强问题意识","correct":true},{"text":"站稳人民立场","correct":true},{"text":"洞察时代风云","correct":true},{"text":"把握时代大势","correct":true}],"answer":"ABCD","explanation":"马克思主义中国化时代化要增强问题意识、站稳人民立场、洞察时代风云、把握时代大势。","source":"导论·第一节 · P4-5","chapter":"导论","section":"导论.1","warning":false,"warningText":""},{"id":"53","number":53,"type":"multiple","typeLabel":"多选题","text":"坚持和发展马克思主义，必须同（ ）相结合","options":[{"text":"中国具体实际","correct":true},{"text":"人民群众","correct":false},{"text":"中华优秀传统文化","correct":true},{"text":"党的领导","correct":false}],"answer":"AC","explanation":"坚持和发展马克思主义必须同中国具体实际相结合、同中华优秀传统文化相结合，即\"两个结合\"。","source":"导论·第一节","chapter":"导论","section":"导论.1","warning":false,"warningText":""},{"id":"54","number":54,"type":"multiple","typeLabel":"多选题","text":"毛泽东思想的主要内容包括（ ）","options":[{"text":"新民主主义革命理论","correct":true},{"text":"社会主义革命和社会主义建设理论","correct":true},{"text":"革命军队建设和军事战略的理论","correct":true},{"text":"政策和策略的理论","correct":true}],"answer":"ABCD","explanation":"毛泽东思想有多方面内容，除新民主主义革命理论外，还包括社会主义革命和建设、军事战略、政策 和策略等理论。","source":"第一章·第二节 · P20-25","chapter":"1","section":"1.2","warning":false,"warningText":""},{"id":"55","number":55,"type":"multiple","typeLabel":"多选题","text":"毛泽东思想的科学含义是（ ）","options":[{"text":"马克思列宁主义在中国的运用和发展","correct":true},{"text":"毛泽东个人的思想","correct":false},{"text":"被实践证明了的关于中国革命和建设的正确的理论原则和经验总结","correct":true},{"text":"中国共产党集体智慧的结晶","correct":true}],"answer":"ACD","explanation":"毛泽东思想是马克思列宁主义在中国的运用和发展，是被实践证明了的正确的理论原则和经验总结， 是中国共产党集体智慧的结晶。","source":"第一章·第二节","chapter":"1","section":"1.2","warning":false,"warningText":""},{"id":"56","number":56,"type":"multiple","typeLabel":"多选题","text":"毛泽东指出，（ ）是中国共产党在中国革命中战胜敌人的三大法宝","options":[{"text":"群众路线","correct":false},{"text":"统一战线","correct":true},{"text":"武装斗争","correct":true},{"text":"党的建设","correct":true}],"answer":"BCD","explanation":"统一战线、武装斗争、党的建设是三大法宝。","source":"第二章·第三节 · P59、64","chapter":"2","section":"2.3","warning":false,"warningText":""},{"id":"57","number":57,"type":"multiple","typeLabel":"多选题","text":"实事求是思想路线的极端重要性主要表现在（ ）","options":[{"text":"它是辩证唯物主义和历史唯物主义的思想路线","correct":true},{"text":"它是毛泽东思想的根本出发点","correct":true},{"text":"它是毛泽东思想的精髓","correct":true},{"text":"它是中国革命和建设事业不断取得胜利的根本思想保证","correct":true}],"answer":"ABCD","explanation":"实事求是是党的思想路线，是毛泽东思想的精髓和根本出发点。","source":"第一章·第二节","chapter":"1","section":"1.2","warning":false,"warningText":""},{"id":"58","number":58,"type":"multiple","typeLabel":"多选题","text":"新民主主义革命的对象包括（ ）","options":[{"text":"民族资产阶级","correct":false},{"text":"帝国主义","correct":true},{"text":"官僚资本主义","correct":true},{"text":"封建主义","correct":true}],"answer":"BCD","explanation":"新民主主义革命的对象是帝国主义、封建主义和官僚资本主义，即\"三座大山\"。","source":"第二章·第二节","chapter":"2","section":"2.2","warning":false,"warningText":""},{"id":"59","number":59,"type":"multiple","typeLabel":"多选题","text":"新民主主义革命的动力包括（ ）","options":[{"text":"农民阶级","correct":true},{"text":"无产阶级","correct":true},{"text":"城市小资产阶级","correct":true},{"text":"民族资产阶级","correct":true}],"answer":"ABCD","explanation":"无产阶级是革命最基本的动力，农民是主力军，城市小资产阶级是可靠同盟者，民族资产阶级具有两 面性也是动力之一。","source":"第二章·第二节","chapter":"2","section":"2.2","warning":false,"warningText":""},{"id":"60","number":60,"type":"multiple","typeLabel":"多选题","text":"新民主主义的基本纲领包括（ ）","options":[{"text":"经济纲领","correct":true},{"text":"政治纲领","correct":true},{"text":"文化纲领","correct":true},{"text":"共同纲领","correct":false}],"answer":"ABC","explanation":"新民主主义革命的基本纲领包括政治纲领、经济纲领和文化纲领。","source":"第二章·第二节 · P52-54","chapter":"2","section":"2.2","warning":false,"warningText":""},{"id":"61","number":61,"type":"multiple","typeLabel":"多选题","text":"\"工农武装割据\"思想的主要内容包括（ ）","options":[{"text":"土地革命是民主革命的基本内容","correct":true},{"text":"武装斗争是农村革命根据地建设和土地革命的强有力的保证","correct":true},{"text":"先占城市，后取乡村","correct":false},{"text":"农村革命根据地是中国革命的战略阵地","correct":true}],"answer":"ABD","explanation":"\"工农武装割据\"即土地革命、武装斗争、农村革命根据地建设三者的有机结合。","source":"第二章·第三节","chapter":"2","section":"2.3","warning":false,"warningText":""},{"id":"62","number":62,"type":"multiple","typeLabel":"多选题","text":"新民主主义革命时期，党领导的统一战线先后经历了（ ）","options":[{"text":"第一次国共合作统一战线","correct":true},{"text":"工农民主统一战线","correct":true},{"text":"抗日民主统一战线","correct":true},{"text":"人民民主统一战线","correct":true}],"answer":"ABCD","explanation":"新民主主义革命时期的统一战线经历了第一次国共合作、工农民主、抗日民主、人民民主四个阶段。","source":"第二章·第三节","chapter":"2","section":"2.3","warning":false,"warningText":""},{"id":"63","number":63,"type":"multiple","typeLabel":"多选题","text":"新中国成立初期，新民主主义社会的经济成分有（ ）","options":[{"text":"社会主义性质的国营经济","correct":true},{"text":"个体经济","correct":true},{"text":"私人资本主义经济","correct":true},{"text":"国家资本主义经济及半社会主义性质的合作社经济","correct":true}],"answer":"ABCD","explanation":"新民主主义社会存在五种经济成分：国营经济、合作社经济、个体经济、私人资本主义经济和国家资 本主义经济。","source":"第三章·第一节","chapter":"3","section":"3.1","warning":false,"warningText":""},{"id":"64","number":64,"type":"multiple","typeLabel":"多选题","text":"我国对个体农业实行社会主义改造必须遵循的原则有（ ）","options":[{"text":"自愿互利","correct":true},{"text":"典型示范","correct":true},{"text":"国家帮助","correct":true},{"text":"公私合营","correct":false}],"answer":"ABC","explanation":"农业社会主义改造遵循自愿互利、典型示范、国家帮助的原则。","source":"第三章·第二节 · P76-78","chapter":"3","section":"3.2","warning":false,"warningText":""},{"id":"65","number":65,"type":"multiple","typeLabel":"多选题","text":"党和政府领导农业社会主义改造的主要形式有（ ）","options":[{"text":"临时农业生产互助组","correct":false},{"text":"农业生产互助组","correct":true},{"text":"初级农业生产合作社","correct":true},{"text":"高级农业生产合作社","correct":true}],"answer":"BCD","explanation":"农业改造经历互助组、初级社、高级社三个步骤（初级形式即农业生产互助组）。","source":"第三章·第二节 · P76-78","chapter":"3","section":"3.2","warning":false,"warningText":""},{"id":"66","number":66,"type":"multiple","typeLabel":"多选题","text":"我国对资本主义工商业进行社会主义改造的经验主要有（ ）","options":[{"text":"用和平赎买的方法改造资本主义工商业","correct":true},{"text":"采取从低级到高级的国家资本主义过渡形式","correct":true},{"text":"把对企业的改造和对资本家的改造结合起来","correct":true},{"text":"对私人资本主义始终坚持\"四马分肥\"","correct":false}],"answer":"ABC","explanation":"改造经验包括和平赎买、国家资本主义过渡形式、企业改造与资本家改造相结合。","source":"第三章·第二节 · P83-85","chapter":"3","section":"3.2","warning":false,"warningText":""},{"id":"67","number":67,"type":"multiple","typeLabel":"多选题","text":"以毛泽东同志为核心的党的第一代中央领导集体确立社会主义基本制度，这一基本制度的确立（ ）","options":[{"text":"是中国历史上最深刻最伟大的社会变革","correct":true},{"text":"为当代中国一切发展进步奠定了根本政治前提和制度基础","correct":true},{"text":"标志着马克思主义同中国实际\"第二次结合\"的完成","correct":false},{"text":"使广大劳动人民真正成为国家的主人","correct":true}],"answer":"ABD","explanation":"社会主义基本制度的确立是中国历史上最深刻最伟大的社会变革，奠定根本政治前提和制度基础，使 劳动人民成为国家主人。","source":"第三章·第三节 · P89-91","chapter":"3","section":"3.3","warning":false,"warningText":""},{"id":"68","number":68,"type":"multiple","typeLabel":"多选题","text":"社会主义建设道路初步探索的重要理论成果包括（ ）","options":[{"text":"调动一切积极因素为社会主义事业服务","correct":true},{"text":"正确认识和处理社会主义社会矛盾的思想","correct":true},{"text":"走中国工业化道路的思想","correct":true},{"text":"以重轻农为序发展国民经济的总方针","correct":false}],"answer":"ABC","explanation":"初步探索的理论成果：调动一切积极因素方针、正确处理社会主义社会矛盾思想、走中国工业化道路 思想及其他思想。","source":"第四章·第一节 · P93、97、101、103","chapter":"4","section":"4.1","warning":false,"warningText":""},{"id":"69","number":69,"type":"multiple","typeLabel":"多选题","text":"1956年毛泽东《论十大关系》报告系统论述的重大关系包括（ ）","options":[{"text":"经济建设和国防建设的关系","correct":true},{"text":"国家、生产单位和生产者个人的关系","correct":true},{"text":"汉族和少数民族的关系","correct":true},{"text":"中国和外国的关系","correct":true}],"answer":"ABCD","explanation":"《论十大关系》系统论述了我国社会主义建设需要重点把握的十个方面重大关系。","source":"第四章·第一节 · P93","chapter":"4","section":"4.1","warning":false,"warningText":""},{"id":"70","number":70,"type":"multiple","typeLabel":"多选题","text":"社会主义建设道路初步探索的积极意义有（ ）","options":[{"text":"巩固和发展了我国的社会主义制度","correct":true},{"text":"为开创中国特色社会主义提供了宝贵经验、理论准备和物质基础","correct":true},{"text":"丰富了科学社会主义的理论和实践","correct":true},{"text":"否定了社会主义社会存在矛盾","correct":false}],"answer":"ABC","explanation":"初步探索巩固发展了社会主义制度，为开创中国特色社会主义提供宝贵经验、理论准备和物质基础， 丰富了科学社会主义。","source":"第四章·第二节 · P110-111","chapter":"4","section":"4.2","warning":false,"warningText":""},{"id":"71","number":71,"type":"multiple","typeLabel":"多选题","text":"中国特色社会主义理论体系形成发展的国际背景包括（ ）","options":[{"text":"和平与发展是时代主题","correct":true},{"text":"科学技术成为先进生产力的主要标志","correct":true},{"text":"国际关系和地区冲突深刻变化","correct":true},{"text":"世界多极化、经济全球化不可逆转","correct":true}],"answer":"ABCD","explanation":"和平与发展的时代主题、科技成为先进生产力主要标志、多极化全球化等是形成发展的国际背景。","source":"第五章·第一节","chapter":"5","section":"5.1","warning":false,"warningText":""},{"id":"72","number":72,"type":"multiple","typeLabel":"多选题","text":"邓小平关于社会主义本质的概括包括（ ）","options":[{"text":"坚持按劳分配的标准","correct":false},{"text":"解放生产力，发展生产力","correct":true},{"text":"消灭剥削，消除两极分化","correct":true},{"text":"最终达到共同富裕","correct":true}],"answer":"BCD","explanation":"社会主义本质：解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕。","source":"第六章·第二节 · P152","chapter":"6","section":"6.2","warning":false,"warningText":""},{"id":"73","number":73,"type":"multiple","typeLabel":"多选题","text":"邓小平指出判断改革和各方面是非得失的\"三个有利于\"标准是（ ）","options":[{"text":"是否有利于发展社会主义社会的生产力","correct":true},{"text":"是否有利于增强社会主义国家的综合国力","correct":true},{"text":"是否有利于改革开放发展","correct":false},{"text":"是否有利于提高人民的生活水平","correct":true}],"answer":"ABD","explanation":"\"三个有利于\"：是否有利于发展生产力、增强综合国力、提高人民生活水平。","source":"第六章·第二节","chapter":"6","section":"6.2","warning":false,"warningText":""},{"id":"74","number":74,"type":"multiple","typeLabel":"多选题","text":"社会主义市场经济理论的要点有（ ）","options":[{"text":"计划经济和市场经济不是划分社会制度的标志","correct":true},{"text":"计划经济不等于社会主义，市场经济也不等于资本主义","correct":true},{"text":"计划和市场都是经济手段，要把两者结合起来","correct":true},{"text":"市场经济作为资源配置方式本身不具有制度属性，可以和不同的社会制度结合","correct":true}],"answer":"ABCD","explanation":"社会主义市场经济理论的核心在于：计划与市场都是手段，市场经济可以与社会主义制度结合。","source":"第六章·第二节","chapter":"6","section":"6.2","warning":false,"warningText":""},{"id":"75","number":75,"type":"multiple","typeLabel":"多选题","text":"九十年代初，江泽民提出我党需要解决的两大历史性课题是（ ）","options":[{"text":"提高党的领导水平和执政水平","correct":true},{"text":"提高维护党内团结的水平","correct":false},{"text":"提高拒腐防变和抵御风险的能力","correct":true},{"text":"提高维护党的纪律自觉性","correct":false}],"answer":"AC","explanation":"党的建设新的伟大工程要解决提高党的领导水平和执政水平、提高拒腐防变和抵御风险能力两大历史 性课题。","source":"第七章·第二节","chapter":"7","section":"7.2","warning":false,"warningText":""},{"id":"76","number":76,"type":"multiple","typeLabel":"多选题","text":"科学发展观的科学内涵包括（ ）","options":[{"text":"第一要义是推动经济社会发展","correct":true},{"text":"核心立场是以人为本","correct":true},{"text":"基本要求是全面协调可持续","correct":true},{"text":"根本方法是统筹兼顾","correct":true}],"answer":"ABCD","explanation":"科学发展观，第一要义是发展，核心立场是以人为本，基本要求是全面协调可持续，根本方法是统筹 兼顾。","source":"第八章·第二节","chapter":"8","section":"8.2","warning":false,"warningText":""},{"id":"77","number":77,"type":"judge","typeLabel":"判断题","text":"马克思主义中国化的第一个重大理论成果是毛泽东思想。","options":[{"text":"正确","correct":true},{"text":"错误","correct":false}],"answer":"A","explanation":"毛泽东思想实现了马克思主义中国化的第一次历史性飞跃，是第一个重大理论成果。","source":"导论·第二节","chapter":"导论","section":"导论.2","warning":false,"warningText":""},{"id":"78","number":78,"type":"judge","typeLabel":"判断题","text":"毛泽东思想是毛泽东个人的全部思想的总和。","options":[{"text":"正确","correct":false},{"text":"错误","correct":true}],"answer":"B","explanation":"毛泽东思想是中国共产党集体智慧的结晶，是经过长期历史考验形成的科学理论，不能等同于毛泽东 个人的全部思想。","source":"第一章·第二节","chapter":"1","section":"1.2","warning":false,"warningText":""},{"id":"79","number":79,"type":"judge","typeLabel":"判断题","text":"实事求是是毛泽东思想的精髓，是中国共产党人始终坚持的思想路线。","options":[{"text":"正确","correct":true},{"text":"错误","correct":false}],"answer":"A","explanation":"实事求是是毛泽东思想的精髓，是党的思想路线的核心。","source":"第一章·第二节","chapter":"1","section":"1.2","warning":false,"warningText":""},{"id":"80","number":80,"type":"judge","typeLabel":"判断题","text":"群众路线是我们党的生命线和根本工作路线。","options":[{"text":"正确","correct":true},{"text":"错误","correct":false}],"answer":"A","explanation":"一切为了群众、一切依靠群众、从群众中来到群众中去，群众路线是党的生命线和根本工作路线。","source":"第一章·第二节","chapter":"1","section":"1.2","warning":false,"warningText":""},{"id":"81","number":81,"type":"judge","typeLabel":"判断题","text":"对毛泽东的一生来看，他的错误是第一位的，功绩是第二位的。","options":[{"text":"正确","correct":false},{"text":"错误","correct":true}],"answer":"B","explanation":"1981年《关于建国以来党的若干历史问题的决议》指出，毛泽东的功绩是第一位的，错误是第二位的。","source":"第一章·第三节","chapter":"1","section":"1.3","warning":false,"warningText":""},{"id":"82","number":82,"type":"judge","typeLabel":"判断题","text":"新民主主义革命的对象包括民族资本主义。","options":[{"text":"正确","correct":false},{"text":"错误","correct":true}],"answer":"B","explanation":"新民主主义革命的对象是帝国主义、封建主义和官僚资本主义，并不一般地反对资本主义。","source":"第二章·第二节","chapter":"2","section":"2.2","warning":false,"warningText":""},{"id":"83","number":83,"type":"judge","typeLabel":"判断题","text":"新民主主义革命的动力包括无产阶级、农民阶级、城市小资产阶级和民族资产阶级。","options":[{"text":"正确","correct":true},{"text":"错误","correct":false}],"answer":"A","explanation":"这四个阶级构成新民主主义革命的动力。","source":"第二章·第二节","chapter":"2","section":"2.2","warning":false,"warningText":""},{"id":"84","number":84,"type":"judge","typeLabel":"判断题","text":"毛泽东指出，人民军队建设的最根本原则是党指挥枪。","options":[{"text":"正确","correct":true},{"text":"错误","correct":false}],"answer":"A","explanation":"党指挥枪是人民军队建设的根本原则。","source":"第二章·第三节","chapter":"2","section":"2.3","warning":false,"warningText":""},{"id":"85","number":85,"type":"judge","typeLabel":"判断题","text":"新民主主义革命的三大法宝包括土地革命、统一战线、武装斗争。","options":[{"text":"正确","correct":false},{"text":"错误","correct":true}],"answer":"B","explanation":"三大法宝是统一战线、武装斗争、党的建设，土地革命属于\"工农武装割据\"的内容。","source":"第二章·第三节 · P59、64","chapter":"2","section":"2.3","warning":false,"warningText":""},{"id":"86","number":86,"type":"judge","typeLabel":"判断题","text":"\"没收封建地主阶级的土地归农民所有\"，是新民主主义革命的主要内容。","options":[{"text":"正确","correct":true},{"text":"错误","correct":false}],"answer":"A","explanation":"这是新民主主义经济纲领的首要内容，也是革命的主要内容。","source":"第二章·第二节 · P52-54","chapter":"2","section":"2.2","warning":false,"warningText":""},{"id":"87","number":87,"type":"judge","typeLabel":"判断题","text":"从中华人民共和国成立到社会主义改造基本完成，是我国从新民主主义到社会主义的过渡时期。","options":[{"text":"正确","correct":true},{"text":"错误","correct":false}],"answer":"A","explanation":"这一时期我国社会的性质是新民主主义社会，是过渡性质的社会。","source":"第三章·第一节","chapter":"3","section":"3.1","warning":false,"warningText":""},{"id":"88","number":88,"type":"judge","typeLabel":"判断题","text":"手工业生产合作社是社会主义性质的集体经济组织。","options":[{"text":"正确","correct":true},{"text":"错误","correct":false}],"answer":"A","explanation":"手工业改造的第三阶段建立的生产合作社具有社会主义性质。","source":"第三章·第二节","chapter":"3","section":"3.2","warning":false,"warningText":""},{"id":"89","number":89,"type":"judge","typeLabel":"判断题","text":"三大改造的完成标志着社会主义制度在中国的确立。","options":[{"text":"正确","correct":true},{"text":"错误","correct":false}],"answer":"A","explanation":"1956年底三大改造基本完成，社会主义基本制度在我国初步确立。","source":"第三章·第三节","chapter":"3","section":"3.3","warning":false,"warningText":""},{"id":"90","number":90,"type":"judge","typeLabel":"判断题","text":"新中国成立之后，我国对资本主义工商业的社会主义改造实行的是没收政策。","options":[{"text":"正确","correct":false},{"text":"错误","correct":true}],"answer":"B","explanation":"对资本主义工商业实行的是和平赎买政策，而非没收。","source":"第三章·第二节","chapter":"3","section":"3.2","warning":false,"warningText":""},{"id":"91","number":91,"type":"judge","typeLabel":"判断题","text":"所谓赎买，就是国家有偿地将私营企业改变为国营企业，由国家支付一笔巨额补偿资金。","options":[{"text":"正确","correct":false},{"text":"错误","correct":true}],"answer":"B","explanation":"赎买不是国家出钱购买企业，而是通过\"四马分肥\"、定息等形式，在一定时期内对资本家进行利润分 配，最终实现生产资料公有化。","source":"第三章·第二节","chapter":"3","section":"3.2","warning":false,"warningText":""},{"id":"92","number":92,"type":"judge","typeLabel":"判断题","text":"社会主义改造基本完成后，我国进入社会主义建设时期。","options":[{"text":"正确","correct":true},{"text":"错误","correct":false}],"answer":"A","explanation":"三大改造完成后我国进入社会主义社会，开始全面社会主义建设。","source":"第四章·第一节","chapter":"4","section":"4.1","warning":false,"warningText":""},{"id":"93","number":93,"type":"judge","typeLabel":"判断题","text":"敌我矛盾和人民内部矛盾是社会主义社会两类不同性质的矛盾。","options":[{"text":"正确","correct":true},{"text":"错误","correct":false}],"answer":"A","explanation":"敌我矛盾是对抗性矛盾，人民内部矛盾是非对抗性矛盾，两者在一定条件下可以相互转化。","source":"第四章·第一节 · P97","chapter":"4","section":"4.1","warning":false,"warningText":""},{"id":"94","number":94,"type":"judge","typeLabel":"判断题","text":"社会主义社会的基本矛盾仍是对抗性的矛盾。","options":[{"text":"正确","correct":false},{"text":"错误","correct":true}],"answer":"B","explanation":"社会主义社会的基本矛盾是在人民根本利益一致基础上的矛盾，不具有对抗性，可以经过社会主义制 度本身不断得到解决。","source":"第四章·第一节","chapter":"4","section":"4.1","warning":false,"warningText":""},{"id":"95","number":95,"type":"judge","typeLabel":"判断题","text":"第一次明确提出\"中国特色社会主义理论体系\"这一概念是在党的十七大报告。","options":[{"text":"正确","correct":true},{"text":"错误","correct":false}],"answer":"A","explanation":"党的十七大第一次明确提出并系统阐述了中国特色社会主义理论体系。","source":"第五章·第二节","chapter":"5","section":"5.2","warning":false,"warningText":""},{"id":"96","number":96,"type":"judge","typeLabel":"判断题","text":"社会主义初级阶段是指任何国家进入社会主义都要经历的起始阶段。","options":[{"text":"正确","correct":false},{"text":"错误","correct":true}],"answer":"B","explanation":"社会主义初级阶段特指我国在生产力落后、商品经济不发达条件下建设社会主义必然要经历的特定阶 段，不是泛指任何国家进入社会主义都要经历的阶段。","source":"第六章·第二节","chapter":"6","section":"6.2","warning":false,"warningText":""},{"id":"97","number":97,"type":"judge","typeLabel":"判断题","text":"邓小平理论是中国特色社会主义理论体系的开篇之作。","options":[{"text":"正确","correct":true},{"text":"错误","correct":false}],"answer":"A","explanation":"邓小平理论第一次比较系统地初步回答了建设中国特色社会主义的一系列基本问题，是开篇之作。","source":"第六章·第三节 · P187-188","chapter":"6","section":"6.3","warning":false,"warningText":""},{"id":"98","number":98,"type":"judge","typeLabel":"判断题","text":"党的十三大提出我国经济体制改革的目标是建立社会主义市场经济体制。","options":[{"text":"正确","correct":false},{"text":"错误","correct":true}],"answer":"B","explanation":"明确提出建立社会主义市场经济体制目标的是党的十四大。","source":"第六章·第二节","chapter":"6","section":"6.2","warning":false,"warningText":""},{"id":"99","number":99,"type":"judge","typeLabel":"判断题","text":"邓小平理论的精髓是解放思想、实事求是。","options":[{"text":"正确","correct":true},{"text":"错误","correct":false}],"answer":"A","explanation":"解放思想、实事求是是邓小平理论的精髓，也是党的思想路线。","source":"第六章·第二节","chapter":"6","section":"6.2","warning":false,"warningText":""},{"id":"100","number":100,"type":"judge","typeLabel":"判断题","text":"\"三个代表\"重要思想创造性地回答了建设什么样的党、怎样建设党的问题。","options":[{"text":"正确","correct":true},{"text":"错误","correct":false}],"answer":"A","explanation":"这是\"三个代表\"重要思想回答的基本问题，推进了党的建设新的伟大工程。","source":"第七章·第二节","chapter":"7","section":"7.2","warning":false,"warningText":""},{"id":"101","number":101,"type":"judge","typeLabel":"判断题","text":"以人为本是科学发展观的核心立场。","options":[{"text":"正确","correct":true},{"text":"错误","correct":false}],"answer":"A","explanation":"科学发展观，核心立场是以人为本，基本要求是全面协调可持续。","source":"第八章·第二节","chapter":"8","section":"8.2","warning":false,"warningText":""},{"id":"102","number":102,"type":"fill","typeLabel":"填空题","text":"马克思主义中国化的第一个重大理论成果是＿＿。","options":[],"answer":"毛泽东思想","explanation":"","source":"导论·第二节","chapter":"导论","section":"导论.2","warning":false,"warningText":""},{"id":"103","number":103,"type":"fill","typeLabel":"填空题","text":"毛泽东思想的活的灵魂的三个基本方面是＿＿、群众路线、独立自主。","options":[],"answer":"实事求是","explanation":"","source":"第一章·第二节","chapter":"1","section":"1.2","warning":false,"warningText":""},{"id":"104","number":104,"type":"fill","typeLabel":"填空题","text":"中国近代压在中国人民头上的\"三座大山\"指的是＿＿、封建主义、官僚资本主义。","options":[],"answer":"帝国主义","explanation":"","source":"第二章·第二节","chapter":"2","section":"2.2","warning":false,"warningText":""},{"id":"105","number":105,"type":"fill","typeLabel":"填空题","text":"毛泽东在《〈共产党人〉发刊词》中，把＿＿、武装斗争、党的建设比作党在中国革命中战胜敌人的三 个主要的法宝。","options":[],"answer":"统一战线","explanation":"","source":"第二章·第三节","chapter":"2","section":"2.3","warning":false,"warningText":""},{"id":"106","number":106,"type":"fill","typeLabel":"填空题","text":"近代中国社会的性质，即最基本的国情是＿＿社会。","options":[],"answer":"半殖民地半封建社会","explanation":"","source":"第二章·第一节","chapter":"2","section":"2.1","warning":false,"warningText":""},{"id":"107","number":107,"type":"fill","typeLabel":"填空题","text":"新民主主义革命的前途是＿＿。","options":[],"answer":"社会主义","explanation":"","source":"第二章·第二节","chapter":"2","section":"2.2","warning":false,"warningText":""},{"id":"108","number":108,"type":"fill","typeLabel":"填空题","text":"新民主主义文化，就是无产阶级领导的人民大众的反帝反封建的文化，即民族的、科学的、＿＿的文化。","options":[],"answer":"大众的","explanation":"","source":"第二章·第二节","chapter":"2","section":"2.2","warning":false,"warningText":""},{"id":"109","number":109,"type":"fill","typeLabel":"填空题","text":"中国共产党立足中国国情，走出了一条不同于俄国十月革命的道路，即＿＿、武装夺取政权的革命道路。","options":[],"answer":"农村包围城市","explanation":"","source":"第二章·第三节","chapter":"2","section":"2.3","warning":false,"warningText":""},{"id":"110","number":110,"type":"fill","typeLabel":"填空题","text":"党在过渡时期总路线的主要内容被概括为＿＿。","options":[],"answer":"一化三改","explanation":"","source":"第三章·第一节","chapter":"3","section":"3.1","warning":false,"warningText":""},{"id":"111","number":111,"type":"fill","typeLabel":"填空题","text":"三大改造指的是对农业、手工业、＿＿的改造。","options":[],"answer":"资本主义工商业","explanation":"","source":"第三章·第一节","chapter":"3","section":"3.1","warning":false,"warningText":""},{"id":"112","number":112,"type":"fill","typeLabel":"填空题","text":"改造资本主义工商业采用＿＿的办法。","options":[],"answer":"和平赎买","explanation":"","source":"第三章·第二节","chapter":"3","section":"3.2","warning":false,"warningText":""},{"id":"113","number":113,"type":"fill","typeLabel":"填空题","text":"1956年底三大改造基本完成，标志着中国历史上长达数千年的阶级剥削制度的结束和＿＿基本制度的确 立。","options":[],"answer":"社会主义","explanation":"","source":"第三章·第三节","chapter":"3","section":"3.3","warning":false,"warningText":""},{"id":"114","number":114,"type":"fill","typeLabel":"填空题","text":"（ ）标志着党探索中国社会主义建设道路的良好开端，这部著作是《＿＿》。","options":[],"answer":"论十大关系","explanation":"","source":"第四章·第一节","chapter":"4","section":"4.1","warning":false,"warningText":""},{"id":"115","number":115,"type":"fill","typeLabel":"填空题","text":"解决人民内部矛盾要用民主的方法，即＿＿的方法、说服教育的方法。","options":[],"answer":"民主的","explanation":"","source":"第四章·第一节","chapter":"4","section":"4.1","warning":false,"warningText":""},{"id":"116","number":116,"type":"fill","typeLabel":"填空题","text":"社会主义的本质，是解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到＿＿。","options":[],"answer":"共同富裕","explanation":"","source":"第六章·第二节","chapter":"6","section":"6.2","warning":false,"warningText":""},{"id":"117","number":117,"type":"fill","typeLabel":"填空题","text":"我国处在社会主义＿＿，这是邓小平和我们党对当代中国基本国情的科学判断。","options":[],"answer":"初级阶段","explanation":"","source":"第六章·第二节","chapter":"6","section":"6.2","warning":false,"warningText":""},{"id":"118","number":118,"type":"fill","typeLabel":"填空题","text":"社会主义的根本任务是＿＿。","options":[],"answer":"发展生产力","explanation":"","source":"第六章·第二节","chapter":"6","section":"6.2","warning":false,"warningText":""},{"id":"119","number":119,"type":"fill","typeLabel":"填空题","text":"邓小平深刻概括出\"＿＿是第一生产力\"这个新论断。","options":[],"answer":"科学技术","explanation":"","source":"第六章·第二节","chapter":"6","section":"6.2","warning":false,"warningText":""},{"id":"120","number":120,"type":"fill","typeLabel":"填空题","text":"＿＿是党执政兴国的第一要务。","options":[],"answer":"发展","explanation":"","source":"第七章·第二节","chapter":"7","section":"7.2","warning":false,"warningText":""},{"id":"121","number":121,"type":"fill","typeLabel":"填空题","text":"科学发展观的根本方法是＿＿。","options":[],"answer":"统筹兼顾","explanation":"","source":"第八章·第二节","chapter":"8","section":"8.2","warning":false,"warningText":""},{"id":"122","number":122,"type":"short","typeLabel":"简答题","text":"如何理解马克思主义中国化时代化的内涵？","options":[],"answer":"马克思主义中国化时代化，就是把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化 相结合（\"两个结合\"），坚持运用辩证唯物主义和历史唯物主义，从理论和实践的结合上深入回答关系党和 国家事业发展、党治国理政的重大时代课题，不断提出真正解决问题的新理念新思路新办法。它既包括立足 中国实际运用马克思主义解决中国问题的过程，也包括用中国人民喜闻乐见的民族语言阐述马克思主义、使 其具有中国特色中国风格中国气派的过程。","explanation":"","source":"导论·第一节 · P4-5","chapter":"导论","section":"导论.1","warning":false,"warningText":""},{"id":"123","number":123,"type":"short","typeLabel":"简答题","text":"如何把握毛泽东思想的主要内容？","options":[],"answer":"毛泽东思想的主要内容有：①新民主主义革命理论；②社会主义革命和社会主义建设理论；③革命军 队建设和军事战略的理论；④政策和策略的理论；⑤思想政治工作和文化工作的理论；⑥党的建设理论。这 些内容紧紧围绕中国革命和建设的主题，构成一个完整的科学思想体系。","explanation":"","source":"第一章·第二节 · P20-25","chapter":"1","section":"1.2","warning":false,"warningText":""},{"id":"124","number":124,"type":"short","typeLabel":"简答题","text":"如何科学认识毛泽东思想的历史地位？","options":[],"answer":"①毛泽东思想是马克思主义中国化第一次历史性飞跃的理论成果，是马克思主义中国化的第一个重大 理论成果；②毛泽东思想是中国革命和建设的科学指南，指导中国革命和建设取得胜利；③毛泽东思想是中 国共产党和中国人民宝贵的精神财富。评价依据是1981年《关于建国以来党的若干历史问题的决议》：毛泽 东的功绩是第一位的、错误是第二位的，要把毛泽东晚年错误同毛泽东思想区别开来。","explanation":"","source":"第一章·第三节 · P32-35","chapter":"1","section":"1.3","warning":false,"warningText":""},{"id":"125","number":125,"type":"short","typeLabel":"简答题","text":"怎样把握毛泽东思想活的灵魂？","options":[],"answer":"毛泽东思想的活的灵魂是贯穿于毛泽东思想各个组成部分的立场、观点和方法，包括三个基本方面： ①实事求是——一切从实际出发，理论联系实际，坚持在实践中检验真理和发展真理；②群众路线——一切 为了群众，一切依靠群众，从群众中来，到群众中去，把党的正确主张变为群众的自觉行动；③独立自主 ——坚持独立思考，走自己的路，坚定不移维护民族独立、捍卫国家主权，把立足点放在依靠自己力量的基 础上，同时积极争取外援、学习外国一切对我们有益的先进事物。","explanation":"","source":"第一章·第二节 · P26、29、30","chapter":"1","section":"1.2","warning":false,"warningText":""},{"id":"126","number":126,"type":"short","typeLabel":"简答题","text":"新民主主义基本纲领的主要内容是什么？","options":[],"answer":"①政治纲领：推翻帝国主义和封建主义的统治，建立一个无产阶级领导的、以工农联盟为基础的、各 革命阶级联合专政的新民主主义共和国；②经济纲领：没收封建地主阶级的土地归农民所有，没收官僚资产 阶级的垄断资本归新民主主义国家所有，保护民族工商业；③文化纲领：新民主主义文化是无产阶级领导的、 人民大众的、反帝反封建的文化，即民族的、科学的、大众的文化。","explanation":"","source":"第二章·第二节 · P52-54","chapter":"2","section":"2.2","warning":false,"warningText":""},{"id":"127","number":127,"type":"short","typeLabel":"简答题","text":"新民主主义革命的基本经验（三大法宝）及其相互关系是什么？","options":[],"answer":"统一战线、武装斗争、党的建设是中国革命克敌制胜的三大法宝。相互关系：统一战线和武装斗争是 中国革命的两个基本特点，是战胜敌人的两个基本武器；统一战线是实行武装斗争的统一战线，武装斗争是 统一战线的中心支柱；党的组织则是掌握统一战线和武装斗争这两个武器以实行对敌冲锋陷阵的英勇战士。","explanation":"","source":"第二章·第三节 · P59、64","chapter":"2","section":"2.3","warning":false,"warningText":""},{"id":"128","number":128,"type":"short","typeLabel":"简答题","text":"党建立、巩固和发展统一战线的实践经验有哪些？","options":[],"answer":"①建立巩固的工农联盟；②正确对待资产阶级尤其是民族资产阶级，依据革命需要实行既联合又斗争 的策略；③采取区别对待的方针，坚持发展进步势力、争取中间势力、孤立顽固势力；④坚持独立自主的原 则，保持党在政治上、组织上、思想上的独立性。","explanation":"","source":"第二章·第三节 · P59、64","chapter":"2","section":"2.3","warning":false,"warningText":""},{"id":"129","number":129,"type":"short","typeLabel":"简答题","text":"为什么说新民主主义革命是新式的特殊的资产阶级民主主义革命？","options":[],"answer":"①从革命性质看，新民主主义革命不是社会主义革命，仍属资产阶级民主主义革命范畴，但它不是旧 式的资产阶级民主革命；②它有新的领导阶级——无产阶级及其政党（中国共产党）；③有新的指导思想 ——马克思列宁主义；④有新的革命前途——社会主义；⑤它属于世界无产阶级社会主义革命的一部分。故 称\"新式的特殊的资产阶级民主主义革命\"。","explanation":"","source":"第二章·第二节","chapter":"2","section":"2.2","warning":false,"warningText":""},{"id":"130","number":130,"type":"short","typeLabel":"简答题","text":"我国社会主义改造的历史经验有哪些？","options":[],"answer":"①坚持社会主义工业化建设与社会主义改造同时并举（\"一化三改\"，工业化是主体、改造是两翼，相 辅相成）；②采取积极引导、逐步过渡的方式（农业经互助组、初级社、高级社，资本主义工商业经国家资 本主义由低级到高级逐步过渡）；③进行和平改造（对资本主义工商业采取和平赎买，把对企业的改造和对 资本家的改造结合起来）。","explanation":"","source":"第三章·第二节 · P83-85","chapter":"3","section":"3.2","warning":false,"warningText":""},{"id":"131","number":131,"type":"short","typeLabel":"简答题","text":"简述适合我国情况的农业社会主义改造道路。","options":[],"answer":"对个体农业采取积极领导、稳步前进的方针，遵循自愿互利、典型示范、国家帮助的原则，经历由互 助组（社会主义萌芽性质）到初级农业生产合作社（半社会主义性质）、再到高级农业生产合作社（社会主 义性质）三个发展阶段，引导个体农民走互助合作道路，把农民个体经济逐步改造为社会主义集体经济。","explanation":"","source":"第三章·第二节 · P76-78","chapter":"3","section":"3.2","warning":false,"warningText":""},{"id":"132","number":132,"type":"short","typeLabel":"简答题","text":"党在过渡时期总路线的主要内容是什么？","options":[],"answer":"党在过渡时期的总路线和总任务是：在一个相当长的时期内，逐步实现国家的社会主义工业化，并逐 步实现国家对农业、对手工业和对资本主义工商业的社会主义改造，即\"一化三改\"。社会主义工业化是\"主 体\"，三大改造是\"两翼\"，二者相辅相成、相互促进，体现了社会主义建设和社会主义改造同时并举。","explanation":"","source":"第三章·第一节","chapter":"3","section":"3.1","warning":false,"warningText":""},{"id":"133","number":133,"type":"short","typeLabel":"简答题","text":"简述社会主义建设道路初步探索的重要理论成果。","options":[],"answer":"①调动一切积极因素为社会主义事业服务的方针（《论十大关系》）；②正确认识和处理社会主义社 会矛盾的思想（两类不同性质的矛盾学说）；③走中国工业化道路的思想（以农业为基础、以工业为主导、 以农轻重为序）；④初步探索的其他理论成果：社会主义发展阶段、\"四个现代化\"战略目标，以及科学教育 文化、知识分子工作、国防建设、祖国统一和外交工作、执政党建设等重要思想理论观点。","explanation":"","source":"第四章·第一节 · P93、97、101、103","chapter":"4","section":"4.1","warning":false,"warningText":""},{"id":"134","number":134,"type":"short","typeLabel":"简答题","text":"党对社会主义建设道路初步探索的重大意义有哪些？","options":[],"answer":"①巩固和发展了我国的社会主义制度；②为开创中国特色社会主义提供了宝贵经验、理论准备和物质 基础；③丰富了科学社会主义的理论和实践。","explanation":"","source":"第四章·第二节 · P110-111","chapter":"4","section":"4.2","warning":false,"warningText":""},{"id":"135","number":135,"type":"short","typeLabel":"简答题","text":"中国特色社会主义理论体系形成发展的社会历史条件是什么？","options":[],"answer":"①国际背景：和平与发展成为时代主题，科学技术成为先进生产力的主要标志，世界多极化、经济全 球化不可逆转；②历史条件：对我国社会主义建设经验教训的总结、对国际社会主义建设经验教训的总结， 科学判断党和国家发展所处的历史方位；③实践基础：党领导的改革开放和社会主义现代化建设的生动实践。","explanation":"","source":"第五章·第一节","chapter":"5","section":"5.1","warning":false,"warningText":""},{"id":"136","number":136,"type":"short","typeLabel":"简答题","text":"简述社会主义的本质。","options":[],"answer":"社会主义的本质，是解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕。这一 概括一方面强调社会主义必须集中力量解放和发展生产力，另一方面指明解放和发展生产力的手段和目的， 突出了最终达到共同富裕的社会主义目标，把对社会主义的认识提高到新的科学水平。","explanation":"","source":"第六章·第二节 · P152","chapter":"6","section":"6.2","warning":false,"warningText":""},{"id":"137","number":137,"type":"short","typeLabel":"简答题","text":"邓小平理论的主要内容有哪些？","options":[],"answer":"邓小平理论围绕\"什么是社会主义、怎样建设社会主义\"这一首要的基本理论问题，主要内容包括：① 社会主义本质论；②社会主义初级阶段理论（总依据）与党的基本路线（一个中心、两个基本点）；③改革 开放理论（改革是第二次革命、是社会主义社会发展的直接动力，\"三个有利于\"标准）；④社会主义市场经 济理论（党的十四大确立改革目标）；⑤\"三步走\"发展战略；⑥\"一国两制\"统一祖国构想；⑦\"科学技术是 第一生产力\"；⑧坚持公有制为主体、共同富裕原则，两手抓、两手都要硬，培养\"四化\"干部等。","explanation":"","source":"第六章·第二节 · P156-183","chapter":"6","section":"6.2","warning":false,"warningText":""},{"id":"138","number":138,"type":"short","typeLabel":"简答题","text":"解放思想和实事求是的关系是什么？","options":[],"answer":"解放思想、实事求是是党的思想路线，二者辩证统一：①解放思想是实事求是的前提——要恢复实事 求是的思想传统就必须解放思想，只有解放思想才能达到实事求是；②实事求是是解放思想的目的——解放 思想是为了达到新的实事求是，离开了实事求是轨道就会出现\"左\"或右的错误倾向；③解放思想和实事求是 是统一的，解放思想并不等于随心所欲，必须同实事求是相联系，不能割裂对立。","explanation":"","source":"第六章·第二节","chapter":"6","section":"6.2","warning":false,"warningText":""},{"id":"139","number":139,"type":"short","typeLabel":"简答题","text":"\"三个代表\"重要思想的核心观点是什么？","options":[],"answer":"中国共产党必须始终代表中国先进生产力的发展要求，代表中国先进文化的前进方向，代表中国最广 大人民的根本利益。三者是统一的整体，相互联系、相互促进：发展先进生产力是发展先进文化、实现最广 大人民根本利益的基础条件；人民群众是先进生产力和先进文化的创造主体；不断发展先进生产力和先进文 化，归根到底都是为了不断实现最广大人民的根本利益。","explanation":"","source":"第七章·第二节","chapter":"7","section":"7.2","warning":false,"warningText":""},{"id":"140","number":140,"type":"short","typeLabel":"简答题","text":"简述科学发展观的科学内涵。","options":[],"answer":"科学发展观，第一要义是推动经济社会发展，在当代中国坚持发展是硬道理的本质要求就是坚持科学 发展；核心立场是以人为本，始终把最广大人民的根本利益作为党和国家工作的出发点和落脚点；基本要求 是全面协调可持续，坚持生产发展、生活富裕、生态良好的文明发展道路；根本方法是统筹兼顾。","explanation":"","source":"第八章·第二节","chapter":"8","section":"8.2","warning":false,"warningText":""},{"id":"141","number":141,"type":"short","typeLabel":"简答题","text":"如何坚持科学发展观？","options":[],"answer":"①坚持科学发展，必须加快转变经济发展方式；②坚持科学发展，必须推动科学技术的跨越式发展； ③坚持科学发展，必须培养高素质创新型人才；④坚持科学发展，必须善于抓住和用好机遇。","explanation":"","source":"第八章·第二节","chapter":"8","section":"8.2","warning":false,"warningText":""},{"id":"142","number":142,"type":"essay","typeLabel":"论述题","text":"结合中国革命和建设实践，论述如何理解毛泽东思想活的灵魂。","options":[],"answer":"毛泽东思想活的灵魂是实事求是、群众路线、独立自主三个基本方面，是贯穿于毛泽东思想各个组成 部分的立场、观点和方法。第一，实事求是：一切从实际出发，理论联系实际，坚持在实践中检验真理和发 展真理。实事求是是毛泽东思想的精髓，是党的思想路线。坚持实事求是，就要深入实际把握事物内在必然 联系、按客观规律办事，就要清醒认识我国基本国情，就要不断推进实践基础上的理论创新。第二，群众路 线：一切为了群众，一切依靠群众，从群众中来，到群众中去。群众路线是党的生命线和根本工作路线，本 质上是马克思主义关于人民群众是历史创造者原理的体现。第三，独立自主：坚持独立思考、走自己的路， 把国家和民族发展放在自己力量的基点上，同时积极争取外援。实践证明，三个基本方面是指导中国革命和 建设取得胜利的根本立场观点方法，将长期指导我们的行动。","explanation":"","source":"第一章·第二节 · P26、29、30","chapter":"1","section":"1.2","warning":false,"warningText":""},{"id":"143","number":143,"type":"essay","typeLabel":"论述题","text":"结合近代中国国情，分析农村包围城市、武装夺取政权革命道路形成的必然性。","options":[],"answer":"第一，必要性：①近代中国内无民主制度而受封建主义压迫，外无民族独立而受帝国主义压迫，无产 阶级不可能像资本主义国家那样先在城市进行合法斗争再武装起义，中国革命的主要斗争形式只能是武装斗 争；②近代中国是农业大国，农民占人口绝大多数，是无产阶级可靠的同盟军和革命的主力军，必须充分发 动农民。第二，可能性：①中国是多个帝国主义间接统治的政治经济发展极不平衡的国家，四分五裂、军阀 割据，存在统治薄弱环节，为农村革命根据地建设提供了缝隙和可能；②广大农村受多重压迫、人民革命愿 望强烈，革命群众基础好；③全国革命形势继续向前发展；④相当力量正式红军的存在；⑤党的领导的有力 量及其政策的正确。这一道路是马克思主义基本原理与中国国情相结合的伟大创造。","explanation":"","source":"第二章·第三节 · P57-58","chapter":"2","section":"2.3","warning":false,"warningText":""},{"id":"144","number":144,"type":"essay","typeLabel":"论述题","text":"如何理解中国确立社会主义基本制度的重大意义？","options":[],"answer":"①社会主义基本制度的确立是中国历史上最深刻最伟大的社会变革，为当代中国一切发展进步奠定了 根本政治前提和制度基础，也为中国特色社会主义制度的创新和发展提供了重要前提；②极大地提高了工人 阶级和广大劳动人民的积极性、创造性，极大地促进了我国社会生产力的发展，使广大劳动人民真正成为国 家的主人；③使占世界人口四分之一的东方大国进入社会主义社会，是世界社会主义发展史上又一个历史性 的伟大胜利，进一步改变了世界政治经济格局，增强了社会主义的力量；④是以毛泽东为主要代表的中国共 产党人对脱胎于半殖民地半封建的东方大国如何进行社会主义革命问题的系统回答，是马克思列宁主义关于 社会主义革命理论在中国的正确运用和创造性发展，丰富和发展了科学社会主义理论。","explanation":"","source":"第三章·第三节 · P89-91","chapter":"3","section":"3.3","warning":false,"warningText":""},{"id":"145","number":145,"type":"essay","typeLabel":"论述题","text":"谈谈你对党在社会主义建设道路初步探索中经验教训的认识。","options":[],"answer":"初步探索取得了重要理论成果（调动一切积极因素、正确处理两类矛盾、走中国工业化道路等），巩 固和发展了社会主义制度，为开创中国特色社会主义提供了宝贵经验、理论准备和物质基础。但探索中也经 历了曲折，其经验教训深刻：①必须把马克思主义与中国实际相结合，探索符合中国特点的社会主义建设道 路，不能照搬苏联模式；②必须正确认识社会主义社会的主要矛盾和根本任务，集中力量发展生产力，不能 以阶级斗争为纲；③必须从实际出发进行社会主义建设，建设规模和速度要和国力相适应，不能急于求成（\" 大跃进\"教训）；④必须发展社会主义民主，健全社会主义法制；⑤必须坚持党的民主集中制和集体领导制 度，加强执政党建设；⑥必须坚持对外开放，借鉴和吸收人类文明成果建设社会主义，不能关起门来搞建设。 这些经验教训为开创中国特色社会主义提供了重要借鉴。","explanation":"","source":"第四章·第二节 · P112-115","chapter":"4","section":"4.2","warning":false,"warningText":""},{"id":"146","number":146,"type":"essay","typeLabel":"论述题","text":"结合《论十大关系》，论述\"调动一切积极因素为社会主义事业服务\"的方针。","options":[],"answer":"1956年毛泽东发表《论十大关系》，提出围绕\"调动一切积极因素为社会主义事业服务\"的基本方针， 系统论述了重工业和轻工业农业、沿海工业和内地工业、经济建设和国防建设、国家生产单位和生产者个人、 中央和地方、汉族和少数民族、党和非党、革命和反革命、是非、中国和外国等十个方面的关系，标志着党 探索中国社会主义建设道路的良好开端。调动一切积极因素，就是要在党的领导下，最大限度地团结全国各 族人民、各民主党派、各方面力量，化消极因素为积极因素，为社会主义建设服务。这一方针是党关于社会 主义建设的一条极为重要的方针，对于建设社会主义现代化国家具有长远的指导意义。","explanation":"","source":"第四章·第一节 · P93","chapter":"4","section":"4.1","warning":false,"warningText":""},{"id":"147","number":147,"type":"essay","typeLabel":"论述题","text":"结合邓小平理论的学习，谈谈你如何理解邓小平理论是中国特色社会主义理论体系的开篇之作。","options":[],"answer":"邓小平理论围绕\"什么是社会主义、怎样建设社会主义\"这一首要的基本理论问题，深刻揭示了社会主 义的本质是解放生产力、发展生产力，消灭剥削、消除两极分化，最终达到共同富裕；提出社会主义初级阶 段理论，确立\"一个中心、两个基本点\"的基本路线；作出改革开放的历史性决策，提出社会主义市场经济理 论、\"三步走\"发展战略、\"一国两制\"构想等，第一次比较系统地初步回答了中国这样经济文化比较落后的国 家如何建设社会主义、如何巩固和发展社会主义的一系列基本问题。作为开篇之作，它为\"三个代表\"重要思 想、科学发展观等后续理论创新奠定了理论基础、提供了基本遵循，成功开创了中国特色社会主义道路和理 论，是中国特色社会主义理论体系的历史起点和逻辑起点。","explanation":"","source":"第六章·第三节 · P187-188","chapter":"6","section":"6.3","warning":false,"warningText":""},{"id":"148","number":148,"type":"essay","typeLabel":"论述题","text":"论述邓小平社会主义本质论的科学内涵及其重大意义。","options":[],"answer":"内涵：社会主义的本质是解放生产力、发展生产力，消灭剥削、消除两极分化，最终达到共同富裕。 一方面，强调社会主义必须集中力量解放和发展生产力，这是社会主义的根本任务；另一方面，指明解放和 发展生产力的手段和目的——消灭剥削、消除两极分化，最终达到共同富裕，突出了社会主义的发展目标， 体现了生产力与生产关系的统一。重大意义：①继承和发展了科学社会主义的基本原则，把对社会主义的认 识提高到新的科学水平；②突破了把计划经济等原本不属于社会主义固有的东西当作社会主义本质特征的传 统观念，回答了\"什么是社会主义\"这一长期困扰人们的根本问题；③为我们坚持和完善社会主义制度、推进 改革开放指明了方向，提供了根本依据。","explanation":"","source":"第六章·第二节 · P152","chapter":"6","section":"6.2","warning":false,"warningText":""},{"id":"149","number":149,"type":"essay","typeLabel":"论述题","text":"论述\"三个代表\"重要思想的主要内容及其历史地位。","options":[],"answer":"主要内容：①发展是党执政兴国的第一要务，中国解决所有问题的关键在于依靠自己的发展；②建立 社会主义市场经济体制，使市场在国家宏观调控下对资源配置起基础性作用；③全面建设小康社会，提出\" 三步走\"战略第三步的具体规划；④建设社会主义政治文明，最根本的是坚持党的领导、人民当家作主和依 法治国的有机统一；⑤实施\"引进来\"和\"走出去\"相结合的对外开放战略；⑥推进党的建设新的伟大工程，解 决提高党的领导水平和执政水平、提高拒腐防变和抵御风险能力两大历史性课题。历史地位：\"三个代表\"重 要思想是对马克思列宁主义、毛泽东思想、邓小平理论的继承和发展，是中国特色社会主义理论体系的接续 发展，是加强和改进党的建设、推进中国特色社会主义事业不断自我完善和发展的强大理论武器。","explanation":"","source":"第七章·第二节","chapter":"7","section":"7.2","warning":false,"warningText":""},{"id":"150","number":150,"type":"essay","typeLabel":"论述题","text":"论述科学发展观\"以人为本\"核心立场的科学内涵及其实践要求。","options":[],"answer":"以人为本是科学发展观的核心立场，集中体现了马克思主义历史唯物论关于人民群众是历史创造者的 基本原理，体现了我们党全心全意为人民服务的根本宗旨和推动经济社会发展的根本目的。其科学内涵：坚 持以人为本，就是要坚持全心全意为人民服务，始终把最广大人民的根本利益作为党和国家工作的根本出发 点和落脚点；坚持发展为了人民、发展依靠人民、发展成果由人民共享；尊重社会发展规律与尊重人民历史 主体地位相一致、为崇高理想奋斗与为最广大人民谋利益相统一。实践要求：①在经济建设上把保障和改善 民生放在突出位置，着力解决人民群众最关心最直接最现实的利益问题；②在政治上保证人民当家作主，发 展社会主义民主政治；③促进社会公平正义，构建社会主义和谐社会；④促进人的全面发展。","explanation":"","source":"第八章·第二节","chapter":"8","section":"8.2","warning":false,"warningText":""},{"id":"151","number":151,"type":"essay","typeLabel":"论述题","text":"材料分析：长期以来，人类创造了前所未有的经济增长成就，但一些国家也出现了经济结构失衡、能源 资源紧张、生态环境恶化等问题。请运用科学发展观说明如何走出一条可持续发展的文明发展道路。","options":[],"answer":"材料反映了传统发展方式的弊端：片面追求经济增长，忽视资源环境承载力和生态平衡。科学发展观 强调，第一要义是发展，基本要求是全面协调可持续。坚持可持续发展，必须走生产发展、生活富裕、生态 良好的文明发展道路：①建设生态文明，实质上就是要建设以资源环境承载力为基础、以自然规律为准则、 以可持续发展为目标的资源节约型、环境友好型社会；②坚持节约资源和保护环境的基本国策，坚持节约优 先、保护优先、自然恢复为主的方针；③推动形成绿色发展方式和生活方式，加快转变经济发展方式，实现 经济发展与人口、资源、环境相协调；④统筹人与自然和谐发展，正确认识和处理经济发展与生态保护的关 系，决不能以牺牲环境为代价换取一时经济增长。这体现了\"人与自然和谐相处\"的和谐社会发展要求，是对 人类文明发展规律的深刻把握。","explanation":"","source":"第八章·第二节","chapter":"8","section":"8.2","warning":false,"warningText":""},{"id":"152","number":152,"type":"single","typeLabel":"单选题","text":"历史和现实反复证明，马克思主义只有＿＿才能在中国大地上闪耀真理光芒，也 只有实现中国化时代 化才能救中国、发展中国，才能实现中华民族的伟大复兴","options":[{"text":"中国化","correct":false},{"text":"时代化","correct":false},{"text":"中国化时代化","correct":true},{"text":"科学化","correct":false}],"answer":"C","explanation":"","source":"导论·马克思主义中国化时代化的历史进程与理论成果","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"153","number":153,"type":"single","typeLabel":"单选题","text":"党的＿＿明确把“不断谱写马克思主义中国化时代化新篇章”作为当代中国共产 党人的庄严历史责任 ，并提出了继续推进马克思主义中国化时代化的新要求","options":[{"text":"十九大","correct":false},{"text":"二十大","correct":true},{"text":"十八大","correct":false},{"text":"十七大","correct":false}],"answer":"B","explanation":"","source":"导论·马克思主义中国化时代化的历史进程与理论成果","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"154","number":154,"type":"multiple","typeLabel":"多选题","text":"马克思主义中国化时代化，就是要＿＿，坚持运用辩证唯物主义和历史唯物主 义，从理论和实践的结 合上深入回答关系党和国家事业发展、党治国理政的重大时代课题， 不断提出真正解决问题的新理念 新思路新办法","options":[{"text":"增强问题意识","correct":true},{"text":"站稳人民立场","correct":true},{"text":"洞察时代风云","correct":true},{"text":"把握时代大势","correct":true}],"answer":"ABCD","explanation":"","source":"导论·马克思主义中国化时代化的历史进程与理论成果","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"155","number":155,"type":"multiple","typeLabel":"多选题","text":"坚持和发展马克思主义，必须同＿＿相结合","options":[{"text":"中华优秀传统文化","correct":true},{"text":"人民群众","correct":false},{"text":"中国具体实际相结合","correct":true},{"text":"党的领导","correct":false}],"answer":"AC","explanation":"","source":"导论·马克思主义中国化时代化的历史进程与理论成果","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"156","number":156,"type":"multiple","typeLabel":"多选题","text":"用好本教材、学好本课程，我们要把握好以下几点＿＿：","options":[{"text":"掌握基本理论","correct":true},{"text":"培养理论思维","correct":true},{"text":"坚持理论联系实际","correct":true},{"text":"读原著","correct":false}],"answer":"ABC","explanation":"","source":"导论·马克思主义中国化时代化的历史进程与理论成果","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"157","number":157,"type":"short","typeLabel":"简答题","text":"如何理解马克思主义中国化时代化的理论成果是一脉相承又与时俱进的关系","options":[],"answer":"(1)毛泽东思想所蕴含的马克思主义的立场、观点和方法，为中国特色社会主义理 论 体系提供了基 本遵循。 （2）中国特色社会主义理论体系在新的历史条件下进一步丰富和发展了毛泽东思想。 （3）毛泽 东思想和中国特色社会主义理论体系，都是马克思列宁主义在中国的运用和 发展， 都以独创性的理论成果 丰富和发展了马克思主义的理论宝库。","explanation":"","source":"导论·马克思主义中国化时代化的历史进程与理论成果","chapter":"导论","section":"导论.0","warning":false,"warningText":""},{"id":"158","number":158,"type":"single","typeLabel":"单选题","text":"毛泽东是毛泽东思想形成和发展过程中的＿＿","options":[{"text":"唯一创立者 B.主要创立者 C.创立者","correct":false},{"text":"创立者之一","correct":true}],"answer":"B","explanation":"","source":"第一章·毛泽东思想及其历史地位","chapter":"1","section":"1.0","warning":true,"warningText":"原题库选项结构异常，参考答案按资料保留，请核对原题库。"},{"id":"159","number":159,"type":"single","typeLabel":"单选题","text":"＿＿确立毛泽东思想作为党的指导思想","options":[{"text":"中共一大","correct":false},{"text":"中共二大","correct":false},{"text":"中共七大","correct":true}],"answer":"C","explanation":"","source":"第一章·毛泽东思想及其历史地位","chapter":"1","section":"1.0","warning":false,"warningText":""},{"id":"160","number":160,"type":"single","typeLabel":"单选题","text":"在中国共产党的历史上第一次提出毛泽东思想这个概念的是＿＿","options":[{"text":"刘少奇","correct":false},{"text":"朱德 C．邓小平","correct":false},{"text":"王稼祥","correct":false},{"text":"原资料缺失该选项（参考答案：D）","correct":true}],"answer":"D","explanation":"","source":"第一章·毛泽东思想及其历史地位","chapter":"1","section":"1.0","warning":true,"warningText":"原题库选项结构异常，参考答案按资料保留，请核对原题库。"},{"id":"161","number":161,"type":"single","typeLabel":"单选题","
